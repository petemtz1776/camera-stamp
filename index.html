<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

h2 {
  text-align: center;
  margin: 5px 0 15px 0;
}


/*==================================================
 CONTENEDOR
==================================================*/

#cameraContainer {

  width:100%;
  max-width:800px;
  margin:auto;
  position:relative;
  background:#000;
  border-radius:10px;
  overflow:hidden;

}


/*==================================================
 VIDEO
==================================================*/

#video {

  width:100%;
  display:block;
  background:#000;

}


#canvas {

  display:none;

}


/*==================================================
 VISOR DE FLECHA
==================================================*/

#arrowEditor {

  display:none;

  position:relative;

  width:100%;

  background:#000;

}


#arrowCanvas {

  width:100%;

  display:block;

  background:#000;

  cursor:crosshair;

  touch-action:none;

}


/*==================================================
 BOTONES
==================================================*/

#cameraControls {

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:6px;

  padding:10px;

  background:linear-gradient(
    transparent,
    rgba(0,0,0,.85)
  );

  z-index:10;

}


/* BOTONES PEQUEÑOS */

#cameraControls button {

  flex:0 1 auto;

  min-height:42px;

  min-width:85px;

  max-width:135px;

  padding:8px 10px;

  font-size:13px;

  font-weight:bold;

  border:none;

  border-radius:7px;

  cursor:pointer;

  white-space:nowrap;

}


/*==================================================
 COLORES
==================================================*/

#startButton {

  background:#2196f3;

  color:white;

}


#takeButton {

  background:#4caf50;

  color:white;

}


#signalButton {

  background:#00a83b;

  color:white;

}


#signalButton.active {

  background:#00852f;

  box-shadow:
    0 0 0 3px rgba(0,255,100,.30);

}


#cancelButton {

  background:#f44336;

  color:white;

}


#confirmButton {

  background:#4caf50;

  color:white;

  display:none;

}


#cancelSignalButton {

  background:#f44336;

  color:white;

  display:none;

}


#cameraControls button:disabled {

  opacity:.4;

}


/*==================================================
 PREVIEW
==================================================*/

#preview {

  width:100%;

  max-width:800px;

  display:none;

  margin:15px auto;

  border-radius:8px;

}


/*==================================================
 STATUS
==================================================*/

#status {

  display:none;

}


/*==================================================
 CELULAR
==================================================*/

@media(max-width:600px){

  body {

    padding:0;

    background:#000;

  }


  #cameraContainer {

    width:100vw;

    height:100vh;

    max-width:none;

    border-radius:0;

  }


  #video {

    width:100vw;

    height:100vh;

    object-fit:cover;

  }


  #arrowEditor {

    width:100vw;

    height:100vh;

  }


  #arrowCanvas {

    width:100vw;

    height:100vh;

    object-fit:contain;

  }


  #cameraControls {

    padding:

      8px

      6px

      calc(8px + env(safe-area-inset-bottom));

    gap:5px;

  }


  #cameraControls button {

    min-height:40px;

    min-width:72px;

    max-width:110px;

    padding:7px 8px;

    font-size:12px;

  }

}


</style>

</head>

<body>


<div id="cameraContainer">

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <canvas id="canvas"></canvas>


  <!-- ============================================
       VISOR DE FLECHA
  ============================================= -->

  <div id="arrowEditor">

    <canvas
      id="arrowCanvas">
    </canvas>

  </div>


  <div id="cameraControls">


    <button
      id="startButton">
      📷 START
    </button>


    <button
      id="signalButton">
      🎯 SEÑALAR
    </button>


    <button
      id="takeButton"
      disabled>
      📸 TOMAR
    </button>


    <button
      id="confirmButton">
      ✅ USAR
    </button>


    <button
      id="cancelSignalButton">
      ❌ CANCELAR
    </button>


    <button
      id="cancelButton">
      ✕ SALIR
    </button>


  </div>

</div>


<img id="preview">


<div id="status"></div>


<script>

/*
====================================================
 DATOS RECIBIDOS DEL FORMULARIO
====================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const tipo =
  params.get("tipo") || "poste";


const proyecto =
  params.get("proyecto") || "";


const tipoProyecto =
  params.get("tipoProyecto") || "";


const hub =
  params.get("hub") || "";


const rama =
  params.get("rama") || "";


console.log(
  "DATOS RECIBIDOS:",
  {
    tipo,
    proyecto,
    tipoProyecto,
    hub,
    rama
  }
);


/*
====================================================
 ELEMENTOS
====================================================
*/

const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const preview =
  document.getElementById("preview");


const startButton =
  document.getElementById("startButton");


const signalButton =
  document.getElementById("signalButton");


const takeButton =
  document.getElementById("takeButton");


const confirmButton =
  document.getElementById("confirmButton");


const cancelSignalButton =
  document.getElementById(
    "cancelSignalButton"
  );


const cancelButton =
  document.getElementById("cancelButton");


const status =
  document.getElementById("status");


const arrowEditor =
  document.getElementById(
    "arrowEditor"
  );


const arrowCanvas =
  document.getElementById(
    "arrowCanvas"
  );


/*
====================================================
 VARIABLES
====================================================
*/

let stream = null;

let modoSenalar = false;

let colocandoFlecha = false;

let fotoBase = null;

let gpsActual = null;


/*
====================================================
 VARIABLES DE LA FLECHA
====================================================
*/

/*
 * Punto al que apunta la flecha
 */

let flechaX = null;

let flechaY = null;


/*
 * Ángulo de la flecha
 */

let flechaAngulo =
  -Math.PI / 4;


/*
 * Tamaño
 */

let flechaEscala =
  1;


/*
 * Datos para interacción táctil
 */

let touchInicioX = null;

let touchInicioY = null;

let touchInicioDistancia = null;

let touchInicioAngulo = null;

let touchInicioFlechaX = null;

let touchInicioFlechaY = null;

let touchInicioEscala = null;

let touchInicioRotacion = null;

let arrastrandoFlecha = false;


/*
====================================================
 INICIAR CÁMARA
====================================================
*/

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara."
      );

    }


    detenerCamara();


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.disabled =
      false;


    status.textContent =
      "Cámara lista.\n\n" +
      "Puedes tomar la foto directamente " +
      "o activar SEÑALAR.";

  }
  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    status.textContent =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n" +
      error.name +
      "\n" +
      error.message;


    startButton.style.display =
      "block";


    takeButton.disabled =
      true;

  }

}


/*
====================================================
 SEÑALAR
====================================================
*/

signalButton.addEventListener(
  "click",
  activarSenalar
);


function activarSenalar(){

  modoSenalar =
    !modoSenalar;


  if(modoSenalar){

    signalButton.classList.add(
      "active"
    );


    signalButton.textContent =
      "🎯 ACTIVADO";


    status.textContent =
      "SEÑALAR ACTIVADO.\n\n" +
      "Toma la fotografía y después " +
      "coloca la flecha.";

  }
  else{

    desactivarSenalar();

  }

}


/*
====================================================
 DESACTIVAR SEÑALAR
====================================================
*/

function desactivarSenalar(){

  modoSenalar =
    false;


  signalButton.classList.remove(
    "active"
  );


  signalButton.textContent =
    "🎯 SEÑALAR";

}


/*
====================================================
 TOMAR FOTO
====================================================
*/

takeButton.addEventListener(
  "click",
  tomarFoto
);


async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(
        "La cámara no está iniciada."
      );

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    /*
    ================================================
     GPS
    ================================================
    */

    status.textContent =
      "Obteniendo ubicación GPS...";


    const posicion =
      await obtenerGPS();


    gpsActual =
      posicion;


    /*
    ================================================
     CANVAS
    ================================================
    */

    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    if(!ctx){

      throw new Error(
        "No fue posible crear el canvas."
      );

    }


    /*
    ================================================
     IMAGEN
    ================================================
    */

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
    ================================================
     FECHA
    ================================================
    */

    const ahora =
      new Date();


    const fecha =
      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =
      ahora.toLocaleTimeString(
        "es-MX"
      );


    /*
    ================================================
     ESCALA DEL ESTAMPADO
    ================================================
    */

    const escala =
      Math.max(
        width,
        height
      ) / 1200;


    const padding =
      Math.round(
        16 * escala
      );


    const font =
      Math.max(
        16,
        Math.round(
          20 * escala
        )
      );


    const altoLinea =
      Math.round(
        27 * escala
      );


    /*
    ================================================
     TEXTO
    ================================================
    */

    const lineas = [

      "PROYECTO: " +
        (
          proyecto ||
          "SIN PROYECTO"
        ),

      "TIPO PROYECTO: " +
        (
          tipoProyecto ||
          "SIN TIPO"
        ),

      "TIPO FOTO: " +
        obtenerNombreTipoFoto(tipo),

      fecha +
        "  " +
        hora,

      posicion

        ? "LAT: " +
          Number(
            posicion.lat
          ).toFixed(6) +
          "  LON: " +
          Number(
            posicion.lng
          ).toFixed(6)

        : "GPS: SIN UBICACIÓN"

    ];


    /*
    ================================================
     MEDIR ESTAMPADO
    ================================================
    */

    ctx.font =
      "bold " +
      font +
      "px Arial";


    let anchoTexto = 0;


    lineas.forEach(
      function(texto){

        const medida =
          ctx.measureText(
            texto
          ).width;


        if(
          medida >
          anchoTexto
        ){

          anchoTexto =
            medida;

        }

      }
    );


    const anchoCaja =
      anchoTexto +
      padding * 2;


    const altoCaja =
      lineas.length *
      altoLinea +
      padding * 2;


    const x =
      padding;


    const y =
      height -
      altoCaja -
      padding;


    /*
    ================================================
     CAJA
    ================================================
    */

    ctx.fillStyle =
      "rgba(0,0,0,.42)";


    ctx.beginPath();


    const radio =
      Math.round(
        10 * escala
      );


    ctx.roundRect(
      x,
      y,
      anchoCaja,
      altoCaja,
      radio
    );


    ctx.fill();


    /*
    ================================================
     TEXTO
    ================================================
    */

    ctx.fillStyle =
      "rgba(255,255,255,.95)";


    ctx.font =
      "bold " +
      font +
      "px Arial";


    ctx.textBaseline =
      "top";


    lineas.forEach(
      function(texto,index){

        ctx.fillText(

          texto,

          x + padding,

          y +
          padding +
          index *
          altoLinea

        );

      }
    );


    /*
    ================================================
     FOTO BASE
    ================================================
    */

    fotoBase =
      canvas.toDataURL(
        "image/jpeg",
        0.90
      );


    /*
    ================================================
     SIN FLECHA
    ================================================
    */

    if(!modoSenalar){

      enviarFotoFinal(
        fotoBase,
        ahora,
        posicion
      );

      return;

    }


    /*
    ================================================
     ABRIR VISOR
    ================================================
    */

    abrirVisorFlecha();

  }
  catch(error){

    console.error(
      "ERROR TOMANDO FOTO:",
      error
    );


    status.textContent =
      "ERROR AL TOMAR FOTO:\n\n" +
      error.message;

  }

}


/*
====================================================
 ABRIR VISOR
====================================================
*/

function abrirVisorFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      arrowCanvas.width =
        imagen.width;


      arrowCanvas.height =
        imagen.height;


      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      arrowEditor.style.display =
        "block";


      video.style.display =
        "none";


      signalButton.style.display =
        "none";


      takeButton.style.display =
        "none";


      confirmButton.style.display =
        "block";


      cancelSignalButton.style.display =
        "block";


      cancelButton.style.display =
        "none";


      colocandoFlecha =
        true;


      flechaX =
        null;


      flechaY =
        null;


      flechaEscala =
        1;


      flechaAngulo =
        -Math.PI / 4;


      status.textContent =
        "🎯 Toca donde quieres señalar.\n\n" +
        "Después puedes arrastrar la flecha, " +
        "hacerla más grande o pequeña y girarla.";

    };


  imagen.src =
    fotoBase;

}


/*
====================================================
 CLICK PARA COLOCAR
====================================================
*/

arrowCanvas.addEventListener(
  "click",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    /*
     * Si ya existe flecha,
     * el movimiento se controla por touch.
     */

    if(
      flechaX !== null
    ){

      return;

    }


    const punto =
      obtenerCoordenadasCanvas(
        event.clientX,
        event.clientY
      );


    if(
      puntoEstaEnEstampado(
        punto.x,
        punto.y
      )
    ){

      alert(
        "La flecha no puede colocarse sobre el estampado."
      );

      return;

    }


    flechaX =
      punto.x;


    flechaY =
      punto.y;


    dibujarFlecha();

  }
);


/*
====================================================
 OBTENER COORDENADAS
====================================================
*/

function obtenerCoordenadasCanvas(
  clientX,
  clientY
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        clientY -
        rect.top
      ) *
      escalaY

  };

}


/*
====================================================
 TOUCH START
====================================================
*/

arrowCanvas.addEventListener(
  "touchstart",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    event.preventDefault();


    /*
    ================================================
     PRIMER TOQUE
    ================================================
    */

    if(
      event.touches.length === 1
    ){

      const touch =
        event.touches[0];


      const punto =
        obtenerCoordenadasCanvas(
          touch.clientX,
          touch.clientY
        );


      /*
       * Si todavía no existe flecha,
       * colocarla.
       */

      if(
        flechaX === null
      ){

        if(
          puntoEstaEnEstampado(
            punto.x,
            punto.y
          )
        ){

          alert(
            "La flecha no puede colocarse sobre el estampado."
          );

          return;

        }


        flechaX =
          punto.x;


        flechaY =
          punto.y;


        dibujarFlecha();

        return;

      }


      /*
       * Verificar si tocó la flecha
       */

      if(
        puntoEstaCercaDeFlecha(
          punto.x,
          punto.y
        )
      ){

        arrastrandoFlecha =
          true;


        touchInicioX =
          punto.x;


        touchInicioY =
          punto.y;


        touchInicioFlechaX =
          flechaX;


        touchInicioFlechaY =
          flechaY;

      }

    }


    /*
    ================================================
     DOS DEDOS
    ================================================
    */

    if(
      event.touches.length === 2 &&
      flechaX !== null
    ){

      const t1 =
        event.touches[0];

      const t2 =
        event.touches[1];


      touchInicioDistancia =
        distanciaEntrePuntos(
          t1,
          t2
        );


      touchInicioAngulo =
        anguloEntrePuntos(
          t1,
          t2
        );


      touchInicioEscala =
        flechaEscala;


      touchInicioRotacion =
        flechaAngulo;

    }

  },
  {
    passive:false
  }
);


/*
====================================================
 TOUCH MOVE
====================================================
*/

arrowCanvas.addEventListener(
  "touchmove",
  function(event){

    if(
      !colocandoFlecha ||
      flechaX === null
    ){

      return;

    }


    event.preventDefault();


    /*
    ================================================
     UN DEDO = MOVER
    ================================================
    */

    if(
      event.touches.length === 1 &&
      arrastrandoFlecha
    ){

      const touch =
        event.touches[0];


      const punto =
        obtenerCoordenadasCanvas(
          touch.clientX,
          touch.clientY
        );


      const dx =
        punto.x -
        touchInicioX;


      const dy =
        punto.y -
        touchInicioY;


      const nuevoX =
        touchInicioFlechaX +
        dx;


      const nuevoY =
        touchInicioFlechaY +
        dy;


      /*
       * No permitir entrar al estampado
       */

      if(
        puntoEstaEnEstampado(
          nuevoX,
          nuevoY
        )
      ){

        return;

      }


      flechaX =
        nuevoX;


      flechaY =
        nuevoY;


      dibujarFlecha();

    }


    /*
    ================================================
     DOS DEDOS
     ESCALAR + GIRAR
    ================================================
    */

    if(
      event.touches.length === 2
    ){

      const t1 =
        event.touches[0];

      const t2 =
        event.touches[1];


      const distancia =
        distanciaEntrePuntos(
          t1,
          t2
        );


      const nuevoAngulo =
        anguloEntrePuntos(
          t1,
          t2
        );


      /*
       * CAMBIAR TAMAÑO
       */

      let nuevaEscala =
        touchInicioEscala *
        (
          distancia /
          touchInicioDistancia
        );


      nuevaEscala =
        Math.max(
          0.45,
          Math.min(
            2.5,
            nuevaEscala
          )
        );


      flechaEscala =
        nuevaEscala;


      /*
       * GIRAR
       */

      flechaAngulo =
        touchInicioRotacion +
        (
          nuevoAngulo -
          touchInicioAngulo
        );


      dibujarFlecha();

    }

  },
  {
    passive:false
  }
);


/*
====================================================
 TOUCH END
====================================================
*/

arrowCanvas.addEventListener(
  "touchend",
  function(event){

    if(
      event.touches.length === 0
    ){

      arrastrandoFlecha =
        false;

      touchInicioDistancia =
        null;

      touchInicioAngulo =
        null;

    }

  }
);


/*
====================================================
 DISTANCIA ENTRE DEDOS
====================================================
*/

function distanciaEntrePuntos(
  t1,
  t2
){

  const dx =
    t2.clientX -
    t1.clientX;


  const dy =
    t2.clientY -
    t1.clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/*
====================================================
 ÁNGULO ENTRE DEDOS
====================================================
*/

function anguloEntrePuntos(
  t1,
  t2
){

  return Math.atan2(

    t2.clientY -
    t1.clientY,

    t2.clientX -
    t1.clientX

  );

}


/*
====================================================
 VERIFICAR SI TOCÓ LA FLECHA
====================================================
*/

function puntoEstaCercaDeFlecha(
  x,
  y
){

  if(
    flechaX === null
  ){

    return false;

  }


  const escala =
    Math.max(
      arrowCanvas.width,
      arrowCanvas.height
    ) / 1200;


  const longitud =
    180 *
    escala *
    flechaEscala;


  /*
   * Distancia aproximada desde la punta
   */

  const distancia =
    Math.sqrt(

      Math.pow(
        x - flechaX,
        2
      ) +

      Math.pow(
        y - flechaY,
        2
      )

    );


  /*
   * Permitir agarrarla a lo largo
   * de la flecha.
   */

  return (
    distancia <
    longitud * 1.25
  );

}


/*
====================================================
 VERIFICAR ESTAMPADO
====================================================
*/

function puntoEstaEnEstampado(
  x,
  y
){

  const width =
    arrowCanvas.width;


  const height =
    arrowCanvas.height;


  const escala =
    Math.max(
      width,
      height
    ) / 1200;


  const padding =
    Math.round(
      16 * escala
    );


  const font =
    Math.max(
      16,
      Math.round(
        20 * escala
      )
    );


  const altoLinea =
    Math.round(
      27 * escala
    );


  const lineas = [

    "PROYECTO: " +
      (
        proyecto ||
        "SIN PROYECTO"
      ),

    "TIPO PROYECTO: " +
      (
        tipoProyecto ||
        "SIN TIPO"
      ),

    "TIPO FOTO: " +
      obtenerNombreTipoFoto(tipo),

    "FECHA / HORA",

    "LAT / LON"

  ];


  const ctx =
    arrowCanvas.getContext(
      "2d"
    );


  ctx.font =
    "bold " +
    font +
    "px Arial";


  let anchoTexto =
    0;


  lineas.forEach(
    function(texto){

      const medida =
        ctx.measureText(
          texto
        ).width;


      if(
        medida >
        anchoTexto
      ){

        anchoTexto =
          medida;

      }

    }
  );


  const anchoCaja =
    anchoTexto +
    padding * 2;


  const altoCaja =
    lineas.length *
    altoLinea +
    padding * 2;


  const cajaX =
    padding;


  const cajaY =
    height -
    altoCaja -
    padding;


  const margen =
    40 * escala;


  return (

    x >=
      cajaX - margen &&

    x <=
      cajaX +
      anchoCaja +
      margen &&

    y >=
      cajaY - margen &&

    y <=
      cajaY +
      altoCaja +
      margen

  );

}


/*
====================================================
 DIBUJAR FLECHA
====================================================
*/

function dibujarFlecha(){

  if(
    flechaX === null ||
    flechaY === null
  ){

    return;

  }


  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      const escala =
        Math.max(
          arrowCanvas.width,
          arrowCanvas.height
        ) / 1200;


      /*
      ==============================================
       TAMAÑO
      ==============================================
      */

      const longitud =
        180 *
        escala *
        flechaEscala;


      const punta =
        42 *
        escala *
        flechaEscala;


      const grosor =
        Math.max(
          7,
          10 *
          escala *
          flechaEscala
        );


      /*
      ==============================================
       CALCULAR INICIO
      ==============================================
      */

      const inicioX =
        flechaX -
        longitud *
        Math.cos(
          flechaAngulo
        );


      const inicioY =
        flechaY -
        longitud *
        Math.sin(
          flechaAngulo
        );


      /*
      ==============================================
       BORDE NEGRO
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "rgba(0,0,0,.85)";


      ctx.lineWidth =
        grosor + 8;


      ctx.lineCap =
        "round";


      ctx.stroke();


      /*
      ==============================================
       FLECHA VERDE
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#00e676";


      ctx.lineWidth =
        grosor;


      ctx.lineCap =
        "round";


      ctx.stroke();


      /*
      ==============================================
       CABEZA
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(
        flechaX,
        flechaY
      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          flechaAngulo -
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          flechaAngulo -
          Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          flechaAngulo +
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          flechaAngulo +
          Math.PI / 6
        )

      );


      ctx.closePath();


      /*
       * Borde negro
       */

      ctx.fillStyle =
        "#000000";


      ctx.fill();


      /*
       * Segunda cabeza verde
       */

      ctx.beginPath();


      ctx.moveTo(
        flechaX,
        flechaY
      );


      ctx.lineTo(

        flechaX -
        (
          punta - 4
        ) *
        Math.cos(
          flechaAngulo -
          Math.PI / 6
        ),

        flechaY -
        (
          punta - 4
        ) *
        Math.sin(
          flechaAngulo -
          Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        (
          punta - 4
        ) *
        Math.cos(
          flechaAngulo +
          Math.PI / 6
        ),

        flechaY -
        (
          punta - 4
        ) *
        Math.sin(
          flechaAngulo +
          Math.PI / 6
        )

      );


      ctx.closePath();


      ctx.fillStyle =
        "#00e676";


      ctx.fill();


      /*
      ==============================================
       PUNTO DE SEÑALAMIENTO
      ==============================================
      */

      ctx.beginPath();


      ctx.arc(

        flechaX,

        flechaY,

        8 *
        escala *
        flechaEscala,

        0,

        Math.PI * 2

      );


      ctx.fillStyle =
        "#ffffff";


      ctx.fill();


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        3 *
        escala;


      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}

/*
====================================================
 ENVIAR FOTO
====================================================
*/

function enviarFotoFinal(
  dataURL,
  ahora,
  posicion
){

  preview.src =
    dataURL;


  preview.style.display =
    "block";


  const nombre =
    crearNombreFoto(
      tipo,
      ahora
    );


  const mensaje = {

    type:
      "CAMERA_STAMP_PHOTO",

    tipo:
      tipo,

    fileName:
      nombre,

    mimeType:
      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null

  };


  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(
      mensaje,
      "*"
    );

  }


  status.textContent =
    "✅ FOTO CAPTURADA.\n\n" +
    "Regresando al formulario...";


  detenerCamara();


  setTimeout(
    function(){

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.focus();

        window.close();

      }
      else{

        status.textContent =
          "✅ FOTO CAPTURADA.";

      }

    },
    500
  );

}


/*
====================================================
 GPS
====================================================
*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          const resultado = {

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          };


          resolve(
            resultado
          );

        },


        function(error){

          console.warn(
            "NO SE PUDO OBTENER GPS:",
            error
          );


          resolve(null);

        },


        {

          enableHighAccuracy:true,

          timeout:10000,

          maximumAge:0

        }

      );

    }
  );

}


/*
====================================================
 NOMBRE TIPO FOTO
====================================================
*/

function obtenerNombreTipoFoto(tipo){

  if(tipo === "poste")
    return "POSTE";


  if(tipo === "mega")
    return "CAJAS MEGA";


  if(tipo === "medidores")
    return "MEDIDORES";


  if(tipo === "carriers")
    return "CAJAS CARRIERS";


  return String(
    tipo || ""
  ).toUpperCase();

}


/*
====================================================
 NOMBRE FOTO
====================================================
*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)
      .replace(/\s+/g,"_") +

    "_" +

    formatFileDate(fecha) +

    ".jpg"

  );

}


/*
====================================================
 FECHA ARCHIVO
====================================================
*/

function formatFileDate(date){

  return (

    date.getFullYear() +

    String(
      date.getMonth() + 1
    ).padStart(2,"0") +

    String(
      date.getDate()
    ).padStart(2,"0") +

    "_" +

    String(
      date.getHours()
    ).padStart(2,"0") +

    String(
      date.getMinutes()
    ).padStart(2,"0") +

    String(
      date.getSeconds()
    ).padStart(2,"0")

  );

}

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}
