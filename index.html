<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin:0;

  padding:15px;

  background:#111;

  color:white;

  font-family:Arial,sans-serif;

}


#cameraContainer {

  width:100%;

  max-width:800px;

  margin:auto;

  position:relative;

  background:#000;

  border-radius:10px;

  overflow:hidden;

}


#video {

  width:100%;

  display:block;

  background:#000;

}


#canvas {

  display:none;

}


/*==================================================
 VISOR DE SEÑALAMIENTO
==================================================*/

#arrowEditor {

  display:none;

  position:relative;

  width:100%;

  background:#000;

}


#arrowCanvas {

  width:100%;

  display:block;

  background:#000;

  cursor:crosshair;

  touch-action:none;

}


/*==================================================
 BOTONES
==================================================*/

#cameraControls {

  position:absolute;

  left:0;

  right:0;

  bottom:0;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:6px;

  padding:

    8px

    6px

    calc(8px + env(safe-area-inset-bottom));

  background:linear-gradient(

    transparent,

    rgba(0,0,0,.85)

  );

  z-index:20;

}


#cameraControls button {

  flex:0 1 auto;

  min-width:70px;

  min-height:40px;

  padding:7px 9px;

  font-size:12px;

  font-weight:bold;

  border:none;

  border-radius:7px;

  cursor:pointer;

  white-space:nowrap;

}


#startButton {

  background:#2196f3;

  color:white;

}


#takeButton {

  background:#4caf50;

  color:white;

}


#signalButton {

  background:#ff9800;

  color:white;

}


#signalButton.active {

  background:#e65100;

  box-shadow:

    0 0 0 3px

    rgba(255,152,0,.35);

}


#cancelButton {

  background:#f44336;

  color:white;

}


#confirmButton {

  background:#4caf50;

  color:white;

  display:none;

}


#cancelSignalButton {

  background:#f44336;

  color:white;

  display:none;

}


#cameraControls button:disabled {

  opacity:.4;

}


/*==================================================
 PREVIEW
==================================================*/

#preview {

  width:100%;

  max-width:800px;

  display:none;

  margin:15px auto;

  border-radius:8px;

}


/*==================================================
 ESTADO
==================================================*/

#status {

  display:none;

}


/*==================================================
 CELULAR
==================================================*/

  body {

    padding:0;

    background:#000;

  }


  #cameraContainer {

    width:100vw;

    height:100vh;

    max-width:none;

    border-radius:0;

  }


  #video {

    width:100vw;

    height:100vh;

    object-fit:cover;

  }


  #arrowEditor {

    width:100vw;

    height:100vh;

  }


  #arrowCanvas {

    width:100vw;

    height:100vh;

    object-fit:contain;

  }


  #cameraControls {

    gap:5px;

    padding:

      7px

      5px

      calc(7px + env(safe-area-inset-bottom));

  }


  #cameraControls button {

    min-width:60px;

    min-height:38px;

    padding:6px 7px;

    font-size:11px;

  }

}


</style>

/*
====================================================
 LOGO
====================================================
*/

const LOGO_URL =

  "https://lh3.googleusercontent.com/d/12EpwDn_A9mR0DfZSiGoTi2NS9zFNYPVP";


let logoImagen = null;


let logoCargado = false;


/*
====================================================
 CARGAR LOGO
====================================================
*/

function cargarLogo(){

  return new Promise(

    function(resolve){

      const img =

        new Image();


      img.crossOrigin =

        "anonymous";


      img.onload =

        function(){

          logoImagen =

            img;


          logoCargado =

            true;


          console.log(
            "✅ LOGO CARGADO"
          );


          resolve(true);

        };


      img.onerror =

        function(error){

          console.error(
            "❌ ERROR CARGANDO LOGO:",
            error
          );


          logoImagen =

            null;


          logoCargado =

            false;


          resolve(false);

        };


      img.src =

        LOGO_URL +

        "?t=" +

        Date.now();

    }

  );

}


/*
====================================================
 DIBUJAR LOGO
====================================================
*/

function dibujarLogo(

  ctx,
  width,
  height

){

  if(

    !logoCargado ||

    !logoImagen

  ){

    console.warn(
      "LOGO NO DISPONIBLE"
    );

    return;

  }


  const escala =

    Math.max(
      width,
      height
    ) / 1200;


  /*
   * TAMAÑO DEL LOGO
   *
   * Cambia 170 para hacerlo
   * más grande o pequeño.
   */

  const logoAncho =

    Math.round(
      170 * escala
    );


  const proporcion =

    logoImagen.height /

    logoImagen.width;


  const logoAlto =

    Math.round(

      logoAncho *

      proporcion

    );


  const margen =

    Math.round(
      25 * escala
    );


  const x =

    width -

    logoAncho -

    margen;


  const y =

    margen;


  ctx.save();


  ctx.shadowColor =

    "rgba(0,0,0,.55)";


  ctx.shadowBlur =

    8 * escala;


  ctx.shadowOffsetX =

    2 * escala;


  ctx.shadowOffsetY =

    2 * escala;


  ctx.drawImage(

    logoImagen,

    x,
    y,

    logoAncho,
    logoAlto

  );


  ctx.restore();

}


/*
====================================================
 INICIAR CÁMARA
====================================================
*/

startButton.addEventListener(

  "click",

  iniciarCamara

);


async function iniciarCamara(){

  try{

    status.textContent =

      "Solicitando permiso de cámara...";


    if(

      !navigator.mediaDevices ||

      !navigator.mediaDevices
        .getUserMedia

    ){

      throw new Error(

        "El navegador no permite utilizar la cámara."

      );

    }


    detenerCamara();


    stream =

      await navigator.mediaDevices
        .getUserMedia({

          video:{

            facingMode:{

              ideal:
                "environment"

            },

            width:{

              ideal:
                1920

            },

            height:{

              ideal:
                1080

            }

          },

          audio:false

        });


    video.srcObject =

      stream;


    await video.play();


    /*
    ================================================
     CARGAR LOGO
    ================================================
    */

    status.textContent =

      "Cargando logo...";


    await cargarLogo();


    startButton.style.display =

      "none";


    signalButton.style.display =

      "block";


    takeButton.disabled =

      false;


    status.textContent =

      "✅ Cámara lista.\n\n" +

      "Puedes tomar la foto directamente " +

      "o activar SEÑALAR.";

  }


  catch(error){

    console.error(

      "ERROR CAMERA:",

      error

    );


    let mensaje =

      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n";


    if(

      error.name ===
      "NotAllowedError"

    ){

      mensaje +=

        "El navegador bloqueó el permiso de cámara.";

    }


    else if(

      error.name ===
      "NotFoundError"

    ){

      mensaje +=

        "No se encontró una cámara.";

    }


    else if(

      error.name ===
      "NotReadableError"

    ){

      mensaje +=

        "La cámara está siendo utilizada por otra aplicación.";

    }


    else{

      mensaje +=

        error.name +

        "\n" +

        error.message;

    }


    status.textContent =

      mensaje;


    startButton.style.display =

      "block";


    takeButton.disabled =

      true;

  }

}


/*
====================================================
 BOTÓN SEÑALAR
====================================================
*/

signalButton.addEventListener(

  "click",

);


function activarSenalar(){

  modoSenalar =

    !modoSenalar;


  if(modoSenalar){

    signalButton.classList.add(

    );


    signalButton.textContent =

    status.textContent =

  }

  else{

    desactivarSenalar();

  }

}


/*
====================================================
 DESACTIVAR SEÑALAR
====================================================
*/

function desactivarSenalar(){

  modoSenalar =

    false;


  signalButton.classList.remove(
    "active"
  );


  signalButton.textContent =

    "🎯 SEÑALAR";

}


/*
====================================================
 TOMAR FOTO
====================================================
*/

takeButton.addEventListener(

async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(

        "La cámara no está iniciada."

      );

    }


    const width =

      video.videoWidth;


    const height =

      video.videoHeight;


    if(

      !width ||

      !height

    ){

      throw new Error(

        "La cámara todavía no está lista."

      );

    }


    /*
    ================================================
     GPS
    ================================================
    */

    status.textContent =

      "Obteniendo ubicación GPS...";


    const posicion =

      await obtenerGPS();


    gpsActual =

      posicion;


    /*
    ================================================
     CANVAS
    ================================================
    */

    canvas.width =

      width;


    canvas.height =

      height;


    const ctx =

      canvas.getContext(
        "2d"
      );


    /*
    ================================================
     FOTO
    ================================================
    */

    ctx.drawImage(

      video,

      0,
      0,

      width,
      height

    );


    /*
    ================================================
     FECHA
    ================================================
    */

    const ahora =

      new Date();


    const fecha =

      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =

      ahora.toLocaleTimeString(
        "es-MX"
      );


    /*
    ================================================
     ESCALA
    ================================================
    */

    const escala =

      Math.max(
        width,
        height
      ) / 1200;


    const padding =

      Math.round(
        16 * escala
      );


    const font =

      Math.max(

        16,

        Math.round(
          20 * escala
        )

      );


    const altoLinea =

      Math.round(
        27 * escala
      );


    /*
    ================================================
     ESTAMPADO
    ================================================
    */

    const lineas = [

      "PROYECTO: " +

        (

          proyecto ||

          "SIN PROYECTO"

        ),


      "TIPO PROYECTO: " +

        (

          tipoProyecto ||

          "SIN TIPO"

        ),


      "TIPO FOTO: " +

        obtenerNombreTipoFoto(
          tipo
        ),


      fecha +

        "  " +

        hora,


      posicion

        ?

        "LAT: " +

        Number(
          posicion.lat
        ).toFixed(6) +

        "  LON: " +

        Number(
          posicion.lng
        ).toFixed(6)

        :

        "GPS: SIN UBICACIÓN"

    ];


    ctx.font =

      "bold " +

      font +

      "px Arial";


    let anchoTexto =

      0;


    lineas.forEach(

      function(texto){

        const medida =

          ctx.measureText(
            texto
          ).width;


        if(

          medida >

          anchoTexto

        ){

          anchoTexto =

            medida;

        }

      }

    );


    const anchoCaja =

      anchoTexto +

      padding * 2;


    const altoCaja =

      lineas.length *

        altoLinea +

      padding * 2;


    const x =

      padding;


    const y =

      height -

      altoCaja -

      padding;


    /*
    ================================================
     CAJA DEL ESTAMPADO
    ================================================
    */

    ctx.fillStyle =

      "rgba(0,0,0,.42)";


    ctx.beginPath();


    const radio =

      Math.round(
        10 * escala
      );


    ctx.roundRect(

      x,
      y,

      anchoCaja,
      altoCaja,

      radio

    );


    ctx.fill();


    /*
    ================================================
     TEXTO
    ================================================
    */

    ctx.fillStyle =

      "rgba(255,255,255,.95)";


    ctx.font =

      "bold " +

      font +

      "px Arial";


    ctx.textBaseline =

      "top";


    lineas.forEach(

      function(texto,index){

        ctx.fillText(

          texto,

          x + padding,

          y +

          padding +

          index *

          altoLinea

        );

      }

    );


    /*
    ================================================
     LOGO
    ================================================
    */

    dibujarLogo(

      ctx,

      width,

      height

    );


    /*
    ================================================
     GUARDAR FOTO BASE
    ================================================
    */

    fotoBase =

      canvas.toDataURL(

        "image/jpeg",

        .90

      );


    /*
    ================================================
     SIN SEÑALAR
    ================================================
    */

    if(!modoSenalar){

      enviarFotoFinal(

        fotoBase,

        ahora,

        posicion

      );

      return;

    }


    /*
    ================================================
     ABRIR VISOR
    ================================================
    */

    abrirVisorFlecha();

  }


  catch(error){

    console.error(

      "ERROR TOMANDO FOTO:",

      error

    );


    status.textContent =

      "ERROR AL TOMAR FOTO:\n\n" +

      error.message;

  }

}


/*
====================================================
 ABRIR VISOR
====================================================
*/

function abrirVisorFlecha(){

  const imagen =

    new Image();


  imagen.onload =

    function(){

      arrowCanvas.width =

        imagen.width;


      arrowCanvas.height =

        imagen.height;


      const ctx =

        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(

        0,
        0,

        arrowCanvas.width,
        arrowCanvas.height

      );


      ctx.drawImage(

        imagen,

        0,
        0

      );


      flechaX =

        null;


      flechaY =

        null;


      flechaAngulo =

        0;


      flechaEscala =

        1;


      arrowEditor.style.display =

        "block";


      video.style.display =

        "none";


      signalButton.style.display =

        "none";


      takeButton.style.display =

        "none";


      confirmButton.style.display =

        "block";


      cancelSignalButton.style.display =

        "block";


      cancelButton.style.display =

        "none";


      colocandoFlecha =

        true;


      status.textContent =

        "🎯 TOCA LA IMAGEN DONDE QUIERES COLOCAR LA FLECHA PP.\n\n" +

        "Puedes moverla, girarla y cambiar su tamaño con los dedosETA.\n\n" +

        "La flecha NO puede colocarse sobre el estampadoNSP.";

    };


  imagen.src =

    fotoBase;

}


/*
====================================================
 OBTENER PUNTO
====================================================
*/

function obtenerPuntoEvento(event){

  const rect =

    arrowCanvas
      .getBoundingClientRect();


  const escalaX =

    arrowCanvas.width /
    rect.width;


  const escalaY =

    arrowCanvas.height /
    rect.height;


  return {

    x:

      (

        event.clientX -

        rect.left

      ) *

      escalaX,


    y:

      (

        event.clientY -

        rect.top

      ) *

      escalaY

  };

}


/*
====================================================
 CLICK
====================================================
*/

arrowCanvas.addEventListener(

  "click",

  function(event){

    if(!colocandoFlecha){

      return;

    }


    if(

      Date.now() -

      ultimoToque <

      500

    ){

      return;

    }


    const punto =

      obtenerPuntoEvento(
        event
      );


    if(

      puntoEstaEnEstampado(

        punto.x,

        punto.y

      )

    ){

      alert(

        "La flecha no puede colocarse sobre el estampado."

      );

      return;

    }


    flechaX =

      punto.x;


    flechaY =

      punto.y;


    flechaAngulo =

      0;


    flechaEscala =

      1;


    dibujarFlecha();

  }

);


/*
====================================================
 TOUCH
====================================================
*/

arrowCanvas.addEventListener(

  "touchstart",

  function(event){

    if(!colocandoFlecha){

      return;

    }


    event.preventDefault();


    ultimoToque =

      Date.now();


    if(

      event.touches.length === 1

    ){

      const punto =

        obtenerPuntoTouch(

          event.touches[0]

        );


      /*
       * Si todavía no existe flecha
       * la colocamos.
       */

      if(

        flechaX === null ||

        flechaY === null

      ){

        if(

          puntoEstaEnEstampado(

            punto.x,

            punto.y

          )

        ){

          alert(

            "La flecha no puede colocarse sobre el estampado."

          );

          return;

        }


        flechaX =

          punto.x;


        flechaY =

          punto.y;


        flechaAngulo =

          0;


        flechaEscala =

          1;


        dibujarFlecha();


        return;

      }


      /*
       * Si ya existe, verificar si
       * tocamos la flecha.
       */

      if(

        puntoDentroDeFlecha(

          punto.x,

          punto.y

        )

      ){

        tocandoFlecha =

          true;


        toqueInicialX =

          punto.x;


        toqueInicialY =

          punto.y;


        flechaInicialX =

          flechaX;


        flechaInicialY =

          flechaY;

      }

    }


    if(

      event.touches.length === 2

    ){

      tocandoFlecha =

        true;


      distanciaInicial =

        distanciaDosDedos(

          event.touches[0],

          event.touches[1]

        );


      escalaInicial =

        flechaEscala;


      anguloInicial =

        anguloDosDedos(

          event.touches[0],

          event.touches[1]

        );

    }

  },

  {

    passive:false

  }

);


/*
====================================================
 TOUCH MOVE
====================================================
*/

arrowCanvas.addEventListener(

  "touchmove",

  function(event){

    if(!colocandoFlecha){

      return;

    }


    event.preventDefault();


    /*
    ================================================
     DOS DEDOS
    ================================================
    */

    if(

      event.touches.length === 2

    ){

      if(

        flechaX === null ||

        flechaY === null

      ){

        return;

      }


      const distanciaActual =

        distanciaDosDedos(

          event.touches[0],

          event.touches[1]

        );


      const factor =

        distanciaActual /

        distanciaInicial;


      flechaEscala =

        escalaInicial *

        factor;


      flechaEscala =

        Math.max(

          .35,

          Math.min(

            3,

            flechaEscala

          )

        );


      const anguloActual =

        anguloDosDedos(

          event.touches[0],

          event.touches[1]

        );


      flechaAngulo =

        anguloInicial +

        (

          anguloActual -

          anguloInicial

        );


      dibujarFlecha();


      return;

    }


    /*
    ================================================
     UN DEDO
    ================================================
    */

    if(

      event.touches.length === 1 &&

      tocandoFlecha

    ){

      const punto =

        obtenerPuntoTouch(

          event.touches[0]

        );


      const nuevoX =

        flechaInicialX +

        (

          punto.x -

          toqueInicialX

        );


      const nuevoY =

        flechaInicialY +

        (

          punto.y -

          toqueInicialY

        );


      /*
       * No permitir mover la flecha
       * dentro del estampado.
       */

      if(

        puntoEstaEnEstampado(

          nuevoX,

          nuevoY

        )

      ){

        return;

      }


      flechaX =

        nuevoX;


      flechaY =

        nuevoY;


      dibujarFlecha();

    }

  },

  {

    passive:false

  }

);


/*
====================================================
 TOUCH END
====================================================
*/

arrowCanvas.addEventListener(

  "touchend",

  function(event){

    event.preventDefault();


    if(

      event.touches.length === 0

    ){

      tocandoFlecha =

        false;

    }

  },

  {

    passive:false

  }

);


/*
====================================================
 PUNTO TOUCH
====================================================
*/

function obtenerPuntoTouch(touch){

  const rect =

    arrowCanvas
      .getBoundingClientRect();


  const escalaX =

    arrowCanvas.width /
    rect.width;


  const escalaY =

    arrowCanvas.height /
    rect.height;


  return {

    x:

      (

        touch.clientX -

        rect.left

      ) *

      escalaX,


    y:

      (

        touch.clientY -

        rect.top

      ) *

      escalaY

  };

}


/*
====================================================
 DISTANCIA DOS DEDOS
====================================================
*/

function distanciaDosDedos(

  a,
  b

){

  const dx =

    b.clientX -

    a.clientX;


  const dy =

    b.clientY -

    a.clientY;


  return Math.sqrt(

    dx * dx +

    dy * dy

  );

}


/*
====================================================
 ÁNGULO DOS DEDOS
====================================================
*/

function anguloDosDedos(

  a,
  b

){

  return Math.atan2(

    b.clientY -

    a.clientY,

    b.clientX -

    a.clientX

  );

}


/*
====================================================
 DETECTAR SI TOCAMOS FLECHA
====================================================
*/

function puntoDentroDeFlecha(

  x,
  y

){

  if(

    flechaX === null ||

    flechaY === null

  ){

    return false;

  }


  const escala =

    Math.max(

      arrowCanvas.width,

      arrowCanvas.height

    ) / 1200;


  const radio =

    70 *

    escala *

    flechaEscala;


  const distancia =

    Math.sqrt(

      Math.pow(

        x - flechaX,

        2

      ) +

      Math.pow(

        y - flechaY,

        2

      )

    );


  return (

    distancia <=

    radio

  );

}


/*
====================================================
 VERIFICAR ESTAMPADO
====================================================
*/

function puntoEstaEnEstampado(

  x,
  y

){

  const width =

    arrowCanvas.width;


  const height =

    arrowCanvas.height;


  const escala =

    Math.max(

      width,

      height

    ) / 1200;


  const padding =

    Math.round(

      16 * escala

    );


  const font =

    Math.max(

      16,

      Math.round(

        20 * escala

      )

    );


  const altoLinea =

    Math.round(

      27 * escala

    );


  const lineas = [

    "PROYECTO: " +

      (

        proyecto ||

        "SIN PROYECTO"

      ),


    "TIPO PROYECTO: " +

      (

        tipoProyecto ||

        "SIN TIPO"

      ),


    "TIPO FOTO: " +

      obtenerNombreTipoFoto(
        tipo
      ),


    "FECHA / HORA",


    "LAT / LON"

  ];


  const ctx =

    arrowCanvas.getContext(
      "2d"
    );


  ctx.font =

    "bold " +

    font +

    "px Arial";


  let anchoTexto =

    0;


  lineas.forEach(

    function(texto){

      const medida =

        ctx.measureText(
          texto
        ).width;


      if(

        medida >

        anchoTexto

      ){

        anchoTexto =

          medida;

      }

    }

  );


  const anchoCaja =

    anchoTexto +

    padding * 2;


  const altoCaja =

    lineas.length *

      altoLinea +

    padding * 2;


  const cajaX =

    padding;


  const cajaY =

    height -

    altoCaja -

    padding;


  const margen =

    45 * escala;


  return (

    x >=

      cajaX - margen &&

    x <=

      cajaX +

      anchoCaja +

      margen &&

    y >=

      cajaY - margen &&

    y <=

      cajaY +

      altoCaja +

      margen

  );

}


/*
====================================================
 DIBUJAR FLECHA
====================================================
*/

function dibujarFlecha(){

  if(

    flechaX === null ||

    flechaY === null

  ){

    return;

  }


  const imagen =

    new Image();


  imagen.onload =

    function(){

      const ctx =

        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(

        0,
        0,

        arrowCanvas.width,
        arrowCanvas.height

      );


      ctx.drawImage(

        imagen,

        0,
        0

      );


      const escala =

        Math.max(

          arrowCanvas.width,

          arrowCanvas.height

        ) / 1200;


      /*
      ==============================================
       LONGITUD
      ==============================================
      */

      const longitud =

        150 *

        escala *

        flechaEscala;


      /*
      ==============================================
       PUNTA
      ==============================================
      */

      const punta =

        32 *

        escala *

        flechaEscala;


      /*
      ==============================================
       DIRECCIÓN
      ==============================================
      */

      const angulo =

        flechaAngulo;


      const inicioX =

        flechaX -

        longitud *

        Math.cos(

          angulo

        );


      const inicioY =

        flechaY -

        longitud *

        Math.sin(

          angulo

        );


      /*
      ==============================================
       BORDE BLANCO
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(

        inicioX,

        inicioY

      );


      ctx.lineTo(

        flechaX,

        flechaY

      );


      ctx.strokeStyle =

        "rgba(255,255,255,.9)";


      ctx.lineWidth =

        Math.max(

          4,

          12 *

          escala *

          flechaEscala

        );


      ctx.lineCap =

        "round";


      ctx.stroke();


      /*
      ==============================================
       FLECHA VERDE
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(

        inicioX,

        inicioY

      );


      ctx.lineTo(

        flechaX,

        flechaY

      );


      ctx.strokeStyle =

        "#00ff44";


      ctx.lineWidth =

        Math.max(

          3,

          8 *

          escala *

          flechaEscala

        );


      ctx.lineCap =

        "round";


      ctx.stroke();


      /*
      ==============================================
       CABEZA
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(

        flechaX,

        flechaY

      );


      ctx.lineTo(

        flechaX -

        punta *

        Math.cos(

          angulo -

          Math.PI / 6

        ),

        flechaY -

        punta *

        Math.sin(

          angulo -

          Math.PI / 6

        )

      );


      ctx.lineTo(

        flechaX -

        punta *

        Math.cos(

          angulo +

          Math.PI / 6

        ),

        flechaY -

        punta *

        Math.sin(

          angulo +

          Math.PI / 6

        )

      );


      ctx.closePath();


      ctx.fillStyle =

        "#00ff44";


      ctx.fill();


      ctx.strokeStyle =

        "#ffffff";


      ctx.lineWidth =

        Math.max(

          2,

          3 *

          escala *

          flechaEscala

        );


      ctx.stroke();


      /*
      ==============================================
       PUNTO
      ==============================================
      */

      ctx.beginPath();


      ctx.arc(

        flechaX,

        flechaY,

        8 *

        escala *

        flechaEscala,

        0,

        Math.PI * 2

      );


      ctx.fillStyle =

        "#00ff44";


      ctx.fill();


      ctx.strokeStyle =

        "#000000";


      ctx.lineWidth =

        3 *

        escala;


      ctx.stroke();

    };


  imagen.src =

    fotoBase;

}

 ENVIAR FOTO FINAL

function enviarFotoFinal(

  dataURL,

  ahora,

  posicion

){

  preview.src =

    dataURL;


  preview.style.display =

    "block";


  const nombre =

    crearNombreFoto(

      tipo,

      ahora

    );


  const mensaje = {

    type:

      "CAMERA_STAMP_PHOTO",


    tipo:

      tipo,


    fileName:

      nombre,


    mimeType:

      "image/jpeg",


    data:

      dataURL,


    latitud:

      posicion

        ? posicion.lat

        : null,


    longitud:

      posicion

        ? posicion.lng

        : null

  };


  if(

    window.opener &&

    !window.opener.closed

  ){

    window.opener.postMessage(

      mensaje,

      "*"

    );

  }


  status.textContent =

    "✅ FOTO CAPTURADA.\n\n" +

    "Regresando al formulario...";


  detenerCamara();


  setTimeout(

    function(){

      if(

        window.opener &&

        !window.opener.closed

      ){

        window.opener.focus();

        window.close();

      }

      else{

        status.textContent =

          "✅ FOTO CAPTURADA.";

      }

    },

    500

  );

}


/*
====================================================
 GPS
====================================================
*/

function obtenerGPS(){

  return new Promise(

    function(resolve){

      if(

        !navigator.geolocation

      ){

        resolve(null);

        return;

      }


      navigator.geolocation
        .getCurrentPosition(

          function(position){

            const resultado = {

              lat:

                position.coords.latitude,


              lng:

                position.coords.longitude

            };


            console.log(

              "GPS OBTENIDO:",

              resultado

            );


            resolve(

              resultado

            );

          },


          function(error){

            console.warn(

              "NO SE PUDO OBTENER GPS:",

              error

            );


            resolve(null);

          },


          {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:0

          }

        );

    }

  );

}


/*
====================================================
 NOMBRE TIPO FOTO
====================================================
*/

function obtenerNombreTipoFoto(tipo){

  if(tipo === "poste")
    return "POSTE";


  if(tipo === "mega")
    return "CAJAS MEGA";


  if(tipo === "medidores")
    return "MEDIDORES";


  if(tipo === "carriers")
    return "CAJAS CARRIERS";


  return String(

    tipo || ""

  ).toUpperCase();

}


/*
====================================================
 NOMBRE FOTO
====================================================
*/

function crearNombreFoto(

  tipo,

  fecha

){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)

      .replace(
        /\s+/g,
        "_"
      ) +

    "_" +

    formatFileDate(fecha) +

    ".jpg"

  );

}


/*
====================================================
 FECHA ARCHIVO
====================================================
*/

function formatFileDate(date){

  const year =

    date.getFullYear();


  const month =

    String(

      date.getMonth() + 1

    ).padStart(

      2,

      "0"

    );


  const day =

    String(

      date.getDate()

    ).padStart(

      2,

      "0"

    );


  const hour =

    String(

      date.getHours()

    ).padStart(

      2,

      "0"

    );


  const minute =

    String(

      date.getMinutes()

    ).padStart(

      2,

      "0"

    );


  const second =

    String(

      date.getSeconds()

    ).padStart(

      2,

      "0"

    );


  return (

    year +

    month +

    day +

    "_" +

    hour +

    minute +

    second

  );

}

  if(stream){

    stream

      .getTracks()

      .forEach(

        function(track){

          track.stop();

        }

      );

  }


  stream =

    null;


  video.srcObject =

    null;


  takeButton.disabled =

    true;

}
