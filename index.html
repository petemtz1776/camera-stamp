<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}


/*====================================================
 CONTENEDOR PRINCIPAL
====================================================*/

#cameraContainer {

  width: 100%;
  max-width: 800px;

  height: 100dvh;

  margin: 0 auto;

  position: relative;

  background: #000;

  overflow: hidden;
}


/*====================================================
 VIDEO
====================================================*/

#video {

  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  display: block;

  background: #000;

  object-fit: cover;
}


/*====================================================
 CANVAS OCULTO
====================================================*/

#canvas {
  display: none;
}


/*====================================================
 VISOR DE SEÑALAMIENTO
====================================================*/

#arrowEditor {

  display: none;

  position: absolute;

  left: 0;
  top: 0;
  right: 0;
  bottom: 0;

  background: #000;

  z-index: 5;

  overflow: hidden;
}


#arrowCanvas {

  width: 100%;
  height: 100%;

  display: block;

  background: #000;

  cursor: crosshair;

  touch-action: none;
}


/*====================================================
 CONTROLES
====================================================*/

#cameraControls {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  min-height: 76px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  padding:
    10px
    8px
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  background:
    linear-gradient(
      transparent 0%,
      rgba(0,0,0,.80) 35%,
      rgba(0,0,0,.95) 100%
    );

  z-index: 100;
}


/*====================================================
 BOTONES
====================================================*/

#cameraControls button {

  flex: 0 1 auto;

  min-width: 72px;

  min-height: 48px;

  padding:
    10px 12px;

  font-size: 13px;

  font-weight: bold;

  border: none;

  border-radius: 8px;

  cursor: pointer;

  white-space: nowrap;

  -webkit-tap-highlight-color: transparent;

  touch-action: manipulation;
}


#cameraControls button:disabled {
  opacity: .4;
}


/*====================================================
 COLORES
====================================================*/

#startButton {
  background: #2196f3;
  color: #fff;
}

#takeButton {
  background: #4caf50;
  color: #fff;
}

#signalButton {
  background: #ff9800;
  color: #fff;
}

#signalButton.active {
  background: #e65100;

  box-shadow:
    0 0 0 3px
    rgba(255,152,0,.35);
}

#confirmButton {
  background: #4caf50;
  color: #fff;

  display: none;
}

#cancelSignalButton {
  background: #f44336;
  color: #fff;

  display: none;
}

#cancelButton {
  background: #f44336;
  color: #fff;
}


/*====================================================
 PREVIEW
====================================================*/

#preview {

  width: 100%;

  max-width: 800px;

  display: none;

  margin: auto;
}


/*====================================================
 STATUS
====================================================*/

#status {
  display: none;
}


/*====================================================
 CELULARES
====================================================*/

@media (max-width: 600px) {

  #cameraContainer {

    width: 100vw;

    height: 100dvh;

    max-width: none;
  }


  #video {

    width: 100vw;
    height: 100%;

    object-fit: cover;
  }


  #arrowEditor {

    width: 100%;
    height: 100%;
  }


  #arrowCanvas {

    width: 100%;
    height: 100%;

    touch-action: none;
  }


  #cameraControls {

    min-height: 82px;

    gap: 6px;

    padding:
      8px
      6px
      calc(
        8px +
        env(safe-area-inset-bottom)
      );
  }


  #cameraControls button {

    min-width: 70px;

    min-height: 50px;

    padding:
      9px 10px;

    font-size: 12px;

    border-radius: 8px;
  }

}


/*====================================================
 CELULARES MUY PEQUEÑOS
====================================================*/

@media (max-width: 380px) {

  #cameraControls {

    gap: 4px;

    padding-left: 4px;
    padding-right: 4px;
  }


  #cameraControls button{

    min-height:52px;

    padding:
      10px
      14px;

    font-size:15px;

    border-radius:8px;

}


}

</style>

</head>


<body>


<div id="cameraContainer">


  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <canvas id="canvas"></canvas>


  <div id="arrowEditor">

    <canvas
      id="arrowCanvas">
    </canvas>

  </div>


  <div id="cameraControls">


    <button
      id="startButton">
      📷 START
    </button>


    <button
      id="signalButton">
      🎯 SEÑALAR
    </button>


    <button
      id="takeButton"
      disabled>
      📸 FOTO
    </button>


    <button
      id="confirmButton">
      ✅ USAR
    </button>


    <button
      id="cancelSignalButton">
      ❌ CANCELAR
    </button>


    <button
      id="cancelButton">
      ✕ SALIR
    </button>


  </div>

</div>


<img id="preview">


<div id="status"></div>


<script>

/*====================================================
 DATOS DEL FORMULARIO
====================================================*/

const params =
  new URLSearchParams(
    window.location.search
  );


const tipo =
  params.get("tipo") || "poste";


const proyecto =
  params.get("proyecto") || "";


const tipoProyecto =
  params.get("tipoProyecto") || "";


const hub =
  params.get("hub") || "";


const rama =
  params.get("rama") || "";


/*====================================================
 LOGO
====================================================*/

const LOGO_DRIVE_ID =
  "12EpwDn_A9mR0DfZSiGoTi2NS9zFNYPVP";


const LOGO_URL =
  "https://lh3.googleusercontent.com/d/" +
  LOGO_DRIVE_ID;


const LOGO_URL_ALTERNATIVO =
  "https://drive.google.com/uc?export=view&id=" +
  LOGO_DRIVE_ID;


/*====================================================
 ELEMENTOS
====================================================*/

const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const preview =
  document.getElementById("preview");


const startButton =
  document.getElementById("startButton");


const signalButton =
  document.getElementById("signalButton");


const takeButton =
  document.getElementById("takeButton");


const confirmButton =
  document.getElementById("confirmButton");


const cancelSignalButton =
  document.getElementById(
    "cancelSignalButton"
  );


const cancelButton =
  document.getElementById("cancelButton");


const status =
  document.getElementById("status");


const arrowEditor =
  document.getElementById(
    "arrowEditor"
  );


const arrowCanvas =
  document.getElementById(
    "arrowCanvas"
  );


/*====================================================
 VARIABLES
====================================================*/

let stream = null;

let modoSenalar = false;

let fotoBase = null;

let gpsActual = null;

let fechaFoto = null;

let logoImagen = null;

let logoListo = false;

let zonaLogo = null;

let zonaEstampado = null;


/*====================================================
 VARIABLES DE FLECHA
====================================================*/

let flechaX = null;

let flechaY = null;

let flechaAngulo = 0;

let flechaEscala = 1;

let gestoActivo = false;

let toqueInicial = null;

let ultimoToque = 0;


/*====================================================
 INICIAR CÁMARA
====================================================*/

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara."
      );

    }


    detenerCamara();


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.disabled =
      false;


    cargarLogo();


    status.textContent =
      "✅ CÁMARA LISTA.\n\n" +
      "Puedes tomar la foto directamente " +
      "o activar SEÑALAR.";

  }
  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    status.textContent =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n" +
      error.name +
      "\n" +
      error.message;


    startButton.style.display =
      "block";


    takeButton.disabled =
      true;

  }

}


/*====================================================
 CARGAR LOGO
====================================================*/

function cargarLogo(){

  logoListo =
    false;


  logoImagen =
    new Image();


  logoImagen.crossOrigin =
    "anonymous";


  logoImagen.onload =
    function(){

      logoListo =
        true;


      console.log(
        "LOGO CARGADO:",
        logoImagen.width,
        logoImagen.height
      );


      status.textContent =
        "✅ Cámara y logo listos.";

    };


  logoImagen.onerror =
    function(){

      console.warn(
        "No se pudo cargar logo principal."
      );


      const alternativa =
        new Image();


      alternativa.crossOrigin =
        "anonymous";


      alternativa.onload =
        function(){

          logoImagen =
            alternativa;

          logoListo =
            true;


          console.log(
            "LOGO CARGADO CON URL ALTERNATIVA"
          );

        };


      alternativa.onerror =
        function(){

          logoListo =
            false;

          console.error(
            "NO SE PUDO CARGAR EL LOGO."
          );

        };


      alternativa.src =
        LOGO_URL_ALTERNATIVO;

    };


  logoImagen.src =
    LOGO_URL;

}


/*====================================================
 BOTÓN SEÑALAR
====================================================*/

signalButton.addEventListener(
  "click",
  function(){

    modoSenalar =
      !modoSenalar;


    if(modoSenalar){

      signalButton.classList.add(
        "active"
      );


      signalButton.textContent =
        "🎯 ACTIVO";


      status.textContent =
        "🎯 SEÑALAR ACTIVADO.\n\n" +
        "Toma la fotografía.";

    }
    else{

      desactivarSenalar();

    }

  }
);


/*====================================================
 DESACTIVAR SEÑALAR
====================================================*/

function desactivarSenalar(){

  modoSenalar =
    false;


  signalButton.classList.remove(
    "active"
  );


  signalButton.textContent =
    "🎯 SEÑALAR";

}


/*====================================================
 TOMAR FOTO
====================================================*/

takeButton.addEventListener(
  "click",
  tomarFoto
);


async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(
        "La cámara no está iniciada."
      );

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    status.textContent =
      "Obteniendo ubicación GPS...";


    const posicion =
      await obtenerGPS();


    gpsActual =
      posicion;


    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    const ahora =
      new Date();


    fechaFoto =
      ahora;


    const fecha =
      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =
      ahora.toLocaleTimeString(
        "es-MX"
      );


    const escala =
      Math.max(
        width,
        height
      ) / 1200;


    const padding =
      Math.round(
        16 * escala
      );


    const font =
      Math.max(
        16,
        Math.round(
          20 * escala
        )
      );


    const altoLinea =
      Math.round(
        27 * escala
      );


    const lineas = [

      "PROYECTO: " +
        (
          proyecto ||
          "SIN PROYECTO"
        ),

      "TIPO PROYECTO: " +
        (
          tipoProyecto ||
          "SIN TIPO"
        ),

      "TIPO FOTO: " +
        obtenerNombreTipoFoto(tipo),

      fecha +
        "  " +
        hora,

      posicion

        ? "LAT: " +
          Number(
            posicion.lat
          ).toFixed(6) +

          "  LON: " +

          Number(
            posicion.lng
          ).toFixed(6)

        : "GPS: SIN UBICACIÓN"

    ];


    ctx.font =
      "bold " +
      font +
      "px Arial";


    let anchoTexto =
      0;


    lineas.forEach(
      function(texto){

        const medida =
          ctx.measureText(
            texto
          ).width;


        if(
          medida >
          anchoTexto
        ){

          anchoTexto =
            medida;

        }

      }
    );


    const anchoCaja =
      anchoTexto +
      padding * 2;


    const altoCaja =
      lineas.length *
        altoLinea +
      padding * 2;


    const x =
      padding;


    const y =
      height -
      altoCaja -
      padding;


    const margenEstampado =
      Math.max(
        15,
        Math.round(
          18 * escala
        )
      );


    zonaEstampado = {

      x:
        x -
        margenEstampado,

      y:
        y -
        margenEstampado,

      width:
        anchoCaja +
        margenEstampado * 2,

      height:
        altoCaja +
        margenEstampado * 2

    };


    ctx.fillStyle =
      "rgba(0,0,0,.42)";


    ctx.beginPath();


    const radio =
      Math.round(
        10 * escala
      );


    ctx.roundRect(
      x,
      y,
      anchoCaja,
      altoCaja,
      radio
    );


    ctx.fill();


    ctx.fillStyle =
      "rgba(255,255,255,.95)";


    ctx.font =
      "bold " +
      font +
      "px Arial";


    ctx.textBaseline =
      "top";


    lineas.forEach(
      function(texto,index){

        ctx.fillText(

          texto,

          x + padding,

          y +
          padding +
          index *
          altoLinea

        );

      }
    );


    dibujarLogoEnCanvas(
      ctx,
      width,
      height
    );


    fotoBase =
      canvas.toDataURL(
        "image/jpeg",
        0.90
      );


    if(!modoSenalar){

      enviarFotoFinal(
        fotoBase,
        ahora,
        posicion
      );

      return;

    }


    abrirVisorFlecha();

  }
  catch(error){

    console.error(
      "ERROR TOMANDO FOTO:",
      error
    );


    status.textContent =
      "ERROR AL TOMAR FOTO:\n\n" +
      error.message;

  }

}


/*====================================================
 DIBUJAR LOGO
====================================================*/

function dibujarLogoEnCanvas(
  ctx,
  width,
  height
){

  if(
    !logoListo ||
    !logoImagen
  ){

    zonaLogo =
      null;

    return;

  }


  const maxWidth =
    width * 0.18;


  const maxHeight =
    height * 0.14;


  const proporcion =
    Math.min(

      maxWidth /
      logoImagen.width,

      maxHeight /
      logoImagen.height

    );


  const logoWidth =
    logoImagen.width *
    proporcion;


  const logoHeight =
    logoImagen.height *
    proporcion;


  const margen =
    Math.max(
      20,
      Math.round(
        width * 0.025
      )
    );


  const logoX =
    width -
    logoWidth -
    margen;


  const logoY =
    margen;


  const bloqueo =
    Math.max(
      15,
      Math.round(
        width * 0.012
      )
    );


  zonaLogo = {

    x:
      logoX -
      bloqueo,

    y:
      logoY -
      bloqueo,

    width:
      logoWidth +
      bloqueo * 2,

    height:
      logoHeight +
      bloqueo * 2

  };


  ctx.save();


  ctx.fillStyle =
    "rgba(0,0,0,.20)";


  ctx.fillRect(

    logoX -
    5,

    logoY -
    5,

    logoWidth +
    10,

    logoHeight +
    10

  );


  ctx.drawImage(

    logoImagen,

    logoX,

    logoY,

    logoWidth,

    logoHeight

  );


  ctx.restore();


  console.log(
    "ZONA LOGO BLOQUEADA:",
    zonaLogo
  );

}


/*====================================================
 ABRIR VISOR DE FLECHA
====================================================*/

function abrirVisorFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      arrowCanvas.width =
        imagen.width;


      arrowCanvas.height =
        imagen.height;


      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(

        0,
        0,

        arrowCanvas.width,
        arrowCanvas.height

      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      arrowEditor.style.display =
        "block";


      video.style.display =
        "none";


      signalButton.style.display =
        "none";


      takeButton.style.display =
        "none";


      confirmButton.style.display =
        "block";


      cancelSignalButton.style.display =
        "block";


      cancelButton.style.display =
        "none";


      flechaX =
        null;


      flechaY =
        null;


      flechaAngulo =
        0;


      flechaEscala =
        1;


      gestoActivo =
        false;


      status.textContent =
        "🎯 TOCA LA FOTO PARA COLOCAR LA FLECHA.\n\n" +

        "Puedes moverla con un dedo y " +
        "girarla o cambiar su tamaño con dos dedos.\n\n" +

        "🚫 El estampado y el logo están bloqueados.";

    };


  imagen.src =
    fotoBase;

}


/*====================================================
 OBTENER PUNTO DEL EVENTO
====================================================*/

function obtenerPuntoEvento(
  event
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        event.clientY -
        rect.top
      ) *
      escalaY

  };

}


/*====================================================
 CLICK / TOQUE PARA COLOCAR
====================================================*/

arrowCanvas.addEventListener(
  "click",
  function(event){

    if(
      Date.now() -
      ultimoToque <
      500
    ){

      return;

    }


    const punto =
      obtenerPuntoEvento(
        event
      );


    if(
      flechaX === null ||
      flechaY === null
    ){

      if(
        flechaChocaConZonas(
          punto.x,
          punto.y,
          0,
          1
        )
      ){

        alert(
          "🚫 La flecha no puede colocarse sobre el logo ni sobre el estampado."
        );

        return;

      }


      flechaX =
        punto.x;


      flechaY =
        punto.y;


      flechaAngulo =
        0;


      flechaEscala =
        1;


      dibujarFlecha();

    }

  }
);


/*====================================================
 TOUCH START
====================================================*/

arrowCanvas.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();


    ultimoToque =
      Date.now();


    const touches =
      event.touches;


    if(
      touches.length === 1
    ){

      const punto =
        obtenerPuntoEvento(
          touches[0]
        );


      if(
        flechaX === null
      ){

        if(
          flechaChocaConZonas(
            punto.x,
            punto.y,
            0,
            1
          )
        ){

          alert(
            "🚫 La flecha no puede colocarse sobre el logo ni sobre el estampado."
          );

          return;

        }


        flechaX =
          punto.x;


        flechaY =
          punto.y;


        flechaAngulo =
          0;


        flechaEscala =
          1;


        dibujarFlecha();

      }


      gestoActivo =
        true;


      toqueInicial = {

        tipo:
          "move",

        x:
          punto.x,

        y:
          punto.y,

        flechaX:
          flechaX,

        flechaY:
          flechaY

      };

    }


    else if(
      touches.length === 2 &&
      flechaX !== null
    ){

      gestoActivo =
        true;


      const p1 =
        obtenerPuntoEvento(
          touches[0]
        );


      const p2 =
        obtenerPuntoEvento(
          touches[1]
        );


      const centroX =
        (
          p1.x +
          p2.x
        ) / 2;


      const centroY =
        (
          p1.y +
          p2.y
        ) / 2;


      const distancia =
        Math.hypot(

          p2.x -
          p1.x,

          p2.y -
          p1.y

        );


      const angulo =
        Math.atan2(

          p2.y -
          p1.y,

          p2.x -
          p1.x

        );


      toqueInicial = {

        tipo:
          "transform",

        centroX:
          centroX,

        centroY:
          centroY,

        distancia:
          distancia,

        angulo:
          angulo,

        flechaX:
          flechaX,

        flechaY:
          flechaY,

        escala:
          flechaEscala,

        rotacion:
          flechaAngulo

      };

    }

  },
  {
    passive:false
  }
);


/*====================================================
 TOUCH MOVE
====================================================*/

arrowCanvas.addEventListener(
  "touchmove",
  function(event){

    event.preventDefault();


    if(
      !gestoActivo ||
      !toqueInicial
    ){

      return;

    }


    const touches =
      event.touches;


    if(
      touches.length === 1 &&
      toqueInicial.tipo === "move"
    ){

      const punto =
        obtenerPuntoEvento(
          touches[0]
        );


      const dx =
        punto.x -
        toqueInicial.x;


      const dy =
        punto.y -
        toqueInicial.y;


      const nuevoX =
        toqueInicial.flechaX +
        dx;


      const nuevoY =
        toqueInicial.flechaY +
        dy;


      if(
        !flechaChocaConZonas(
          nuevoX,
          nuevoY,
          flechaAngulo,
          flechaEscala
        )
      ){

        flechaX =
          nuevoX;


        flechaY =
          nuevoY;


        dibujarFlecha();

      }

    }


    else if(
      touches.length === 2 &&
      toqueInicial.tipo ===
        "transform"
    ){

      const p1 =
        obtenerPuntoEvento(
          touches[0]
        );


      const p2 =
        obtenerPuntoEvento(
          touches[1]
        );


      const centroX =
        (
          p1.x +
          p2.x
        ) / 2;


      const centroY =
        (
          p1.y +
          p2.y
        ) / 2;


      const distancia =
        Math.hypot(

          p2.x -
          p1.x,

          p2.y -
          p1.y

        );


      const angulo =
        Math.atan2(

          p2.y -
          p1.y,

          p2.x -
          p1.x

        );


      let nuevaEscala =
        toqueInicial.escala *
        (
          distancia /
          toqueInicial.distancia
        );


      nuevaEscala =
        Math.max(
          0.35,
          Math.min(
            3,
            nuevaEscala
          )
        );


      const nuevaRotacion =
        toqueInicial.rotacion +
        (
          angulo -
          toqueInicial.angulo
        );


      if(
        !flechaChocaConZonas(
          toqueInicial.flechaX,
          toqueInicial.flechaY,
          nuevaRotacion,
          nuevaEscala
        )
      ){

        flechaAngulo =
          nuevaRotacion;


        flechaEscala =
          nuevaEscala;


        dibujarFlecha();

      }

    }

  },
  {
    passive:false
  }
);

/*====================================================
 COMPROBAR ZONAS PROHIBIDAS
====================================================*/

function flechaChocaConZonas(
  x,
  y,
  angulo,
  escala
){

  const factor =
    Math.max(
      arrowCanvas.width,
      arrowCanvas.height
    ) / 1200;


  const longitud =
    150 *
    factor *
    escala;


  const grosor =
    Math.max(
      8,
      9 *
      factor *
      escala
    );


  const inicioX =
    x -
    longitud *
    Math.cos(
      angulo +
      Math.PI / 4
    );


  const inicioY =
    y -
    longitud *
    Math.sin(
      angulo +
      Math.PI / 4
    );


  const pasos =
    18;


  for(
    let i = 0;
    i <= pasos;
    i++
  ){

    const t =
      i / pasos;


    const px =
      inicioX +
      (
        x -
        inicioX
      ) *
      t;


    const py =
      inicioY +
      (
        y -
        inicioY
      ) *
      t;


    const margen =
      grosor *
      1.8;


    const puntos = [

      {
        x:px,
        y:py
      },

      {
        x:px + margen,
        y:py
      },

      {
        x:px - margen,
        y:py
      },

      {
        x:px,
        y:py + margen
      },

      {
        x:px,
        y:py - margen
      }

    ];


    for(
      const punto of puntos
    ){

      if(
        puntoEnRectangulo(
          punto.x,
          punto.y,
          zonaEstampado
        )
      ){

        return true;

      }


      if(
        puntoEnRectangulo(
          punto.x,
          punto.y,
          zonaLogo
        )
      ){

        return true;

      }

    }

  }


  const punta =
    32 *
    factor *
    escala;


  const cabezaPuntos = [

    {
      x:x,
      y:y
    },

    {
      x:x + punta,
      y:y
    },

    {
      x:x - punta,
      y:y
    },

    {
      x:x,
      y:y + punta
    },

    {
      x:x,
      y:y - punta
    }

  ];


  for(
    const punto of cabezaPuntos
  ){

    if(
      puntoEnRectangulo(
        punto.x,
        punto.y,
        zonaEstampado
      )
    ){

      return true;

    }


    if(
      puntoEnRectangulo(
        punto.x,
        punto.y,
        zonaLogo
      )
    ){

      return true;

    }

  }


  return false;

}


/*====================================================
 PUNTO EN RECTANGULO
====================================================*/

function puntoEnRectangulo(
  x,
  y,
  rect
){

  if(!rect){

    return false;

  }


  return (

    x >= rect.x &&

    x <=
      rect.x +
      rect.width &&

    y >= rect.y &&

    y <=
      rect.y +
      rect.height

  );

}


/*====================================================
 DIBUJAR FLECHA
====================================================*/

function dibujarFlecha(){

  if(
    flechaX === null ||
    flechaY === null
  ){

    return;

  }


  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(

        0,
        0,

        arrowCanvas.width,
        arrowCanvas.height

      );


      ctx.drawImage(

        imagen,

        0,
        0

      );


      const factor =
        Math.max(

          arrowCanvas.width,

          arrowCanvas.height

        ) / 1200;


      const longitud =
        150 *
        factor *
        flechaEscala;


      const punta =
        32 *
        factor *
        flechaEscala;


      const inicioX =
        flechaX -
        longitud *
        Math.cos(
          flechaAngulo +
          Math.PI / 4
        );


      const inicioY =
        flechaY -
        longitud *
        Math.sin(
          flechaAngulo +
          Math.PI / 4
        );


      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        Math.max(
          12,
          13 *
          factor *
          flechaEscala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#00ff00";


      ctx.lineWidth =
        Math.max(
          7,
          9 *
          factor *
          flechaEscala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      const angulo =
        Math.atan2(

          flechaY -
          inicioY,

          flechaX -
          inicioX

        );


      ctx.beginPath();


      ctx.moveTo(

        flechaX,

        flechaY

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo -
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo -
          Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo +
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo +
          Math.PI / 6
        )

      );


      ctx.closePath();


      ctx.fillStyle =
        "#00ff00";


      ctx.fill();


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        Math.max(
          3,
          4 *
          factor *
          flechaEscala
        );


      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}

/*====================================================
 ENVIAR FOTO FINAL
====================================================*/

function enviarFotoFinal(
  dataURL,
  ahora,
  posicion
){

  preview.src =
    dataURL;


  preview.style.display =
    "block";


  const nombre =
    crearNombreFoto(
      tipo,
      ahora
    );


  const mensaje = {

    type:
      "CAMERA_STAMP_PHOTO",

    tipo:
      tipo,

    fileName:
      nombre,

    mimeType:
      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null

  };


  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(
      mensaje,
      "*"
    );

  }


  status.textContent =
    "✅ FOTO CAPTURADA.\n\n" +
    "Regresando al formulario...";


  detenerCamara();


  setTimeout(
    function(){

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.focus();

        window.close();

      }
      else{

        status.textContent =
          "✅ FOTO CAPTURADA.\n\n" +
          "Puedes regresar manualmente al formulario.";

      }

    },
    500
  );

}


/*====================================================
 GPS
====================================================*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          resolve({

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          });

        },

        function(error){

          console.warn(
            "GPS ERROR:",
            error
          );


          resolve(null);

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            0

        }

      );

    }
  );

}


/*====================================================
 TIPO FOTO
====================================================*/

function obtenerNombreTipoFoto(
  tipo
){

  if(
    tipo === "poste"
  )
    return "POSTE";


  if(
    tipo === "mega"
  )
    return "CAJAS MEGA";


  if(
    tipo === "medidores"
  )
    return "MEDIDORES";


  if(
    tipo === "carriers"
  )
    return "CAJAS CARRIERS";


  return String(
    tipo || ""
  ).toUpperCase();

}


/*====================================================
 NOMBRE FOTO
====================================================*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)
      .replace(
        /\s+/g,
        "_"
      ) +

    "_" +

    formatFileDate(fecha) +

    ".jpg"

  );

}


/*====================================================
 FECHA ARCHIVO
====================================================*/

function formatFileDate(
  date
){

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const hour =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minute =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const second =
    String(
      date.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day +
    "_" +
    hour +
    minute +
    second

  );

}

/*====================================================

====================================================*/

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}
