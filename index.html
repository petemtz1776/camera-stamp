<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

h2 {
  text-align: center;
  margin: 5px 0 15px 0;
}

#cameraContainer {
  width: 100%;
  max-width: 800px;
  margin: auto;
  position: relative;
}

#video {
  width: 100%;
  display: block;
  background: black;
  border-radius: 10px;
}

#canvas {
  display: none;
}

.controls {
  max-width: 800px;
  margin: 15px auto;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 8px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#startButton {
  background: #2196f3;
  color: white;
}

#takeButton {
  background: #4caf50;
  color: white;
}

#saveButton {
  background: #ff9800;
  color: white;
}

button:disabled {
  opacity: 0.4;
}

#preview {
  width: 100%;
  max-width: 800px;
  display: none;
  margin: 15px auto;
  border-radius: 8px;
}

#status {
  max-width: 800px;
  margin: 15px auto;
  padding: 12px;
  background: #222;
  border-radius: 8px;
  white-space: pre-wrap;
}

</style>

</head>

<body>

<h2>📷 Camera Stamp</h2>

<div class="controls">

<input
  id="stampText"
  type="text"
  value="FIELD INSPECTION"
  placeholder="Text to stamp on photo">

<button
  id="startButton">
  START CAMERA
</button>

</div>


<div id="cameraContainer">

<video
  id="video"
  autoplay
  playsinline>
</video>

<canvas id="canvas"></canvas>

</div>


<div class="controls">

<button
  id="takeButton"
  disabled>
  📷 TAKE PHOTO
</button>

<button
  id="saveButton"
  disabled>
  💾 SAVE TO GOOGLE DRIVE
</button>

</div>


<img
  id="preview">


<div id="status">
Ready.
</div>


<script>

/*
==================================================
IMPORTANT
==================================================

PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE.

Example:

https://script.google.com/macros/s/AKfycbwo3B-4yNRZ11EQjZO8jsSN6p9BjHir86tFnD8VINIUwUc-yjC15LRscr6YLxhGX3p0eg/exec
*/

const APPS_SCRIPT_URL =
  https://script.google.com/macros/s/AKfycbwo3B-4yNRZ11EQjZO8jsSN6p9BjHir86tFnD8VINIUwUc-yjC15LRscr6YLxhGX3p0eg/exec


/*
==================================================
ELEMENTS
==================================================
*/

const video =
  document.getElementById('video');

const canvas =
  document.getElementById('canvas');

const preview =
  document.getElementById('preview');

const startButton =
  document.getElementById('startButton');

const takeButton =
  document.getElementById('takeButton');

const saveButton =
  document.getElementById('saveButton');

const status =
  document.getElementById('status');

const stampText =
  document.getElementById('stampText');


let stream = null;

let stampedImage = null;


/*
==================================================
START CAMERA
==================================================
*/

startButton.addEventListener(
  'click',
  async function() {

    try {

      status.textContent =
        'Requesting camera permission...';

      /*
       * environment = rear camera
       */

      stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: 'environment'
            }
          },
          audio: false
        });


      video.srcObject = stream;

      takeButton.disabled = false;

      status.textContent =
        'Camera is ready.';

    }

    catch (error) {

      status.textContent =
        'CAMERA ERROR:\n\n' +
        error.name +
        '\n' +
        error.message;

      console.error(error);

    }

  }
);


/*
==================================================
TAKE PHOTO
==================================================
*/

takeButton.addEventListener(
  'click',
  function() {

    try {

      if (!stream) {

        status.textContent =
          'Camera is not running.';

        return;

      }


      const width =
        video.videoWidth;

      const height =
        video.videoHeight;


      if (!width || !height) {

        status.textContent =
          'Camera image is not ready yet.';

        return;

      }


      /*
       * Canvas gets same resolution
       * as camera frame.
       */

      canvas.width = width;
      canvas.height = height;


      const ctx =
        canvas.getContext('2d');


      /*
       * Draw camera frame
       */

      ctx.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      /*
       * ==========================================
       * STAMP SETTINGS
       * ==========================================
       */

      const scale =
        Math.max(width, height) / 1200;


      const padding =
        Math.round(25 * scale);


      const fontSize =
        Math.round(34 * scale);


      const smallFont =
        Math.round(26 * scale);


      const boxHeight =
        Math.round(130 * scale);


      /*
       * Black transparent stamp box
       */

      ctx.fillStyle =
        'rgba(0, 0, 0, 0.72)';


      ctx.fillRect(
        padding,
        height - boxHeight - padding,
        width - padding * 2,
        boxHeight
      );


      /*
       * White text
       */

      ctx.fillStyle = 'white';


      ctx.font =
        'bold ' +
        fontSize +
        'px Arial';


      const text =
        stampText.value ||
        'FIELD INSPECTION';


      ctx.fillText(
        text,
        padding * 2,
        height -
        boxHeight +
        padding * 1.5
      );


      /*
       * Date/time
       */

      const now =
        new Date();


      const date =
        now.toLocaleDateString();


      const time =
        now.toLocaleTimeString();


      ctx.font =
        smallFont +
        'px Arial';


      ctx.fillText(
        date + '  ' + time,
        padding * 2,
        height -
        boxHeight +
        padding * 2.8
      );


      /*
       * Create final JPG
       */

      stampedImage =
        canvas.toDataURL(
          'image/jpeg',
          0.90
        );


      /*
       * Show stamped image
       */

      preview.src =
        stampedImage;

      preview.style.display =
        'block';


      saveButton.disabled = false;


      status.textContent =
        'Photo captured and stamped.\n\n' +
        'Press SAVE TO GOOGLE DRIVE.';


    }

    catch (error) {

      status.textContent =
        'PHOTO ERROR:\n\n' +
        error.message;

      console.error(error);

    }

  }
);


/*
==================================================
SAVE TO GOOGLE DRIVE
==================================================
*/

saveButton.addEventListener(
  'click',
  async function() {

    if (!stampedImage) {

      status.textContent =
        'No stamped image exists.';

      return;

    }


    if (
      APPS_SCRIPT_URL ===
      'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'
    ) {

      status.textContent =
        'You have not entered your Apps Script URL.';

      return;

    }


    saveButton.disabled = true;


    status.textContent =
      'Uploading stamped photo...\n\n' +
      'Please wait.';


    try {

      const fileName =
        'STAMPED_' +
        formatFileDate(new Date()) +
        '.jpg';


      /*
       * Send image to Apps Script
       */

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({
              image: stampedImage,
              fileName: fileName
            })
          }
        );


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.error ||
          'Unknown Apps Script error.'
        );

      }


      status.innerHTML =
        '✅ PHOTO SAVED TO GOOGLE DRIVE<br><br>' +

        'File: ' +
        result.fileName +
        '<br><br>' +

        '<a href="' +
        result.fileUrl +
        '" ' +
        'target="_blank" ' +
        'style="color:#4caf50;">' +
        'OPEN PHOTO IN DRIVE' +
        '</a>';


      saveButton.disabled = false;

    }

    catch (error) {

      status.textContent =
        'UPLOAD ERROR:\n\n' +
        error.message;

      console.error(error);

      saveButton.disabled = false;

    }

  }
);


/*
==================================================
FILE NAME DATE
==================================================
*/

function formatFileDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, '0');

  const day =
    String(
      date.getDate()
    ).padStart(2, '0');

  const hour =
    String(
      date.getHours()
    ).padStart(2, '0');

  const minute =
    String(
      date.getMinutes()
    ).padStart(2, '0');

  const second =
    String(
      date.getSeconds()
    ).padStart(2, '0');


  return (
    year +
    month +
    day +
    '_' +
    hour +
    minute +
    second
  );

}

</script>

</body>

</html>
