<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>

<style>

* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding:15px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

#cameraContainer {

  width:100%;
  max-width:800px;
  margin:auto;
  position:relative;
  background:#000;
  border-radius:10px;
  overflow:hidden;

}

#video {

  width:100%;
  display:block;
  background:#000;

}

#canvas {
  display:none;
}


/*==================================================
 VISOR DE FLECHA
==================================================*/

#arrowEditor {

  display:none;
  position:relative;
  width:100%;
  background:#000;

}

#arrowCanvas {

  width:100%;
  display:block;
  background:#000;
  cursor:crosshair;
  touch-action:none;

}


/*==================================================
 LOGO
==================================================*/

#logoPreload {

  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;

}


/*==================================================
 BOTONES
==================================================*/

#cameraControls {

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:6px;

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.85)
    );

  z-index:20;

}


#cameraControls button {

  flex:0 1 auto;

  min-height:42px;

  min-width:0;

  width:auto;

  padding:
    8px
    10px;

  font-size:12px;

  font-weight:bold;

  border:none;

  border-radius:7px;

  cursor:pointer;

  white-space:nowrap;

}


#startButton {
  background:#2196f3;
  color:white;
}


#signalButton {
  background:#ff9800;
  color:white;
}


#signalButton.active {

  background:#e65100;

  box-shadow:
    0 0 0 3px
    rgba(255,152,0,.35);

}


#takeButton {
  background:#4caf50;
  color:white;
}


#confirmButton {
  background:#4caf50;
  color:white;
  display:none;
}


#cancelSignalButton {
  background:#f44336;
  color:white;
  display:none;
}


#cancelButton {
  background:#f44336;
  color:white;
}


#cameraControls button:disabled {
  opacity:.4;
}


/*==================================================
 PREVIEW
==================================================*/

#preview {

  width:100%;
  max-width:800px;
  display:none;
  margin:15px auto;
  border-radius:8px;

}


/*==================================================
 STATUS
==================================================*/

#status {
  display:none;
}


/*==================================================
 CELULAR
==================================================*/

@media(max-width:600px){

  body {

    padding:0;
    background:#000;

  }


  #cameraContainer {

    width:100vw;
    height:100vh;
    max-width:none;
    border-radius:0;

  }


  #video {

    width:100vw;
    height:100vh;
    object-fit:cover;

  }


  #arrowEditor {

    width:100vw;
    height:100vh;

  }


  #arrowCanvas {

    width:100vw;
    height:100vh;
    object-fit:contain;

  }


  #cameraControls {

    gap:5px;

    padding:
      7px
      5px
      calc(
        7px +
        env(safe-area-inset-bottom)
      );

  }


  #cameraControls button {

    min-height:38px;

    padding:
      7px
      8px;

    font-size:11px;

  }

}


</style>

</head>

<body>


<div id="cameraContainer">

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <canvas id="canvas"></canvas>


  <div id="arrowEditor">

    <canvas
      id="arrowCanvas">
    </canvas>

  </div>


  <div id="cameraControls">

    <button
      id="startButton">
      📷 START
    </button>


    <button
      id="signalButton"
      style="display:none;">
      🎯 SEÑALAR
    </button>


    <button
      id="takeButton"
      disabled>
      📸 FOTO
    </button>


    <button
      id="confirmButton">
      ✅ USAR
    </button>


    <button
      id="cancelSignalButton">
      ❌ CANCELAR
    </button>


    <button
      id="cancelButton">
      ✕ SALIR
    </button>

  </div>

</div>


<img
  id="preview">


<img
  id="logoPreload"
  crossorigin="anonymous"
  alt="">


<div id="status"></div>


<script>

/*
====================================================
 DATOS DEL FORMULARIO
====================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const tipo =
  params.get("tipo") || "poste";


const proyecto =
  params.get("proyecto") || "";


const tipoProyecto =
  params.get("tipoProyecto") || "";


const hub =
  params.get("hub") || "";


const rama =
  params.get("rama") || "";


/*
====================================================
 LOGO
====================================================
*/

/*
 * ID DEL ARCHIVO DE GOOGLE DRIVE
 */

const LOGO_ID =
  "12EpwDn_A9mR0DfZSiGoTi2NS9zFNYPVP";


/*
 * URL DIRECTA
 */

const LOGO_URL =
  "https://lh3.googleusercontent.com/d/" +
  LOGO_ID;


/*
====================================================
 ELEMENTOS
====================================================
*/

const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const preview =
  document.getElementById(
    "preview"
  );


const logoPreload =
  document.getElementById(
    "logoPreload"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const signalButton =
  document.getElementById(
    "signalButton"
  );


const takeButton =
  document.getElementById(
    "takeButton"
  );


const confirmButton =
  document.getElementById(
    "confirmButton"
  );


const cancelSignalButton =
  document.getElementById(
    "cancelSignalButton"
  );


const cancelButton =
  document.getElementById(
    "cancelButton"
  );


const status =
  document.getElementById(
    "status"
  );


const arrowEditor =
  document.getElementById(
    "arrowEditor"
  );


const arrowCanvas =
  document.getElementById(
    "arrowCanvas"
  );


/*
====================================================
 VARIABLES
====================================================
*/

let stream = null;

let logoCargado = false;

let modoSenalar = false;

let colocandoFlecha = false;

let fotoBase = null;

let gpsActual = null;

let flechaX = null;

let flechaY = null;

let flechaAngulo = 0;

let flechaEscala = 1;

let arrastrandoFlecha = false;

let ultimoToque = 0;


/*
====================================================
 CARGAR LOGO
====================================================
*/

function cargarLogo(){

  return new Promise(
    function(resolve){

      logoCargado = false;


      logoPreload.onload =
        function(){

          logoCargado = true;

          console.log(
            "LOGO CARGADO CORRECTAMENTE"
          );

          resolve(true);

        };


      logoPreload.onerror =
        function(){

          logoCargado = false;

          console.error(
            "NO SE PUDO CARGAR EL LOGO"
          );

          resolve(false);

        };


      logoPreload.src =
        LOGO_URL +
        "?t=" +
        Date.now();

    }
  );

}


/*
====================================================
 INICIAR
====================================================
*/

async function prepararSistema(){

  status.textContent =
    "Cargando logo...";


  await cargarLogo();


  iniciarCamara();

}


startButton.addEventListener(
  "click",
  prepararSistema
);


/*
====================================================
 INICIAR CÁMARA
====================================================
*/

async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara."
      );

    }


    detenerCamara();


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.disabled =
      false;


    if(logoCargado){

      status.textContent =
        "✅ Cámara lista.\n\n" +
        "Logo cargado.\n\n" +
        "Puedes tomar la foto.";

    }
    else{

      status.textContent =
        "⚠️ Cámara lista, pero el logo no pudo cargarse.";

    }

  }
  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    status.textContent =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n" +
      error.name +
      "\n" +
      error.message;


    startButton.style.display =
      "block";


    takeButton.disabled =
      true;

  }

}


/*
====================================================
 BOTÓN SEÑALAR
====================================================
*/

signalButton.addEventListener(
  "click",
  function(){

    modoSenalar =
      !modoSenalar;


    if(modoSenalar){

      signalButton.classList.add(
        "active"
      );


      signalButton.textContent =
        "🎯 ACTIVO";


      status.textContent =
        "🎯 SEÑALAR ACTIVADO.\n\n" +
        "Toma la fotografía.";

    }
    else{

      desactivarSenalar();

    }

  }
);


/*
====================================================
 DESACTIVAR SEÑALAR
====================================================
*/

function desactivarSenalar(){

  modoSenalar =
    false;


  signalButton.classList.remove(
    "active"
  );


  signalButton.textContent =
    "🎯 SEÑALAR";

}


/*
====================================================
 TOMAR FOTO
====================================================
*/

takeButton.addEventListener(
  "click",
  tomarFoto
);


async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(
        "La cámara no está iniciada."
      );

    }


    /*
     * VERIFICAR LOGO
     */

    if(!logoCargado){

      status.textContent =
        "Esperando a que cargue el logo...";


      const cargado =
        await cargarLogo();


      if(!cargado){

        alert(
          "No se pudo cargar el logo.\n\n" +
          "Verifica que el archivo de Google Drive " +
          "esté compartido como 'Cualquier persona con el enlace'."
        );

        return;

      }

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    /*
    ================================================
     GPS
    ================================================
    */

    status.textContent =
      "Obteniendo ubicación GPS...";


    const posicion =
      await obtenerGPS();


    gpsActual =
      posicion;


    /*
    ================================================
     CANVAS
    ================================================
    */

    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
    ================================================
     FECHA
    ================================================
    */

    const ahora =
      new Date();


    const fecha =
      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =
      ahora.toLocaleTimeString(
        "es-MX"
      );


    /*
    ================================================
     ESCALA
    ================================================
    */

    const escala =
      Math.max(
        width,
        height
      ) / 1200;


    const padding =
      Math.round(
        16 * escala
      );


    const font =
      Math.max(
        16,
        Math.round(
          20 * escala
        )
      );


    const altoLinea =
      Math.round(
        27 * escala
      );


    /*
    ================================================
     TEXTO
    ================================================
    */

    const lineas = [

      "PROYECTO: " +
        (
          proyecto ||
          "SIN PROYECTO"
        ),

      "TIPO PROYECTO: " +
        (
          tipoProyecto ||
          "SIN TIPO"
        ),

      "TIPO FOTO: " +
        obtenerNombreTipoFoto(tipo),

      fecha +
        "  " +
        hora,

      posicion

        ? "LAT: " +
          Number(
            posicion.lat
          ).toFixed(6) +
          "  LON: " +
          Number(
            posicion.lng
          ).toFixed(6)

        : "GPS: SIN UBICACIÓN"

    ];


    /*
    ================================================
     MEDIR ESTAMPADO
    ================================================
    */

    ctx.font =
      "bold " +
      font +
      "px Arial";


    let anchoTexto = 0;


    lineas.forEach(
      function(texto){

        const medida =
          ctx.measureText(
            texto
          ).width;


        anchoTexto =
          Math.max(
            anchoTexto,
            medida
          );

      }
    );


    const anchoCaja =
      anchoTexto +
      padding * 2;


    const altoCaja =
      lineas.length *
      altoLinea +
      padding * 2;


    const x =
      padding;


    const y =
      height -
      altoCaja -
      padding;


    /*
    ================================================
     ESTAMPADO
    ================================================
    */

    ctx.fillStyle =
      "rgba(0,0,0,.42)";


    ctx.beginPath();


    ctx.roundRect(
      x,
      y,
      anchoCaja,
      altoCaja,
      Math.round(10 * escala)
    );


    ctx.fill();


    ctx.fillStyle =
      "rgba(255,255,255,.95)";


    ctx.font =
      "bold " +
      font +
      "px Arial";


    ctx.textBaseline =
      "top";


    lineas.forEach(
      function(texto,index){

        ctx.fillText(

          texto,

          x + padding,

          y +
          padding +
          index *
          altoLinea

        );

      }
    );


    /*
    ================================================
     LOGO
    ================================================
    */

    dibujarLogo(
      ctx,
      width,
      height,
      escala
    );


    /*
    ================================================
     GUARDAR FOTO BASE
    ================================================
    */

    fotoBase =
      canvas.toDataURL(
        "image/jpeg",
        0.90
      );


    /*
    ================================================
     SIN SEÑALAR
    ================================================
    */

    if(!modoSenalar){

      enviarFotoFinal(
        fotoBase,
        ahora,
        posicion
      );

      return;

    }


    /*
    ================================================
     ABRIR VISOR
    ================================================
    */

    abrirVisorFlecha();

  }
  catch(error){

    console.error(
      error
    );

    status.textContent =
      "ERROR AL TOMAR FOTO:\n\n" +
      error.message;

  }

}


/*
====================================================
 DIBUJAR LOGO
====================================================
*/

function dibujarLogo(
  ctx,
  width,
  height,
  escala
){

  if(
    !logoCargado ||
    !logoPreload.complete ||
    !logoPreload.naturalWidth
  ){

    return;

  }


  /*
   * TAMAÑO DEL LOGO
   */

  const logoWidth =
    Math.round(
      180 * escala
    );


  const proporcion =
    logoPreload.naturalHeight /
    logoPreload.naturalWidth;


  const logoHeight =
    Math.round(
      logoWidth *
      proporcion
    );


  /*
   * MARGEN
   */

  const margen =
    Math.round(
      25 * escala
    );


  /*
   * ESQUINA SUPERIOR DERECHA
   */

  const logoX =
    width -
    logoWidth -
    margen;


  const logoY =
    margen;


  /*
   * FONDO SUAVE
   */

  ctx.fillStyle =
    "rgba(0,0,0,.20)";


  ctx.fillRect(

    logoX - 8 * escala,

    logoY - 8 * escala,

    logoWidth +
    16 * escala,

    logoHeight +
    16 * escala

  );


  /*
   * LOGO
   */

  ctx.drawImage(

    logoPreload,

    logoX,

    logoY,

    logoWidth,

    logoHeight

  );

}


/*
====================================================
 ABRIR VISOR
====================================================
*/

function abrirVisorFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      arrowCanvas.width =
        imagen.width;


      arrowCanvas.height =
        imagen.height;


      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      arrowEditor.style.display =
        "block";


      video.style.display =
        "none";


      signalButton.style.display =
        "none";


      takeButton.style.display =
        "none";


      confirmButton.style.display =
        "block";


      cancelSignalButton.style.display =
        "block";


      cancelButton.style.display =
        "none";


      colocandoFlecha =
        true;


      flechaX = null;

      flechaY = null;

      flechaAngulo = 0;

      flechaEscala = 1;


      status.textContent =
        "🎯 TOCA LA IMAGEN PARA COLOCAR LA FLECHA.\n\n" +
        "La flecha no puede entrar en el estampado ni en el logo.\n\n" +
        "Después puedes moverla, girarla y cambiar su tamaño.";

    };


  imagen.src =
    fotoBase;

}


/*
====================================================
 OBTENER PUNTO
====================================================
*/

function obtenerPuntoEvento(
  event
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        event.clientY -
        rect.top
      ) *
      escalaY

  };

}


/*
====================================================
 CLICK
====================================================
*/

arrowCanvas.addEventListener(
  "click",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    if(
      Date.now() -
      ultimoToque <
      500
    ){

      return;

    }


    const punto =
      obtenerPuntoEvento(
        event
      );


    if(
      puntoEstaEnZonaProhibida(
        punto.x,
        punto.y
      )
    ){

      alert(
        "La flecha no puede colocarse sobre el estampado ni sobre el logo."
      );

      return;

    }


    flechaX =
      punto.x;


    flechaY =
      punto.y;


    flechaAngulo =
      0;


    flechaEscala =
      1;


    dibujarFlecha();

  }
);


/*
====================================================
 TOUCH
====================================================
*/

let toqueInicial = null;

let distanciaInicial = null;

let anguloInicial = null;

let escalaInicial = null;


arrowCanvas.addEventListener(
  "touchstart",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    event.preventDefault();


    ultimoToque =
      Date.now();


    /*
     * UN DEDO
     */

    if(
      event.touches.length === 1
    ){

      const punto =
        obtenerPuntoEvento(
          event.touches[0]
        );


      if(
        flechaX !== null &&
        flechaY !== null &&
        puntoDentroDeFlecha(
          punto.x,
          punto.y
        )
      ){

        arrastrandoFlecha =
          true;

        toqueInicial = {

          x:punto.x,

          y:punto.y,

          fx:flechaX,

          fy:flechaY

        };

        return;

      }


      if(
        puntoEstaEnZonaProhibida(
          punto.x,
          punto.y
        )
      ){

        alert(
          "La flecha no puede colocarse sobre el estampado ni sobre el logo."
        );

        return;

      }


      flechaX =
        punto.x;


      flechaY =
        punto.y;


      flechaAngulo =
        0;


      flechaEscala =
        1;


      dibujarFlecha();

      return;

    }


    /*
     * DOS DEDOS
     */

    if(
      event.touches.length >= 2 &&
      flechaX !== null
    ){

      const t1 =
        event.touches[0];


      const t2 =
        event.touches[1];


      distanciaInicial =
        distanciaEntre(
          t1,
          t2
        );


      anguloInicial =
        anguloEntre(
          t1,
          t2
        );


      escalaInicial =
        flechaEscala;

    }

  },
  {
    passive:false
  }
);


/*
====================================================
 TOUCH MOVE
====================================================
*/

arrowCanvas.addEventListener(
  "touchmove",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    event.preventDefault();


    /*
     * MOVER CON UN DEDO
     */

    if(
      event.touches.length === 1 &&
      arrastrandoFlecha &&
      toqueInicial
    ){

      const punto =
        obtenerPuntoEvento(
          event.touches[0]
        );


      const nuevoX =
        toqueInicial.fx +
        (
          punto.x -
          toqueInicial.x
        );


      const nuevoY =
        toqueInicial.fy +
        (
          punto.y -
          toqueInicial.y
        );


      if(
        !puntoEstaEnZonaProhibida(
          nuevoX,
          nuevoY
        )
      ){

        flechaX =
          nuevoX;

        flechaY =
          nuevoY;

        dibujarFlecha();

      }

      return;

    }


    /*
     * DOS DEDOS
     */

    if(
      event.touches.length >= 2 &&
      flechaX !== null
    ){

      const t1 =
        event.touches[0];


      const t2 =
        event.touches[1];


      const distanciaActual =
        distanciaEntre(
          t1,
          t2
        );


      const anguloActual =
        anguloEntre(
          t1,
          t2
        );


      /*
       * CAMBIAR TAMAÑO
       */

      if(
        distanciaInicial
      ){

        let factor =
          distanciaActual /
          distanciaInicial;


        flechaEscala =
          escalaInicial *
          factor;


        flechaEscala =
          Math.max(
            0.45,
            Math.min(
              2.5,
              flechaEscala
            )
          );

      }


      /*
       * GIRAR
       */

      if(
        anguloInicial !== null
      ){

        flechaAngulo =
          anguloInicial === null
          ? 0
          :
          anguloActual -
          anguloInicial;

      }


      dibujarFlecha();

    }

  },
  {
    passive:false
  }
);


/*
====================================================
 TOUCH END
====================================================
*/

arrowCanvas.addEventListener(
  "touchend",
  function(){

    arrastrandoFlecha =
      false;

    toqueInicial =
      null;

    distanciaInicial =
      null;

    anguloInicial =
      null;

  }
);


/*
====================================================
 DISTANCIA
====================================================
*/

function distanciaEntre(
  a,
  b
){

  const dx =
    b.clientX -
    a.clientX;


  const dy =
    b.clientY -
    a.clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/*
====================================================
 ANGULO
====================================================
*/

function anguloEntre(
  a,
  b
){

  return Math.atan2(

    b.clientY -
    a.clientY,

    b.clientX -
    a.clientX

  );

}


/*
====================================================
 DENTRO DE FLECHA
====================================================
*/

function puntoDentroDeFlecha(
  x,
  y
){

  if(
    flechaX === null ||
    flechaY === null
  ){

    return false;

  }


  const escala =
    Math.max(
      arrowCanvas.width,
      arrowCanvas.height
    ) / 1200;


  const radio =
    100 *
    escala *
    flechaEscala;


  const distancia =
    Math.sqrt(

      Math.pow(
        x - flechaX,
        2
      ) +

      Math.pow(
        y - flechaY,
        2
      )

    );


  return distancia <= radio;

}


/*
====================================================
 ZONA PROHIBIDA
 ESTAMPADO + LOGO
====================================================
*/

function puntoEstaEnZonaProhibida(
  x,
  y
){

  const width =
    arrowCanvas.width;


  const height =
    arrowCanvas.height;


  const escala =
    Math.max(
      width,
      height
    ) / 1200;


  /*
   * ESTAMPADO
   */

  const padding =
    Math.round(
      16 * escala
    );


  const font =
    Math.max(
      16,
      Math.round(
        20 * escala
      )
    );


  const altoLinea =
    Math.round(
      27 * escala
    );


  const lineas = [

    "PROYECTO: " +
      (
        proyecto ||
        "SIN PROYECTO"
      ),

    "TIPO PROYECTO: " +
      (
        tipoProyecto ||
        "SIN TIPO"
      ),

    "TIPO FOTO: " +
      obtenerNombreTipoFoto(tipo),

    "FECHA / HORA",

    "LAT / LON"

  ];


  const ctx =
    arrowCanvas.getContext(
      "2d"
    );


  ctx.font =
    "bold " +
    font +
    "px Arial";


  let anchoTexto =
    0;


  lineas.forEach(
    function(texto){

      anchoTexto =
        Math.max(

          anchoTexto,

          ctx.measureText(
            texto
          ).width

        );

    }
  );


  const anchoCaja =
    anchoTexto +
    padding * 2;


  const altoCaja =
    lineas.length *
    altoLinea +
    padding * 2;


  const cajaX =
    padding;


  const cajaY =
    height -
    altoCaja -
    padding;


  const margen =
    35 * escala;


  const dentroEstampado =

    x >=
      cajaX - margen &&

    x <=
      cajaX +
      anchoCaja +
      margen &&

    y >=
      cajaY - margen &&

    y <=
      cajaY +
      altoCaja +
      margen;


  if(dentroEstampado){

    return true;

  }


  /*
   * LOGO
   */

  if(
    logoCargado &&
    logoPreload.naturalWidth
  ){

    const logoWidth =
      Math.round(
        180 * escala
      );


    const proporcion =
      logoPreload.naturalHeight /
      logoPreload.naturalWidth;


    const logoHeight =
      Math.round(
        logoWidth *
        proporcion
      );


    const margenLogo =
      Math.round(
        25 * escala
      );


    const logoX =
      width -
      logoWidth -
      margenLogo;


    const logoY =
      margenLogo;


    const margenExtra =
      25 * escala;


    if(

      x >=
        logoX -
        margenExtra &&

      x <=
        logoX +
        logoWidth +
        margenExtra &&

      y >=
        logoY -
        margenExtra &&

      y <=
        logoY +
        logoHeight +
        margenExtra

    ){

      return true;

    }

  }


  return false;

}


/*
====================================================
 DIBUJAR FLECHA
====================================================
*/

function dibujarFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      if(
        flechaX === null ||
        flechaY === null
      ){

        return;

      }


      const escalaBase =
        Math.max(
          arrowCanvas.width,
          arrowCanvas.height
        ) / 1200;


      const longitud =
        150 *
        escalaBase *
        flechaEscala;


      const punta =
        32 *
        escalaBase *
        flechaEscala;


      const inicioX =
        flechaX -
        longitud *
        Math.cos(
          flechaAngulo
        );


      const inicioY =
        flechaY -
        longitud *
        Math.sin(
          flechaAngulo
        );


      /*
       * VERDE
       */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#00ff44";


      ctx.lineWidth =
        Math.max(
          8,
          9 *
          escalaBase *
          flechaEscala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      /*
       * BORDE OSCURO
       */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#003d12";


      ctx.lineWidth =
        Math.max(
          12,
          13 *
          escalaBase *
          flechaEscala
        );


      ctx.globalCompositeOperation =
        "destination-over";


      ctx.stroke();


      ctx.globalCompositeOperation =
        "source-over";


      /*
       * CABEZA
       */

      const angulo =
        Math.atan2(

          flechaY -
          inicioY,

          flechaX -
          inicioX

        );


      ctx.beginPath();


      ctx.moveTo(
        flechaX,
        flechaY
      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo -
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo -
          Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo +
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo +
          Math.PI / 6
        )

      );


      ctx.closePath();


      ctx.fillStyle =
        "#00ff44";


      ctx.fill();


      ctx.strokeStyle =
        "#003d12";


      ctx.lineWidth =
        Math.max(
          3,
          4 *
          escalaBase *
          flechaEscala
        );


      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}

/*
====================================================
 ENVIAR FOTO
====================================================
*/

function enviarFotoFinal(
  dataURL,
  ahora,
  posicion
){

  preview.src =
    dataURL;


  preview.style.display =
    "block";


  const nombre =
    crearNombreFoto(
      tipo,
      ahora
    );


  const mensaje = {

    type:
      "CAMERA_STAMP_PHOTO",

    tipo:
      tipo,

    fileName:
      nombre,

    mimeType:
      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null

  };


  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(
      mensaje,
      "*"
    );

  }


  status.textContent =
    "✅ FOTO CAPTURADA.\n\n" +
    "Regresando al formulario...";


  detenerCamara();


  setTimeout(
    function(){

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.focus();

        window.close();

      }

    },
    500
  );

}


/*
====================================================
 GPS
====================================================
*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          resolve({

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          });

        },

        function(){

          resolve(null);

        },

        {

          enableHighAccuracy:true,

          timeout:10000,

          maximumAge:0

        }

      );

    }
  );

}


/*
====================================================
 TIPO FOTO
====================================================
*/

function obtenerNombreTipoFoto(tipo){

  if(tipo === "poste")
    return "POSTE";


  if(tipo === "mega")
    return "CAJAS MEGA";


  if(tipo === "medidores")
    return "MEDIDORES";


  if(tipo === "carriers")
    return "CAJAS CARRIERS";


  return String(
    tipo || ""
  ).toUpperCase();

}


/*
====================================================
 NOMBRE FOTO
====================================================
*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)
      .replace(/\s+/g,"_") +

    "_" +

    formatFileDate(fecha) +

    ".jpg"

  );

}


function formatFileDate(
  date
){

  return (

    date.getFullYear() +

    String(
      date.getMonth()+1
    ).padStart(2,"0") +

    String(
      date.getDate()
    ).padStart(2,"0") +

    "_" +

    String(
      date.getHours()
    ).padStart(2,"0") +

    String(
      date.getMinutes()
    ).padStart(2,"0") +

    String(
      date.getSeconds()
    ).padStart(2,"0")

  );

}

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}
