<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

h2 {
  text-align: center;
  margin: 5px 0 15px 0;
}

#cameraContainer {
  width: 100%;
  max-width: 800px;
  margin: auto;
}

#video {
  width: 100%;
  display: block;
  background: black;
  border-radius: 10px;
}

#canvas {
  display: none;
}

.controls {
  max-width: 800px;
  margin: 15px auto;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 8px;
  font-size: 20px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#startButton {
  background: #2196f3;
  color: white;
}

#takeButton {
  background: #4caf50;
  color: white;
}

#cancelButton {
  background: #f44336;
  color: white;
}

button:disabled {
  opacity: 0.4;
}

#preview {
  width: 100%;
  max-width: 800px;
  display: none;
  margin: 15px auto;
  border-radius: 8px;
}

#status {
  max-width: 800px;
  margin: 15px auto;
  padding: 12px;
  background: #222;
  border-radius: 8px;
  white-space: pre-wrap;
}

</style>

</head>

<body>

<div id="cameraContainer">

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <canvas id="canvas"></canvas>

  <div id="cameraControls">

    <button
      id="startButton">
      📷 START CAMERA
    </button>

    <button
      id="takeButton"
      disabled>
      📸 TAKE PHOTO
    </button>

    <button
      id="cancelButton">
      ✕ CANCEL
    </button>

  </div>

</div>

<img id="preview">

<div id="status"></div>


<script>

/*
====================================================
 DATOS RECIBIDOS DEL FORMULARIO
====================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const tipo =
  params.get("tipo") || "poste";


const proyecto =
  params.get("proyecto") || "";


const tipoProyecto =
  params.get("tipoProyecto") || "";


const hub =
  params.get("hub") || "";


const rama =
  params.get("rama") || "";


console.log(
  "DATOS RECIBIDOS:",
  {
    tipo,
    proyecto,
    tipoProyecto,
    hub,
    rama
  }
);


/*
====================================================
 ELEMENTOS
====================================================
*/

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("preview");

const startButton =
  document.getElementById("startButton");

const takeButton =
  document.getElementById("takeButton");

const cancelButton =
  document.getElementById("cancelButton");

const status =
  document.getElementById("status");

const stampText =
  document.getElementById("stampText");


/*
====================================================
 VARIABLES
====================================================
*/

let stream = null;


/*
====================================================
 TEXTO INICIAL
====================================================
*/

if(proyecto){

  stampText.value =
    proyecto;

}


/*
====================================================
 INICIAR CÁMARA
====================================================
*/

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    /*
    ================================================
     VALIDAR API
    ================================================
    */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara."
      );

    }


    /*
    ================================================
     DETENER CÁMARA ANTERIOR
    ================================================
    */

    detenerCamara();


    /*
    ================================================
     SOLICITAR CÁMARA TRASERA
    ================================================
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    /*
    ================================================
     MOSTRAR VIDEO
    ================================================
    */

    video.srcObject =
      stream;


    await video.play();


    takeButton.disabled =
      false;


    status.textContent =
      "✅ Cámara lista.\n\n" +
      "Presiona TAKE PHOTO.";


  }
  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    let mensaje =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n";


    if(
      error.name ===
      "NotAllowedError"
    ){

      mensaje +=
        "El navegador bloqueó el permiso de cámara.\n\n" +

        "Revisa los permisos de cámara del navegador " +
        "y vuelve a intentarlo.";

    }

    else if(
      error.name ===
      "NotFoundError"
    ){

      mensaje +=
        "No se encontró una cámara.";

    }

    else if(
      error.name ===
      "NotReadableError"
    ){

      mensaje +=
        "La cámara está siendo utilizada por otra aplicación.";

    }

    else{

      mensaje +=
        error.name +
        "\n" +
        error.message;

    }


    status.textContent =
      mensaje;

  }

}


/*
====================================================
 TOMAR FOTO
====================================================
*/

takeButton.addEventListener(
  "click",
  tomarFoto
);


async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(
        "La cámara no está iniciada."
      );

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    /*
    ================================================
     OBTENER GPS REAL DEL TELÉFONO
    ================================================
    */

    status.textContent =
      "Obteniendo ubicación GPS...";


    const posicion =
      await obtenerGPS();


    /*
    ================================================
     CANVAS
    ================================================
    */

    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    if(!ctx){

      throw new Error(
        "No fue posible crear el canvas."
      );

    }


    /*
    ================================================
     IMAGEN
    ================================================
    */

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
    ================================================
     FECHA Y HORA
    ================================================
    */

    const ahora =
      new Date();


    const fecha =
      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =
      ahora.toLocaleTimeString(
        "es-MX"
      );


    /*
    ================================================
     ESCALA
    ================================================
    */

    const escala =
      Math.max(
        width,
        height
      ) / 1200;


    const padding =
      Math.round(
        16 * escala
      );


    const font =
      Math.max(
        16,
        Math.round(
          20 * escala
        )
      );


    const altoLinea =
      Math.round(
        27 * escala
      );


    /*
    ================================================
     TEXTO DEL ESTAMPADO
    ================================================
    */

    const lineas = [

      "PROYECTO: " +
        (
          proyecto ||
          "SIN PROYECTO"
        ),

      "TIPO PROYECTO: " +
        (
          tipoProyecto ||
          "SIN TIPO"
        ),

      "TIPO FOTO: " +
        obtenerNombreTipoFoto(tipo),

      fecha +
        "  " +
        hora,

      posicion

        ? "LAT: " +
          Number(
            posicion.lat
          ).toFixed(6) +
          "  LON: " +
          Number(
            posicion.lng
          ).toFixed(6)

        : "GPS: SIN UBICACIÓN"

    ];


    /*
    ================================================
     MEDIR CAJA
    ================================================
    */

    ctx.font =
      "bold " +
      font +
      "px Arial";


    let anchoTexto =
      0;


    lineas.forEach(
      function(texto){

        const medida =
          ctx.measureText(
            texto
          ).width;


        if(
          medida >
          anchoTexto
        ){

          anchoTexto =
            medida;

        }

      }
    );


    const anchoCaja =
      anchoTexto +
      padding * 2;


    const altoCaja =
      lineas.length *
        altoLinea +
      padding * 2;


    /*
    ================================================
     POSICIÓN
    ================================================
    */

    const x =
      padding;


    const y =
      height -
      altoCaja -
      padding;


    /*
    ================================================
     CAJA SEMITRANSPARENTE
    ================================================
    */

    ctx.fillStyle =
      "rgba(0, 0, 0, 0.42)";


    ctx.beginPath();


    const radio =
      Math.round(
        10 * escala
      );


    ctx.roundRect(
      x,
      y,
      anchoCaja,
      altoCaja,
      radio
    );


    ctx.fill();


    /*
    ================================================
     TEXTO
    ================================================
    */

    ctx.fillStyle =
      "rgba(255,255,255,0.95)";


    ctx.font =
      "bold " +
      font +
      "px Arial";


    ctx.textBaseline =
      "top";


    lineas.forEach(
      function(texto, index){

        ctx.fillText(

          texto,

          x + padding,

          y +
          padding +
          index *
          altoLinea

        );

      }
    );


    /*
    ================================================
     CREAR JPG
    ================================================
    */

    const dataURL =
      canvas.toDataURL(
        "image/jpeg",
        0.90
      );


    /*
    ================================================
     PREVIEW
    ================================================
    */

    preview.src =
      dataURL;


    preview.style.display =
      "block";


    /*
    ================================================
     NOMBRE
    ================================================
    */

    const nombre =
      crearNombreFoto(
        tipo,
        ahora
      );


    /*
    ================================================
     MENSAJE AL FORMULARIO
    ================================================
    */

    const mensaje = {

      type:
        "CAMERA_STAMP_PHOTO",

      tipo:
        tipo,

      fileName:
        nombre,

      mimeType:
        "image/jpeg",

      data:
        dataURL,

      latitud:
        posicion
          ? posicion.lat
          : null,

      longitud:
        posicion
          ? posicion.lng
          : null

    };


    /*
    ================================================
     ENVIAR AL FORMULARIO
    ================================================
    */

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(
        mensaje,
        "*"
      );

    }


    /*
    ================================================
     MENSAJE
    ================================================
    */

    status.textContent =
      "✅ FOTO CAPTURADA.\n\n" +
      "Regresando al formulario...";


    /*
    ================================================
     CERRAR CÁMARA
    ================================================
    */

    detenerCamara();


    setTimeout(
      function(){

        if(
          window.opener &&
          !window.opener.closed
        ){

          window.opener.focus();

          window.close();

        }
        else{

          status.textContent =
            "✅ FOTO CAPTURADA.\n\n" +
            "Puedes regresar manualmente al formulario.";

        }

      },
      500
    );

  }
  catch(error){

    console.error(
      "ERROR TOMANDO FOTO:",
      error
    );


    status.textContent =
      "ERROR AL TOMAR FOTO:\n\n" +
      error.message;

  }

}

/*
====================================================
 GPS
====================================================
*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        console.warn(
          "GPS NO DISPONIBLE"
        );

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          const resultado = {

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          };


          console.log(
            "GPS OBTENIDO:",
            resultado
          );


          resolve(
            resultado
          );

        },


        function(error){

          console.warn(
            "NO SE PUDO OBTENER GPS:",
            error
          );


          resolve(null);

        },


        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            0

        }

      );

    }
  );

}

/*
====================================================
 NOMBRE TIPO FOTO
====================================================
*/

function obtenerNombreTipoFoto(tipo){

  if(tipo === "poste")
    return "POSTE";

  if(tipo === "mega")
    return "CAJAS MEGA";

  if(tipo === "medidores")
    return "MEDIDORES";

  if(tipo === "carriers")
    return "CAJAS CARRIERS";

  return String(
    tipo || ""
  ).toUpperCase();

}


/*
====================================================
 NOMBRE FOTO
====================================================
*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (
    "STAMPED_" +
    obtenerNombreTipoFoto(tipo)
      .replace(/\s+/g,"_") +
    "_" +
    formatFileDate(fecha) +
    ".jpg"
  );

}


/*
====================================================
 FECHA ARCHIVO
====================================================
*/

function formatFileDate(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  const hour =
    String(
      date.getHours()
    ).padStart(2,"0");

  const minute =
    String(
      date.getMinutes()
    ).padStart(2,"0");

  const second =
    String(
      date.getSeconds()
    ).padStart(2,"0");


  return (
    year +
    month +
    day +
    "_" +
    hour +
    minute +
    second
  );

}


/*
====================================================
 CANCELAR
====================================================
*/

cancelButton.addEventListener(
  "click",
  function(){

    detenerCamara();


    if(
      window.opener &&
      !window.opener.closed
    ){

      window.close();

    }

  }
);


/*
====================================================
 DETENER CÁMARA
====================================================
*/

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}

</script>

</body>

</html>
