<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

h2 {
  text-align: center;
  margin: 5px 0 15px 0;
}

#cameraContainer {

  width:100%;

  max-width:800px;

  margin:auto;

  position:relative;

  background:#000;

  border-radius:10px;

  overflow:hidden;

}


#video {

  width:100%;

  display:block;

  background:#000;

}


#canvas {

  display:none;

}


/*==================================================
 VISOR DE SEÑALAMIENTO
==================================================*/

#arrowEditor {

  display:none;

  position:relative;

  width:100%;

  background:#000;

}


#arrowCanvas {

  width:100%;

  display:block;

  background:#000;

  cursor:crosshair;

}


/*==================================================
 BOTONES
==================================================*/

#cameraControls {

  position:absolute;

  left:0;

  right:0;

  bottom:0;

  display:flex;

  gap:10px;

  padding:12px;

  background:linear-gradient(
    transparent,
    rgba(0,0,0,.80)
  );

  z-index:10;

}


#cameraControls button {

  flex:1;

  min-height:52px;

  padding:12px;

  font-size:15px;

  font-weight:bold;

  border:none;

  border-radius:8px;

  cursor:pointer;

}


#startButton {

  background:#2196f3;

  color:white;

}


#takeButton {

  background:#4caf50;

  color:white;

}


#signalButton {

  background:#ff9800;

  color:white;

}


#signalButton.active {

  background:#e65100;

  box-shadow:
    0 0 0 3px rgba(255,152,0,.35);

}


#cancelButton {

  background:#f44336;

  color:white;

}


#confirmButton {

  background:#4caf50;

  color:white;

  display:none;

}


#cancelSignalButton {

  background:#f44336;

  color:white;

  display:none;

}


#cameraControls button:disabled {

  opacity:.4;

}


#preview {

  width:100%;

  max-width:800px;

  display:none;

  margin:15px auto;

  border-radius:8px;

}


/*==================================================
 MENSAJE
==================================================*/

#status {

  display:none;

}


/*==================================================
 CELULAR
==================================================*/

@media(max-width:600px){

  body {

    padding:0;

    background:#000;

  }


  #cameraContainer {

    width:100vw;

    height:100vh;

    max-width:none;

    border-radius:0;

  }


  #video {

    width:100vw;

    height:100vh;

    object-fit:cover;

  }


  #arrowEditor {

    width:100vw;

    height:100vh;

  }


  #arrowCanvas {

    width:100vw;

    height:100vh;

    object-fit:contain;

  }


  #cameraControls {

    padding:

      12px

      10px

      calc(12px + env(safe-area-inset-bottom));

    gap:8px;

  }


  #cameraControls button {

    min-height:52px;

    font-size:14px;

  }

}


</style>

</head>

<body>

<div id="cameraContainer">

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <canvas id="canvas"></canvas>


  <!-- ============================================
       VISOR PARA COLOCAR LA FLECHA
  ============================================= -->

  <div id="arrowEditor">

    <canvas
      id="arrowCanvas">
    </canvas>

  </div>


  <div id="cameraControls">

    <button
      id="startButton">
      📷 START CAMERA
    </button>


    <button
      id="signalButton">
      🎯 SEÑALAR
    </button>


    <button
      id="takeButton"
      disabled>
      📸 TAKE PHOTO
    </button>


    <button
      id="confirmButton">
      ✅ CONFIRMAR
    </button>


    <button
      id="cancelSignalButton">
      ❌ CANCELAR SEÑAL
    </button>


    <button
      id="cancelButton">
      ✕ CANCEL
    </button>

  </div>

</div>


<img id="preview">


<div id="status"></div>


<script>

/*
====================================================
 DATOS RECIBIDOS DEL FORMULARIO
====================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const tipo =
  params.get("tipo") || "poste";


const proyecto =
  params.get("proyecto") || "";


const tipoProyecto =
  params.get("tipoProyecto") || "";


const hub =
  params.get("hub") || "";


const rama =
  params.get("rama") || "";


console.log(
  "DATOS RECIBIDOS:",
  {
    tipo,
    proyecto,
    tipoProyecto,
    hub,
    rama
  }
);


/*
====================================================
 ELEMENTOS
====================================================
*/

const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const preview =
  document.getElementById("preview");


const startButton =
  document.getElementById("startButton");


const signalButton =
  document.getElementById("signalButton");


const takeButton =
  document.getElementById("takeButton");


const confirmButton =
  document.getElementById("confirmButton");


const cancelSignalButton =
  document.getElementById(
    "cancelSignalButton"
  );


const cancelButton =
  document.getElementById("cancelButton");


const status =
  document.getElementById("status");


const arrowEditor =
  document.getElementById(
    "arrowEditor"
  );


const arrowCanvas =
  document.getElementById(
    "arrowCanvas"
  );


/*
====================================================
 VARIABLES
====================================================
*/

let stream = null;


/*
 * Indica si el usuario activó SEÑALAR
 */

let modoSenalar = false;


/*
 * Indica si estamos colocando la flecha
 */

let colocandoFlecha = false;


/*
 * Coordenadas de la flecha
 */

let flechaX = null;

let flechaY = null;


/*
 * Imagen original estampada
 */

let fotoBase = null;


/*
 * GPS
 */

let gpsActual = null;


/*
====================================================
 INICIAR CÁMARA
====================================================
*/

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara."
      );

    }


    detenerCamara();


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.disabled =
      false;


    status.textContent =
      "✅ Cámara lista.\n\n" +
      "Puedes tomar la foto directamente o activar SEÑALAR.";


  }
  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    let mensaje =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n";


    if(
      error.name ===
      "NotAllowedError"
    ){

      mensaje +=
        "El navegador bloqueó el permiso de cámara.\n\n" +

        "Revisa los permisos de cámara del navegador " +
        "y vuelve a intentarlo.";

    }

    else if(
      error.name ===
      "NotFoundError"
    ){

      mensaje +=
        "No se encontró una cámara.";

    }

    else if(
      error.name ===
      "NotReadableError"
    ){

      mensaje +=
        "La cámara está siendo utilizada por otra aplicación.";

    }

    else{

      mensaje +=
        error.name +
        "\n" +
        error.message;

    }


    status.textContent =
      mensaje;


    startButton.style.display =
      "block";


    takeButton.disabled =
      true;

  }

}


/*
====================================================
 BOTÓN SEÑALAR
====================================================
*/

signalButton.addEventListener(
  "click",
  activarSenalar
);


function activarSenalar(){

  modoSenalar =
    !modoSenalar;


  if(modoSenalar){

    signalButton.classList.add(
      "active"
    );


    signalButton.textContent =
      "🎯 SEÑALAR ACTIVADO";


    status.textContent =
      "🎯 MODO SEÑALAR ACTIVADO.\n\n" +

      "Toma la fotografía.\n" +

      "Después podrás colocar la flecha.";

  }
  else{

    desactivarSenalar();

  }

}


/*
====================================================
 DESACTIVAR SEÑALAR
====================================================
*/

function desactivarSenalar(){

  modoSenalar =
    false;


  signalButton.classList.remove(
    "active"
  );


  signalButton.textContent =
    "🎯 SEÑALAR";

}


/*
====================================================
 TOMAR FOTO
====================================================
*/

takeButton.addEventListener(
  "click",
  tomarFoto
);


async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(
        "La cámara no está iniciada."
      );

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    /*
    ================================================
     GPS
    ================================================
    */

    status.textContent =
      "Obteniendo ubicación GPS...";


    const posicion =
      await obtenerGPS();


    gpsActual =
      posicion;


    /*
    ================================================
     CANVAS
    ================================================
    */

    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    if(!ctx){

      throw new Error(
        "No fue posible crear el canvas."
      );

    }


    /*
    ================================================
     IMAGEN
    ================================================
    */

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
    ================================================
     FECHA Y HORA
    ================================================
    */

    const ahora =
      new Date();


    const fecha =
      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =
      ahora.toLocaleTimeString(
        "es-MX"
      );


    /*
    ================================================
     ESCALA
    ================================================
    */

    const escala =
      Math.max(
        width,
        height
      ) / 1200;


    const padding =
      Math.round(
        16 * escala
      );


    const font =
      Math.max(
        16,
        Math.round(
          20 * escala
        )
      );


    const altoLinea =
      Math.round(
        27 * escala
      );


    /*
    ================================================
     TEXTO ESTAMPADO
    ================================================
    */

    const lineas = [

      "PROYECTO: " +
        (
          proyecto ||
          "SIN PROYECTO"
        ),

      "TIPO PROYECTO: " +
        (
          tipoProyecto ||
          "SIN TIPO"
        ),

      "TIPO FOTO: " +
        obtenerNombreTipoFoto(tipo),

      fecha +
        "  " +
        hora,

      posicion

        ? "LAT: " +
          Number(
            posicion.lat
          ).toFixed(6) +
          "  LON: " +
          Number(
            posicion.lng
          ).toFixed(6)

        : "GPS: SIN UBICACIÓN"

    ];


    /*
    ================================================
     MEDIR CAJA
    ================================================
    */

    ctx.font =
      "bold " +
      font +
      "px Arial";


    let anchoTexto =
      0;


    lineas.forEach(
      function(texto){

        const medida =
          ctx.measureText(
            texto
          ).width;


        if(
          medida >
          anchoTexto
        ){

          anchoTexto =
            medida;

        }

      }
    );


    const anchoCaja =
      anchoTexto +
      padding * 2;


    const altoCaja =
      lineas.length *
        altoLinea +
      padding * 2;


    /*
    ================================================
     POSICIÓN DEL ESTAMPADO
    ================================================
    */

    const x =
      padding;


    const y =
      height -
      altoCaja -
      padding;


    /*
    ================================================
     CAJA
    ================================================
    */

    ctx.fillStyle =
      "rgba(0, 0, 0, 0.42)";


    ctx.beginPath();


    const radio =
      Math.round(
        10 * escala
      );


    ctx.roundRect(
      x,
      y,
      anchoCaja,
      altoCaja,
      radio
    );


    ctx.fill();


    /*
    ================================================
     TEXTO
    ================================================
    */

    ctx.fillStyle =
      "rgba(255,255,255,0.95)";


    ctx.font =
      "bold " +
      font +
      "px Arial";


    ctx.textBaseline =
      "top";


    lineas.forEach(
      function(texto, index){

        ctx.fillText(

          texto,

          x + padding,

          y +
          padding +
          index *
          altoLinea

        );

      }
    );


    /*
    ================================================
     GUARDAR FOTO BASE
    ================================================
    */

    fotoBase =
      canvas.toDataURL(
        "image/jpeg",
        0.90
      );


    /*
    ================================================
     SI NO SEÑALÓ
    ================================================
    */

    if(!modoSenalar){

      enviarFotoFinal(
        fotoBase,
        ahora,
        posicion
      );

      return;

    }


    /*
    ================================================
     MODO SEÑALAR
    ================================================
    */

    abrirVisorFlecha();

  }
  catch(error){

    console.error(
      "ERROR TOMANDO FOTO:",
      error
    );


    status.textContent =
      "ERROR AL TOMAR FOTO:\n\n" +
      error.message;

  }

}


/*
====================================================
 ABRIR VISOR DE FLECHA
====================================================
*/

function abrirVisorFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      arrowCanvas.width =
        imagen.width;


      arrowCanvas.height =
        imagen.height;


      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      arrowEditor.style.display =
        "block";


      video.style.display =
        "none";


      signalButton.style.display =
        "none";


      takeButton.style.display =
        "none";


      confirmButton.style.display =
        "block";


      cancelSignalButton.style.display =
        "block";


      cancelButton.style.display =
        "none";


      colocandoFlecha =
        true;


      status.textContent =
        "🎯 TOCA LA IMAGEN DONDE QUIERES COLOCAR LA FLECHA.\n\n" +

        "La flecha no podrá colocarse sobre el estampado.";

    };


  imagen.src =
    fotoBase;

}


/*
====================================================
 TOCAR VISOR
====================================================
*/

arrowCanvas.addEventListener(
  "click",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    const rect =
      arrowCanvas.getBoundingClientRect();


    const escalaX =
      arrowCanvas.width /
      rect.width;


    const escalaY =
      arrowCanvas.height /
      rect.height;


    const x =
      (
        event.clientX -
        rect.left
      ) *
      escalaX;


    const y =
      (
        event.clientY -
        rect.top
      ) *
      escalaY;


    /*
    ================================================
     VERIFICAR ESTAMPADO
    ================================================
    */

    if(
      puntoEstaEnEstampado(
        x,
        y
      )
    ){

      alert(
        "La flecha no puede colocarse sobre el estampado.\n\nSelecciona otra ubicación."
      );

      return;

    }


    flechaX =
      x;


    flechaY =
      y;


    dibujarFlecha();

  }
);


/*
====================================================
 VERIFICAR ESTAMPADO
====================================================
*/

function puntoEstaEnEstampado(
  x,
  y
){

  const width =
    arrowCanvas.width;


  const height =
    arrowCanvas.height;


  const escala =
    Math.max(
      width,
      height
    ) / 1200;


  const padding =
    Math.round(
      16 * escala
    );


  const font =
    Math.max(
      16,
      Math.round(
        20 * escala
      )
    );


  const altoLinea =
    Math.round(
      27 * escala
    );


  const lineas = [

    "PROYECTO: " +
      (
        proyecto ||
        "SIN PROYECTO"
      ),

    "TIPO PROYECTO: " +
      (
        tipoProyecto ||
        "SIN TIPO"
      ),

    "TIPO FOTO: " +
      obtenerNombreTipoFoto(tipo),

    "FECHA / HORA",

    "LAT / LON"

  ];


  const ctx =
    arrowCanvas.getContext(
      "2d"
    );


  ctx.font =
    "bold " +
    font +
    "px Arial";


  let anchoTexto =
    0;


  lineas.forEach(
    function(texto){

      const medida =
        ctx.measureText(
          texto
        ).width;


      if(
        medida >
        anchoTexto
      ){

        anchoTexto =
          medida;

      }

    }
  );


  const anchoCaja =
    anchoTexto +
    padding * 2;


  const altoCaja =
    lineas.length *
      altoLinea +
    padding * 2;


  const cajaX =
    padding;


  const cajaY =
    height -
    altoCaja -
    padding;


  /*
  ================================================
   MARGEN EXTRA PARA EVITAR QUE LA FLECHA
   TOQUE EL ESTAMPADO
  ================================================
  */

  const margen =
    25 * escala;


  return (

    x >=
      cajaX - margen &&

    x <=
      cajaX +
      anchoCaja +
      margen &&

    y >=
      cajaY - margen &&

    y <=
      cajaY +
      altoCaja +
      margen

  );

}


/*
====================================================
 DIBUJAR FLECHA
====================================================
*/

function dibujarFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      const escala =
        Math.max(
          arrowCanvas.width,
          arrowCanvas.height
        ) / 1200;


      /*
      ==============================================
       LONGITUD DE FLECHA
      ==============================================
      */

      const longitud =
        150 * escala;


      /*
      ==============================================
       PUNTA DE FLECHA
      ==============================================
      */

      const punta =
        32 * escala;


      /*
      ==============================================
       LA FLECHA APUNTA AL PUNTO SELECCIONADO
       DESDE ARRIBA/IZQUIERDA
      ==============================================
      */

      const inicioX =
        flechaX -
        longitud;


      const inicioY =
        flechaY -
        longitud;


      /*
      ==============================================
       LINEA ROJA
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#ff0000";


      ctx.lineWidth =
        Math.max(
          8,
          9 * escala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      /*
      ==============================================
       BORDE BLANCO
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "rgba(255,255,255,.8)";


      ctx.lineWidth =
        Math.max(
          2,
          3 * escala
        );


      ctx.stroke();


      /*
      ==============================================
       CABEZA DE LA FLECHA
      ==============================================
      */

      const angulo =
        Math.atan2(
          flechaY - inicioY,
          flechaX - inicioX
        );


      ctx.beginPath();


      ctx.moveTo(
        flechaX,
        flechaY
      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo - Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo - Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo + Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo + Math.PI / 6
        )

      );


      ctx.closePath();


      ctx.fillStyle =
        "#ff0000";


      ctx.fill();


      /*
      ==============================================
       PUNTO CENTRAL
      ==============================================
      */

      ctx.beginPath();


      ctx.arc(

        flechaX,

        flechaY,

        10 * escala,

        0,

        Math.PI * 2

      );


      ctx.fillStyle =
        "#ffff00";


      ctx.fill();


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        3 * escala;


      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}


/*
====================================================
 CANCELAR SEÑAL
====================================================
*/

cancelSignalButton.addEventListener(
  "click",
  function(){

    colocandoFlecha =
      false;


    flechaX =
      null;


    flechaY =
      null;


    fotoBase =
      null;


    arrowEditor.style.display =
      "none";


    video.style.display =
      "block";


    confirmButton.style.display =
      "none";


    cancelSignalButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.style.display =
      "block";


    cancelButton.style.display =
      "block";


    desactivarSenalar();


    status.textContent =
      "Se canceló el señalamiento.\n\n" +
      "Puedes tomar otra fotografía.";

  }
);


/*
====================================================
 CONFIRMAR FOTO CON FLECHA
====================================================
*/

confirmButton.addEventListener(
  "click",
  function(){

    if(
      !fotoBase
    ){

      return;

    }


    if(
      flechaX === null ||
      flechaY === null
    ){

      alert(
        "Primero toca la imagen para colocar la flecha."
      );

      return;

    }


    /*
    ================================================
     OBTENER FOTO FINAL
    ================================================
    */

    const dataURL =
      arrowCanvas.toDataURL(
        "image/jpeg",
        0.90
      );


    const ahora =
      new Date();


    /*
    ================================================
     ENVIAR
    ================================================
    */

    enviarFotoFinal(
      dataURL,
      ahora,
      gpsActual
    );

  }
);


/*
====================================================
 ENVIAR FOTO FINAL
====================================================
*/

function enviarFotoFinal(
  dataURL,
  ahora,
  posicion
){

  /*
  ================================================
   PREVIEW
  ================================================
  */

  preview.src =
    dataURL;


  preview.style.display =
    "block";


  /*
  ================================================
   NOMBRE
  ================================================
  */

  const nombre =
    crearNombreFoto(
      tipo,
      ahora
    );


  /*
  ================================================
   MENSAJE
  ================================================
  */

  const mensaje = {

    type:
      "CAMERA_STAMP_PHOTO",

    tipo:
      tipo,

    fileName:
      nombre,

    mimeType:
      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null

  };


  /*
  ================================================
   ENVIAR AL FORMULARIO
  ================================================
  */

  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(
      mensaje,
      "*"
    );

  }


  /*
  ================================================
   MENSAJE
  ================================================
  */

  status.textContent =
    "✅ FOTO CAPTURADA.\n\n" +
    "Regresando al formulario...";


  /*
  ================================================
   CERRAR
  ================================================
  */

  detenerCamara();


  setTimeout(
    function(){

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.focus();

        window.close();

      }
      else{

        status.textContent =
          "✅ FOTO CAPTURADA.\n\n" +
          "Puedes regresar manualmente al formulario.";

      }

    },
    500
  );

}


/*
====================================================
 GPS
====================================================
*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        console.warn(
          "GPS NO DISPONIBLE"
        );

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          const resultado = {

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          };


          console.log(
            "GPS OBTENIDO:",
            resultado
          );


          resolve(
            resultado
          );

        },


        function(error){

          console.warn(
            "NO SE PUDO OBTENER GPS:",
            error
          );


          resolve(null);

        },


        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            0

        }

      );

    }
  );

}


/*
====================================================
 NOMBRE TIPO FOTO
====================================================
*/

function obtenerNombreTipoFoto(tipo){

  if(tipo === "poste")
    return "POSTE";


  if(tipo === "mega")
    return "CAJAS MEGA";


  if(tipo === "medidores")
    return "MEDIDORES";


  if(tipo === "carriers")
    return "CAJAS CARRIERS";


  return String(
    tipo || ""
  ).toUpperCase();

}


/*
====================================================
 NOMBRE FOTO
====================================================
*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)
      .replace(/\s+/g,"_") +

    "_" +

    formatFileDate(fecha) +

    ".jpg"

  );

}


/*
====================================================
 FECHA ARCHIVO
====================================================
*/

function formatFileDate(date){

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const hour =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minute =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const second =
    String(
      date.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day +
    "_" +
    hour +
    minute +
    second

  );

}

/*
====================================================
 DETENER CÁMARA
====================================================
*/

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}
