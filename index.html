<script>


/*
====================================================
 DATOS RECIBIDOS
====================================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );


const tipo =
  params.get("tipo") || "poste";


const proyecto =
  params.get("proyecto") || "";


const tipoProyecto =
  params.get("tipoProyecto") || "";


const hub =
  params.get("hub") || "";


const rama =
  params.get("rama") || "";


/*
====================================================
 ELEMENTOS
====================================================
*/

const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const preview =
  document.getElementById("preview");


const startButton =
  document.getElementById("startButton");


const signalButton =
  document.getElementById("signalButton");


const takeButton =
  document.getElementById("takeButton");


const confirmButton =
  document.getElementById("confirmButton");


const cancelSignalButton =
  document.getElementById(
    "cancelSignalButton"
  );


const cancelButton =
  document.getElementById("cancelButton");


const status =
  document.getElementById("status");


const arrowEditor =
  document.getElementById(
    "arrowEditor"
  );


const arrowCanvas =
  document.getElementById(
    "arrowCanvas"
  );


const arrowHelp =
  document.getElementById(
    "arrowHelp"
  );


/*
====================================================
 VARIABLES
====================================================
*/

let stream = null;


/*
====================================================
 MODO SEÑALAR
====================================================
*/

let modoSenalar =
  false;

let colocandoFlecha =
  false;


/*
====================================================
 DATOS DE LA FLECHA
====================================================
*/

let flechaX = null;

let flechaY = null;

let flechaAngulo = 0;

let flechaEscala = 1;


/*
====================================================
 FOTO BASE
====================================================
*/

let fotoBase = null;


/*
====================================================
 GPS
====================================================
*/

let gpsActual = null;


/*
====================================================
 TOUCH
====================================================
*/

let toquesActivos = [];

let ultimoToque = 0;

let gestoActivo = false;

let gestoInicialDistancia = 0;

let gestoInicialAngulo = 0;

let gestoInicialEscala = 1;

let gestoInicialFlechaX = 0;

let gestoInicialFlechaY = 0;

let gestoInicialAnguloFlecha = 0;


/*
====================================================
 CONFIGURACIÓN FLECHA
====================================================
*/

const FLECHA_LONGITUD_BASE =
  150;

const FLECHA_PUNTA_BASE =
  32;

const FLECHA_GROSOR_BASE =
  9;


/*
====================================================
 INICIAR CÁMARA
====================================================
*/

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara."
      );

    }


    detenerCamara();


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.disabled =
      false;


    status.textContent =
      "Cámara lista.";

  }

  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    status.textContent =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n" +
      error.name +
      "\n" +
      error.message;


    startButton.style.display =
      "block";


    takeButton.disabled =
      true;

  }

}


/*
====================================================
 BOTÓN SEÑALAR
====================================================
*/

signalButton.addEventListener(
  "click",
  activarSenalar
);


function activarSenalar(){

  modoSenalar =
    !modoSenalar;


  if(modoSenalar){

    signalButton.classList.add(
      "active"
    );


    signalButton.textContent =
      "🎯 ACTIVO";


    status.textContent =
      "Señalar activado.\n\n" +
      "Toma la fotografía.";

  }
  else{

    desactivarSenalar();

  }

}


/*
====================================================
 DESACTIVAR SEÑALAR
====================================================
*/

function desactivarSenalar(){

  modoSenalar =
    false;


  signalButton.classList.remove(
    "active"
  );


  signalButton.textContent =
    "🎯 SEÑALAR";

}


/*
====================================================
 TOMAR FOTO
====================================================
*/

takeButton.addEventListener(
  "click",
  tomarFoto
);


async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(
        "La cámara no está iniciada."
      );

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    /*
    ================================================
     GPS
    ================================================
    */

    status.textContent =
      "Obteniendo ubicación GPS...";


    const posicion =
      await obtenerGPS();


    gpsActual =
      posicion;


    /*
    ================================================
     CANVAS
    ================================================
    */

    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
    ================================================
     FECHA Y HORA
    ================================================
    */

    const ahora =
      new Date();


    const fecha =
      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =
      ahora.toLocaleTimeString(
        "es-MX"
      );


    /*
    ================================================
     ESCALA
    ================================================
    */

    const escala =
      Math.max(
        width,
        height
      ) / 1200;


    const padding =
      Math.round(
        16 * escala
      );


    const font =
      Math.max(
        16,
        Math.round(
          20 * escala
        )
      );


    const altoLinea =
      Math.round(
        27 * escala
      );


    /*
    ================================================
     ESTAMPADO
    ================================================
    */

    const lineas = [

      "PROYECTO: " +
        (
          proyecto ||
          "SIN PROYECTO"
        ),

      "TIPO PROYECTO: " +
        (
          tipoProyecto ||
          "SIN TIPO"
        ),

      "TIPO FOTO: " +
        obtenerNombreTipoFoto(tipo),

      fecha +
        "  " +
        hora,

      posicion

        ? "LAT: " +
          Number(
            posicion.lat
          ).toFixed(6) +
          "  LON: " +
          Number(
            posicion.lng
          ).toFixed(6)

        : "GPS: SIN UBICACIÓN"

    ];


    /*
    ================================================
     MEDIR CAJA
    ================================================
    */

    ctx.font =
      "bold " +
      font +
      "px Arial";


    let anchoTexto = 0;


    lineas.forEach(
      function(texto){

        const medida =
          ctx.measureText(
            texto
          ).width;


        if(
          medida >
          anchoTexto
        ){

          anchoTexto =
            medida;

        }

      }
    );


    const anchoCaja =
      anchoTexto +
      padding * 2;


    const altoCaja =
      lineas.length *
      altoLinea +
      padding * 2;


    const x =
      padding;


    const y =
      height -
      altoCaja -
      padding;


    /*
    ================================================
     CAJA
    ================================================
    */

    ctx.fillStyle =
      "rgba(0,0,0,.42)";


    ctx.beginPath();


    ctx.roundRect(
      x,
      y,
      anchoCaja,
      altoCaja,
      Math.round(10 * escala)
    );


    ctx.fill();


    /*
    ================================================
     TEXTO
    ================================================
    */

    ctx.fillStyle =
      "rgba(255,255,255,.95)";


    ctx.font =
      "bold " +
      font +
      "px Arial";


    ctx.textBaseline =
      "top";


    lineas.forEach(
      function(texto,index){

        ctx.fillText(

          texto,

          x + padding,

          y +
          padding +
          index *
          altoLinea

        );

      }
    );


    /*
    ================================================
     GUARDAR FOTO BASE
    ================================================
    */

    fotoBase =
      canvas.toDataURL(
        "image/jpeg",
        .90
      );


    /*
    ================================================
     FOTO NORMAL
    ================================================
    */

    if(!modoSenalar){

      enviarFotoFinal(
        fotoBase,
        ahora,
        posicion
      );

      return;

    }


    /*
    ================================================
     ABRIR VISOR
    ================================================
    */

    abrirVisorFlecha();

  }

  catch(error){

    console.error(
      "ERROR TOMANDO FOTO:",
      error
    );


    status.textContent =
      "ERROR AL TOMAR FOTO:\n\n" +
      error.message;

  }

}


/*
====================================================
 ABRIR VISOR
====================================================
*/

function abrirVisorFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      arrowCanvas.width =
        imagen.width;


      arrowCanvas.height =
        imagen.height;


      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      arrowEditor.style.display =
        "block";


      video.style.display =
        "none";


      signalButton.style.display =
        "none";


      takeButton.style.display =
        "none";


      confirmButton.style.display =
        "block";


      cancelSignalButton.style.display =
        "block";


      cancelButton.style.display =
        "none";


      arrowHelp.style.display =
        "block";


      colocandoFlecha =
        true;


      /*
      ==============================================
       VALORES INICIALES
      ==============================================
      */

      flechaX =
        arrowCanvas.width * .55;


      flechaY =
        arrowCanvas.height * .40;


      flechaAngulo =
        0;


      flechaEscala =
        1;


      /*
      ==============================================
       SI LA POSICIÓN INICIAL ESTÁ SOBRE
       EL ESTAMPADO, BUSCAR UNA AUTOMÁTICA
      ==============================================
      */

      if(
        flechaInvadeEstampado(
          flechaX,
          flechaY
        )
      ){

        flechaX =
          arrowCanvas.width * .55;


        flechaY =
          arrowCanvas.height * .25;

      }


      dibujarFlecha();


      status.textContent =
        "🟢 Mueve la flecha con un dedo.\n" +
        "🔄 Usa dos dedos para girar y cambiar tamaño.";

    };


  imagen.src =
    fotoBase;

}


/*
====================================================
 CONVERTIR EVENTO A COORDENADAS
====================================================
*/

function obtenerPuntoEvento(
  event
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        event.clientY -
        rect.top
      ) *
      escalaY

  };

}


/*
====================================================
 CLICK / TOQUE PARA COLOCAR
====================================================
*/

arrowCanvas.addEventListener(
  "click",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    if(
      Date.now() -
      ultimoToque <
      500
    ){

      return;

    }


    const punto =
      obtenerPuntoEvento(
        event
      );


    if(
      flechaInvadeEstampado(
        punto.x,
        punto.y
      )
    ){

      alert(
        "⚠️ LA FLECHA NO PUEDE TOCAR EL ESTAMPADO.\n\n" +
        "Selecciona una ubicación más alejada."
      );

      return;

    }


    flechaX =
      punto.x;


    flechaY =
      punto.y;


    flechaAngulo =
      0;


    flechaEscala =
      1;


    dibujarFlecha();

  }
);


/*
====================================================
 COMPROBAR TODA LA FLECHA CONTRA ESTAMPADO
====================================================
*/

function flechaInvadeEstampado(
  xFinal,
  yFinal
){

  const width =
    arrowCanvas.width;


  const height =
    arrowCanvas.height;


  const escala =
    Math.max(
      width,
      height
    ) / 1200;


  /*
  ================================================
   DIMENSIONES DEL ESTAMPADO
  ================================================
  */

  const padding =
    Math.round(
      16 * escala
    );


  const font =
    Math.max(
      16,
      Math.round(
        20 * escala
      )
    );


  const altoLinea =
    Math.round(
      27 * escala
    );


  const lineas = [

    "PROYECTO: " +
      (
        proyecto ||
        "SIN PROYECTO"
      ),

    "TIPO PROYECTO: " +
      (
        tipoProyecto ||
        "SIN TIPO"
      ),

    "TIPO FOTO: " +
      obtenerNombreTipoFoto(tipo),

    "FECHA / HORA",

    "LAT / LON"

  ];


  const ctx =
    arrowCanvas.getContext(
      "2d"
    );


  ctx.font =
    "bold " +
    font +
    "px Arial";


  let anchoTexto =
    0;


  lineas.forEach(
    function(texto){

      const medida =
        ctx.measureText(
          texto
        ).width;


      if(
        medida >
        anchoTexto
      ){

        anchoTexto =
          medida;

      }

    }
  );


  const anchoCaja =
    anchoTexto +
    padding * 2;


  const altoCaja =
    lineas.length *
    altoLinea +
    padding * 2;


  const cajaX =
    padding;


  const cajaY =
    height -
    altoCaja -
    padding;


  /*
  ================================================
   MARGEN DE SEGURIDAD
  ================================================
  */

  const margen =
    35 * escala;


  const rectX1 =
    cajaX -
    margen;


  const rectY1 =
    cajaY -
    margen;


  const rectX2 =
    cajaX +
    anchoCaja +
    margen;


  const rectY2 =
    cajaY +
    altoCaja +
    margen;


  /*
  ================================================
   OBTENER GEOMETRÍA REAL DE LA FLECHA
  ================================================
  */

  const longitud =
    FLECHA_LONGITUD_BASE *
    escala *
    flechaEscala;


  const punta =
    FLECHA_PUNTA_BASE *
    escala *
    flechaEscala;


  const grosor =
    Math.max(
      8 * escala,
      FLECHA_GROSOR_BASE *
      escala *
      flechaEscala
    );


  /*
  ================================================
   EL INICIO SE CALCULA CON EL ÁNGULO ACTUAL
  ================================================
  */

  const inicioX =
    xFinal -
    longitud *
    Math.cos(
      flechaAngulo
    );


  const inicioY =
    yFinal -
    longitud *
    Math.sin(
      flechaAngulo
    );


  /*
  ================================================
   PUNTOS IMPORTANTES DE LA FLECHA
  ================================================
  */

  const puntos = [];


  puntos.push({
    x: inicioX,
    y: inicioY
  });


  puntos.push({
    x: xFinal,
    y: yFinal
  });


  /*
  ================================================
   CABEZA DE LA FLECHA
  ================================================
  */

  const cabeza1X =
    xFinal -
    punta *
    Math.cos(
      flechaAngulo -
      Math.PI / 6
    );


  const cabeza1Y =
    yFinal -
    punta *
    Math.sin(
      flechaAngulo -
      Math.PI / 6
    );


  const cabeza2X =
    xFinal -
    punta *
    Math.cos(
      flechaAngulo +
      Math.PI / 6
    );


  const cabeza2Y =
    yFinal -
    punta *
    Math.sin(
      flechaAngulo +
      Math.PI / 6
    );


  puntos.push({
    x: cabeza1X,
    y: cabeza1Y
  });


  puntos.push({
    x: cabeza2X,
    y: cabeza2Y
  });


  /*
  ================================================
   CAJA DE TODA LA FLECHA
  ================================================
  */

  let minX = Infinity;

  let minY = Infinity;

  let maxX = -Infinity;

  let maxY = -Infinity;


  puntos.forEach(
    function(p){

      minX =
        Math.min(
          minX,
          p.x
        );


      maxX =
        Math.max(
          maxX,
          p.x
        );


      minY =
        Math.min(
          minY,
          p.y
        );


      maxY =
        Math.max(
          maxY,
          p.y
        );

    }
  );


  minX -= grosor;

  maxX += grosor;

  minY -= grosor;

  maxY += grosor;


  /*
  ================================================
   INTERSECCIÓN
  ================================================
  */

  return !(
    maxX < rectX1 ||
    minX > rectX2 ||
    maxY < rectY1 ||
    minY > rectY2
  );

}


/*
====================================================
 DIBUJAR FLECHA
====================================================
*/

function dibujarFlecha(){

  if(
    flechaX === null ||
    flechaY === null ||
    !fotoBase
  ){

    return;

  }


  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      const escala =
        Math.max(
          arrowCanvas.width,
          arrowCanvas.height
        ) / 1200;


      /*
      ==============================================
       MEDIDAS
      ==============================================
      */

      const longitud =
        FLECHA_LONGITUD_BASE *
        escala *
        flechaEscala;


      const punta =
        FLECHA_PUNTA_BASE *
        escala *
        flechaEscala;


      const grosor =
        Math.max(
          8,
          FLECHA_GROSOR_BASE *
          escala *
          flechaEscala
        );


      /*
      ==============================================
       INICIO
      ==============================================
      */

      const inicioX =
        flechaX -
        longitud *
        Math.cos(
          flechaAngulo
        );


      const inicioY =
        flechaY -
        longitud *
        Math.sin(
          flechaAngulo
        );


      /*
      ==============================================
       BORDE BLANCO
      ==============================================
      */

      ctx.beginPath();

      ctx.moveTo(
        inicioX,
        inicioY
      );

      ctx.lineTo(
        flechaX,
        flechaY
      );

      ctx.strokeStyle =
        "rgba(255,255,255,.85)";

      ctx.lineWidth =
        grosor + 5 * escala;

      ctx.lineCap =
        "round";

      ctx.stroke();


      /*
      ==============================================
       FLECHA VERDE
      ==============================================
      */

      ctx.beginPath();

      ctx.moveTo(
        inicioX,
        inicioY
      );

      ctx.lineTo(
        flechaX,
        flechaY
      );

      ctx.strokeStyle =
        "#00ff44";

      ctx.lineWidth =
        grosor;

      ctx.lineCap =
        "round";

      ctx.stroke();


      /*
      ==============================================
       CABEZA
      ==============================================
      */

      const cabeza1X =
        flechaX -
        punta *
        Math.cos(
          flechaAngulo -
          Math.PI / 6
        );


      const cabeza1Y =
        flechaY -
        punta *
        Math.sin(
          flechaAngulo -
          Math.PI / 6
        );


      const cabeza2X =
        flechaX -
        punta *
        Math.cos(
          flechaAngulo +
          Math.PI / 6
        );


      const cabeza2Y =
        flechaY -
        punta *
        Math.sin(
          flechaAngulo +
          Math.PI / 6
        );


      ctx.beginPath();

      ctx.moveTo(
        flechaX,
        flechaY
      );

      ctx.lineTo(
        cabeza1X,
        cabeza1Y
      );

      ctx.lineTo(
        cabeza2X,
        cabeza2Y
      );

      ctx.closePath();


      ctx.fillStyle =
        "#00ff44";

      ctx.fill();


      ctx.strokeStyle =
        "#ffffff";

      ctx.lineWidth =
        Math.max(
          2,
          3 * escala
        );

      ctx.stroke();


      /*
      ==============================================
       CENTRO
      ==============================================
      */

      ctx.beginPath();

      ctx.arc(

        flechaX,

        flechaY,

        8 * escala *
        flechaEscala,

        0,

        Math.PI * 2

      );


      ctx.fillStyle =
        "#00ff44";

      ctx.fill();


      ctx.strokeStyle =
        "#000000";

      ctx.lineWidth =
        3 * escala;

      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}


/*
====================================================
 TOUCHSTART
====================================================
*/

arrowCanvas.addEventListener(
  "touchstart",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    event.preventDefault();


    ultimoToque =
      Date.now();


    toquesActivos =
      Array.from(
        event.touches
      );


    /*
    ================================================
     UN DEDO
    ================================================
    */

    if(
      toquesActivos.length === 1
    ){

      const punto =
        obtenerPuntoTouch(
          toquesActivos[0]
        );


      /*
      ----------------------------------------------
       SI NO HAY FLECHA, COLOCARLA
      ----------------------------------------------
      */

      if(
        flechaX === null ||
        flechaY === null
      ){

        if(
          flechaInvadeEstampado(
            punto.x,
            punto.y
          )
        ){

          alert(
            "⚠️ La flecha no puede tocar el estampado."
          );

          return;

        }


        flechaX =
          punto.x;

        flechaY =
          punto.y;

        flechaAngulo =
          0;

        flechaEscala =
          1;

        dibujarFlecha();

      }


      gestoActivo =
        true;

      gestoInicialFlechaX =
        flechaX;

      gestoInicialFlechaY =
        flechaY;

      gestoInicialAnguloFlecha =
        flechaAngulo;

    }


    /*
    ================================================
     DOS DEDOS
    ================================================
    */

    if(
      toquesActivos.length === 2
    ){

      gestoActivo =
        true;


      const p1 =
        obtenerPuntoTouch(
          toquesActivos[0]
        );


      const p2 =
        obtenerPuntoTouch(
          toquesActivos[1]
        );


      gestoInicialDistancia =
        distanciaPuntos(
          p1,
          p2
        );


      gestoInicialAngulo =
        Math.atan2(
          p2.y - p1.y,
          p2.x - p1.x
        );


      gestoInicialEscala =
        flechaEscala;


      gestoInicialAnguloFlecha =
        flechaAngulo;


      gestoInicialFlechaX =
        flechaX;


      gestoInicialFlechaY =
        flechaY;

    }

  },
  {
    passive:false
  }
);


/*
====================================================
 TOUCHMOVE
====================================================
*/

arrowCanvas.addEventListener(
  "touchmove",
  function(event){

    if(
      !colocandoFlecha ||
      !gestoActivo
    ){

      return;

    }


    event.preventDefault();


    const touches =
      Array.from(
        event.touches
      );


    /*
    ================================================
     UN DEDO = MOVER
    ================================================
    */

    if(
      touches.length === 1
    ){

      const actual =
        obtenerPuntoTouch(
          touches[0]
        );


      const inicial =
        toquesActivos[0]
          ? obtenerPuntoTouch(
              toquesActivos[0]
            )
          : actual;


      const dx =
        actual.x -
        inicial.x;


      const dy =
        actual.y -
        inicial.y;


      const nuevoX =
        gestoInicialFlechaX +
        dx;


      const nuevoY =
        gestoInicialFlechaY +
        dy;


      if(
        !flechaInvadeEstampado(
          nuevoX,
          nuevoY
        )
      ){

        flechaX =
          nuevoX;

        flechaY =
          nuevoY;

        dibujarFlecha();

      }

    }


    /*
    ================================================
     DOS DEDOS = GIRAR + TAMAÑO
    ================================================
    */

    if(
      touches.length === 2
    ){

      const p1 =
        obtenerPuntoTouch(
          touches[0]
        );


      const p2 =
        obtenerPuntoTouch(
          touches[1]
        );


      const distancia =
        distanciaPuntos(
          p1,
          p2
        );


      const angulo =
        Math.atan2(
          p2.y - p1.y,
          p2.x - p1.x
        );


      /*
      ----------------------------------------------
       CAMBIO DE TAMAÑO
      ----------------------------------------------
      */

      let nuevaEscala =
        gestoInicialEscala *
        (
          distancia /
          gestoInicialDistancia
        );


      nuevaEscala =
        Math.max(
          .45,
          Math.min(
            2.5,
            nuevaEscala
          )
        );


      /*
      ----------------------------------------------
       CAMBIO DE GIRO
      ----------------------------------------------
      */

      let nuevoAngulo =
        gestoInicialAnguloFlecha +
        (
          angulo -
          gestoInicialAngulo
        );


      /*
      ----------------------------------------------
       CENTRO DE GESTO
      ----------------------------------------------
      */

      const centroX =
        (
          p1.x +
          p2.x
        ) / 2;


      const centroY =
        (
          p1.y +
          p2.y
        ) / 2;


      /*
      ----------------------------------------------
       COMPROBAR POSICIÓN
      ----------------------------------------------
      */

      const oldX =
        flechaX;

      const oldY =
        flechaY;

      const oldEscala =
        flechaEscala;

      const oldAngulo =
        flechaAngulo;


      /*
      ----------------------------------------------
       Aplicar temporalmente
      ----------------------------------------------
      */

      flechaEscala =
        nuevaEscala;

      flechaAngulo =
        nuevoAngulo;


      /*
      ----------------------------------------------
       COMPROBAR ESTAMPADO
      ----------------------------------------------
      */

      if(
        !flechaInvadeEstampado(
          flechaX,
          flechaY
        )
      ){

        dibujarFlecha();

      }
      else{

        flechaEscala =
          oldEscala;

        flechaAngulo =
          oldAngulo;

        flechaX =
          oldX;

        flechaY =
          oldY;

        dibujarFlecha();

      }


      /*
      ----------------------------------------------
       ACTUALIZAR TOQUES
      ----------------------------------------------
      */

      toquesActivos =
        touches;

    }

  },
  {
    passive:false
  }
);


/*
====================================================
 TOUCHEND
====================================================
*/

arrowCanvas.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();


    toquesActivos =
      Array.from(
        event.touches
      );


    if(
      toquesActivos.length === 0
    ){

      gestoActivo =
        false;

    }

  },

  }
);


/*
====================================================
 TOUCHCANCEL
====================================================
*/

arrowCanvas.addEventListener(
  "touchcancel",
  function(){

    gestoActivo =
      false;

    toquesActivos =
      [];

  }
);


/*
====================================================
 OBTENER PUNTO TOUCH
====================================================
*/

function obtenerPuntoTouch(
  touch
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        touch.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        touch.clientY -
        rect.top
      ) *
      escalaY

  };

}


/*
====================================================
 DISTANCIA
====================================================
*/

function distanciaPuntos(
  p1,
  p2
){

  return Math.sqrt(

    Math.pow(
      p2.x -
      p1.x,
      2
    ) +

    Math.pow(
      p2.y -
      p1.y,
      2
    )

  );

}

/*
====================================================
 ENVIAR FOTO FINAL
====================================================
*/

function enviarFotoFinal(
  dataURL,
  ahora,
  posicion
){

  preview.src =
    dataURL;


  preview.style.display =
    "block";


  const nombre =
    crearNombreFoto(
      tipo,
      ahora
    );


  const mensaje = {

    type:
      "CAMERA_STAMP_PHOTO",

    tipo:
      tipo,

    fileName:
      nombre,

    mimeType:
      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null

  };


  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(
      mensaje,
      "*"
    );

  }


  status.textContent =
    "FOTO CAPTURADA.\n\n" +
    "Regresando al formulario...";


  detenerCamara();


  setTimeout(
    function(){

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.focus();

        window.close();

      }

    },
    500
  );

}


/*
====================================================
 GPS
====================================================
*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          resolve({

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          });

        },

        function(){

          resolve(null);

        },

        {

          enableHighAccuracy:true,

          timeout:10000,

          maximumAge:0

        }

      );

    }
  );

}


/*
====================================================
 NOMBRE TIPO FOTO
====================================================
*/

function obtenerNombreTipoFoto(
  tipo
){

  if(
    tipo === "poste"
  )
    return "POSTE";


  if(
    tipo === "mega"
  )
    return "CAJAS MEGA";


  if(
    tipo === "medidores"
  )
    return "MEDIDORES";


  if(
    tipo === "carriers"
  )
    return "CAJAS CARRIERS";


  return String(
    tipo || ""
  ).toUpperCase();

}


/*
====================================================
 NOMBRE FOTO
====================================================
*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(
      tipo
    )
    .replace(
      /\s+/g,
      "_"
    ) +

    "_" +

    formatFileDate(
      fecha
    ) +

    ".jpg"

  );

}


/*
====================================================
 FECHA ARCHIVO
====================================================
*/

function formatFileDate(
  date
){

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const hour =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minute =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const second =
    String(
      date.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day +
    "_" +
    hour +
    minute +
    second

  );

}

====================================================

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}
