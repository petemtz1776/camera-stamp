/*
====================================================
 CARGAR LOGO
====================================================
*/

function cargarLogo(){

  return new Promise(
    function(resolve){

      const img =
        new Image();

      img.crossOrigin =
        "anonymous";

      img.onload =
        function(){

          logoImagen =
            img;

          logoCargado =
            true;

          console.log(
            "LOGO CARGADO CORRECTAMENTE"
          );

          resolve(
            img
          );

        };

      img.onerror =
        function(error){

          console.warn(
            "NO SE PUDO CARGAR EL LOGO:",
            error
          );

          logoImagen =
            null;

          logoCargado =
            false;

          resolve(
            null
          );

        };

      img.src =
        LOGO_URL;

    }
  );

}


/*
====================================================
 ESTAMPAR LOGO
====================================================
*/

function estamparLogo(
  ctx,
  width,
  height
){

  if(
    !logoCargado ||
    !logoImagen
  ){

    console.warn(
      "LOGO NO DISPONIBLE"
    );

    return null;

  }


  /*
  ================================================
   TAMAÑO DEL LOGO
  ================================================
  */

  const anchoMaximo =
    Math.min(
      width * 0.22,
      240
    );


  const relacion =
    logoImagen.height /
    logoImagen.width;


  const logoWidth =
    anchoMaximo;


  const logoHeight =
    logoWidth *
    relacion;


  /*
  ================================================
   MARGEN
  ================================================
  */

  const margen =
    Math.max(
      20,
      width / 100
    );


  /*
  ================================================
   POSICIÓN SUPERIOR DERECHA
  ================================================
  */

  const x =
    width -
    logoWidth -
    margen;


  const y =
    margen;


  /*
  ================================================
   GUARDAR INFORMACIÓN
  ================================================
  */

  const datosLogo = {

    x:x,

    y:y,

    width:logoWidth,

    height:logoHeight

  };


  /*
  ================================================
   FONDO SUAVE
  ================================================
  */

  ctx.save();


  ctx.globalAlpha =
    0.95;


  /*
  ================================================
   DIBUJAR LOGO
  ================================================
  */

  ctx.drawImage(

    logoImagen,

    x,

    y,

    logoWidth,

    logoHeight

  );


  ctx.restore();


  return datosLogo;

}


/*
====================================================
 INICIAR CÁMARA
====================================================
*/

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara.YM"
      );

    }


    detenerCamara();


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal:1920
          },

          height: {
            ideal:1080
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.disabled =
      false;


    status.textContent =
      "Cámara lista.";


  }
  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    status.textContent =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n" +
      error.message;


    startButton.style.display =
      "block";


    takeButton.disabled =
      true;

  }

}

    if(

    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    /*
    ================================================
     GPS
    ================================================
    */

    const posicion =
      await obtenerGPS();


    gpsActual =
      posicion;


    /*
    ================================================
     CANVAS
    ================================================
    */

    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        "2d"
      );


    /*
    ================================================
     FOTO
    ================================================
    */

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    /*
    ================================================
     FECHA
    ================================================
    */

    const ahora =

    const fecha =
      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =
      ahora.toLocaleTimeString(

      );


    /*
    ================================================

    ================================================
    */

    const escala =
      Math.max(
        width,

      ) / 1200;


    const padding =
      Math.round(

      );


    const font =
      Math.max(
        16,
        Math.round(

        )
      );


    const altoLinea =

      );


    const lineas = [

      "PROYECTO: " +
        (
          proyecto ||

        ),

      "TIPO PROYECTO: " +
        (

        ),

      posicion

        ? "LAT: " +
          Number(

    let anchoTexto =

    lineas.forEach(

    */

    estamparLogo(

/*

        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height

      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      arrowEditor.style.display =
        "block";


      video.style.display =
        "none";


      signalButton.style.display =
        "none";


      takeButton.style.display =
        "none";


      confirmButton.style.display =
        "block";


      cancelSignalButton.style.display =
        "block";


      cancelButton.style.display =
        "none";


      colocandoFlecha =
        true;


      status.textContent =
        "🎯 TOCA LA IMAGEN PARA COLOCAR LA FLECHA.PP";

    };


  imagen.src =
    fotoBase;

}


/*
====================================================
 OBTENER PUNTO
====================================================
*/

function obtenerPuntoEvento(
  event
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        event.clientY -
        rect.top
      ) *
      escalaY

  };

}


/*
====================================================
 CLICK PARA COLOCAR
====================================================
*/

arrowCanvas.addEventListener(
  "click",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    const punto =
      obtenerPuntoEvento(
        event
      );


    if(
      puntoEstaEnZonaProhibida(
        punto.x,
        punto.y
      )
    ){

      alert(
        "La flecha no puede colocarse sobre el logo ni sobre el estampado.NSP"
      );

      return;

    }


    flechaX =
      punto.x;


    flechaY =
      punto.y;


    flechaAngulo =
      0;


    flechaEscala =
      1;


    dibujarFlecha();

  }
);


/*
====================================================
 ZONA PROHIBIDA
 LOGO + ESTAMPADO
====================================================
*/

function puntoEstaEnZonaProhibida(
  x,
  y
){

  const width =
    arrowCanvas.width;


  const height =
    arrowCanvas.height;


  const escala =
    Math.max(
      width,
      height
    ) / 1200;


  /*
  ================================================
   ESTAMPADO
  ================================================
  */

  const padding =
    Math.round(
      16 * escala
    );


  const font =
    Math.max(
      16,
      Math.round(
        20 * escala
      )
    );


  const altoLinea =
    Math.round(
      27 * escala
    );


  const lineas = [

    "PROYECTO",

    "TIPO PROYECTO",

    "TIPO FOTO",

    "FECHA",

    "LAT / LON"

  ];


  const ctx =
    arrowCanvas.getContext(
      "2d"
    );


  ctx.font =
    "bold " +
    font +
    "px Arial";


  let anchoTexto =
    0;


  lineas.forEach(
    function(texto){

      anchoTexto =
        Math.max(

          anchoTexto,

          ctx.measureText(
            texto
          ).width

        );

    }
  );


  const anchoCaja =
    anchoTexto +
    padding * 2;


  const altoCaja =
    lineas.length *
    altoLinea +
    padding * 2;


  const margen =
    35 * escala;


  const cajaX =
    padding -
    margen;


  const cajaY =
    height -
    altoCaja -
    padding -
    margen;


  if(

    x >= cajaX &&

    x <=
      cajaX +
      anchoCaja +
      margen * 2 &&

    y >= cajaY &&

    y <=
      cajaY +
      altoCaja +
      margen * 2

  ){

    return true;

  }


  /*
  ================================================
   LOGO
  ================================================
  */

  if(
    logoCargado &&
    logoImagen
  ){

    const anchoMaximo =
      Math.min(
        width * .22,
        240
      );


    const relacion =
      logoImagen.height /
      logoImagen.width;


    const logoWidth =
      anchoMaximo;


    const logoHeight =
      logoWidth *
      relacion;


    const margenLogo =
      Math.max(
        20,
        width / 100
      );


    const logoX =
      width -
      logoWidth -
      margenLogo;


    const logoY =
      margenLogo;


    const margenExtra =
      25 * escala;


    if(

      x >=
        logoX -
        margenExtra &&

      x <=
        logoX +
        logoWidth +
        margenExtra &&

      y >=
        logoY -
        margenExtra &&

      y <=
        logoY +
        logoHeight +
        margenExtra

    ){

      return true;

    }

  }


  return false;

}


/*
====================================================
 DIBUJAR FLECHA
====================================================
*/

function dibujarFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(

        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height

      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      if(
        flechaX === null ||
        flechaY === null
      ){

        return;

      }


      const escalaBase =
        Math.max(
          arrowCanvas.width,
          arrowCanvas.height
        ) / 1200;


      const longitud =
        150 *
        escalaBase *
        flechaEscala;


      const punta =
        32 *
        escalaBase *
        flechaEscala;


      /*
      ==============================================
       DIRECCIÓN
      ==============================================
      */

      const inicioX =
        flechaX -
        longitud *
        Math.cos(
          flechaAngulo
        );


      const inicioY =
        flechaY -
        longitud *
        Math.sin(
          flechaAngulo
        );


      /*
      ==============================================
       BORDE
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#ffffff";


      ctx.lineWidth =
        Math.max(
          12,
          13 *
          escalaBase *
          flechaEscala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      /*
      ==============================================
       FLECHA VERDE
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#00ff44";


      ctx.lineWidth =
        Math.max(
          8,
          9 *
          escalaBase *
          flechaEscala
        );


      ctx.stroke();


      /*
      ==============================================
       CABEZA
      ==============================================
      */

      ctx.beginPath();


      ctx.moveTo(
        flechaX,
        flechaY
      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          flechaAngulo -
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          flechaAngulo -
          Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          flechaAngulo +
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          flechaAngulo +
          Math.PI / 6
        )

      );


      ctx.closePath();


      ctx.fillStyle =
        "#00ff44";


      ctx.fill();


      ctx.strokeStyle =
        "#ffffff";


      ctx.lineWidth =
        Math.max(
          2,
          3 *
          escalaBase
        );


      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}

      "block";


    confirmButton.style.display =
      "none";


    cancelSignalButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.style.display =
      "block";


    cancelButton.style.display =
      "block";


    desactivarSenalar();


  }
);


/*
====================================================
 CONFIRMAR
====================================================
*/

confirmButton.addEventListener(
  "click",
  function(){

    if(
      flechaX === null ||
      flechaY === null
    ){

      alert(
        "Primero coloca la flecha."
      );

      return;

    }


    const dataURL =
      arrowCanvas.toDataURL(
        "image/jpeg",
        .90
      );


    enviarFotoFinal(

      dataURL,

      new Date(),

      gpsActual

    );

  }
);


/*
====================================================
 ENVIAR FOTO
====================================================
*/

function enviarFotoFinal(
  dataURL,
  ahora,
  posicion
){

  preview.src =
    dataURL;


  preview.style.display =
    "block";


  const nombre =
    crearNombreFoto(
      tipo,
      ahora
    );


  const mensaje = {

    type:
      "CAMERA_STAMP_PHOTO",

    tipo:
      tipo,

    fileName:
      nombre,

    mimeType:
      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null

  };


  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(
      mensaje,
      "*"
    );

  }


  detenerCamara();


  setTimeout(
    function(){

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.focus();

        window.close();

      }

    },
    500
  );

}


/*
====================================================
 GPS
====================================================
*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          resolve({

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          });

        },

        function(){

          resolve(null);

        },

        {

          enableHighAccuracy:true,

          timeout:10000,

          maximumAge:0

        }

      );

    }
  );

}


/*
====================================================
 NOMBRE TIPO FOTO
====================================================
*/

function obtenerNombreTipoFoto(tipo){

  if(tipo === "poste")
    return "POSTE";

  if(tipo === "mega")
    return "CAJAS MEGA";

  if(tipo === "medidores")
    return "MEDIDORES";

  if(tipo === "carriers")
    return "CAJAS CARRIERS";

  return String(
    tipo || ""
  ).toUpperCase();

}


/*
====================================================
 NOMBRE FOTO
====================================================
*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)
      .replace(/\s+/g,"_") +

    "_" +

    formatFileDate(fecha) +

    ".jpg"

  );

}


/*
====================================================
 FECHA ARCHIVO
====================================================
*/

function formatFileDate(date){

  return (

    date.getFullYear() +

    String(
      date.getMonth()+1
    ).padStart(2,"0") +

    String(
      date.getDate()
    ).padStart(2,"0") +

    "_" +

    String(
      date.getHours()
    ).padStart(2,"0") +

    String(
      date.getMinutes()
    ).padStart(2,"0") +

    String(
      date.getSeconds()
    ).padStart(2,"0")

  );

}


/*
====================================================
 CANCELAR
====================================================
*/

cancelButton.addEventListener(
  "click",
  function(){

    detenerCamara();


    if(
      window.opener &&
      !window.opener.closed
    ){

      window.close();

    }

  }
);


/*
====================================================
 DETENER CÁMARA
====================================================
*/

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}

====================================================
 INICIAR AUTOMÁTICAMENTE
====================================================
*/

window.addEventListener(
  "load",
  async function(){

    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    /*

     CARGAR LOGO PRIMERO
    ================================================
    */

    await cargarLogo();


    /*
    ================================================
     INICIAR CÁMARA
    ================================================
    */

    iniciarCamara();

  }
);

</script>
