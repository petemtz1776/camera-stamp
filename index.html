/*====================================================
 OBTENER GPS
====================================================*/

function obtenerUbicacionCamara(){

    cameraLat = null;
    cameraLng = null;
    cameraAccuracy = null;


    if(!navigator.geolocation){

        mostrarEstadoCamara(
            "Este dispositivo no permite obtener ubicación GPS."
        );

        return;

    }


    mostrarEstadoCamara(
        "Obteniendo ubicación GPS..."
    );


    navigator.geolocation.getCurrentPosition(

        function(position){

            cameraLat =
                position.coords.latitude;

            cameraLng =
                position.coords.longitude;

            cameraAccuracy =
                position.coords.accuracy;


            console.log(
                "GPS CAMARA:",
                {
                    lat:cameraLat,
                    lng:cameraLng,
                    accuracy:cameraAccuracy
                }
            );


            actualizarEstadoCompleto();

        },


        function(error){

            console.error(
                "GPS ERROR:",
                error
            );


            cameraLat = null;
            cameraLng = null;
            cameraAccuracy = null;


            let mensaje =
                "No fue posible obtener la ubicación GPS.";


            switch(error.code){

                case 1:

                    mensaje =
                        "Permiso de ubicación rechazado.";

                    break;

                case 2:

                    mensaje =
                        "No se pudo determinar la ubicación.";

                    break;

                case 3:

                    mensaje =
                        "La ubicación tardó demasiado.";

                    break;

            }


            mostrarEstadoCamara(

                mensaje +

                "<br><br>" +

                "No se podrá estampar la fotografía sin coordenadas."

            );


            const boton =
                document.getElementById(
                    "cameraTakeButton"
                );


            if(boton){

                boton.disabled =
                    true;

            }

        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}

/*====================================================
 CONFIGURAR EVENTOS PLOMADO
====================================================*/

function configurarEventosPlomado(){

    const canvas =
        document.getElementById(
            "postePlomadoCanvas"
        );


    if(!canvas){

        return;

    }


    canvas.addEventListener(
        "click",
        seleccionarPuntoPoste
    );


    canvas.addEventListener(
        "touchend",
        function(event){

            if(!posteInspeccionActivo){

                return;

            }


            if(
                !event.changedTouches ||
                !event.changedTouches.length
            ){

                return;

            }


            event.preventDefault();


            const touch =
                event.changedTouches[0];


            const rect =
                canvas.getBoundingClientRect();


            const x =
                (
                    touch.clientX -
                    rect.left
                ) *
                (
                    canvas.width /
                    rect.width
                );


            const y =
                (
                    touch.clientY -
                    rect.top
                ) *
                (
                    canvas.height /
                    rect.height
                );


            seleccionarPuntoPosteXY(
                x,
                y
            );

        },
        {
            passive:false
        }
    );

}


/*====================================================
 SELECCIONAR PUNTO POSTE
====================================================*/

function seleccionarPuntoPoste(event){

    if(!posteInspeccionActivo){

        return;

    }


    const canvas =
        document.getElementById(
            "postePlomadoCanvas"
        );


    if(!canvas){

        return;

    }


    const rect =
        canvas.getBoundingClientRect();


    const x =
        (
            event.clientX -
            rect.left
        ) *
        (
            canvas.width /
            rect.width
        );


    const y =
        (
            event.clientY -
            rect.top
        ) *
        (
            canvas.height /
            rect.height
        );


    seleccionarPuntoPosteXY(
        x,
        y
    );

}


/*====================================================
 PROCESAR PUNTO POSTE
====================================================*/

function seleccionarPuntoPosteXY(
    x,
    y
){

    if(postePuntoBaseX === null){

        postePuntoBaseX =
            x;

        postePuntoBaseY =
            y;


        dibujarGuiaPlomado();


        mostrarEstadoCamara(

            "📍 BASE SELECCIONADA.<br><br>" +

            "Ahora toque la PARTE SUPERIOR del poste."

        );


        return;

    }


    if(postePuntoArribaX === null){

        postePuntoArribaX =
            x;

        postePuntoArribaY =
            y;


        calcularPlomadoPoste();

        dibujarGuiaPlomado();

        return;

    }


    postePuntoBaseX =
        x;

    postePuntoBaseY =
        y;

    postePuntoArribaX =
        null;

    postePuntoArribaY =
        null;

    posteAngulo =
        null;

    posteDesviacion =
        null;


    dibujarGuiaPlomado();


    mostrarEstadoCamara(

        "Nueva BASE seleccionada.<br><br>" +

        "Ahora toque la parte superior."

    );

}


/*====================================================
 DIBUJAR GUÍA PLOMADO
====================================================*/

function dibujarGuiaPlomado(){

    const canvas =
        document.getElementById(
            "postePlomadoCanvas"
        );


    if(!canvas){

        return;

    }


    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const width =
        canvas.width;

    const height =
        canvas.height;


    ctx.beginPath();

    ctx.moveTo(
        width / 2,
        0
    );

    ctx.lineTo(
        width / 2,
        height
    );

    ctx.strokeStyle =
        "rgba(0,255,0,.75)";

    ctx.lineWidth =
        Math.max(
            3,
            width / 400
        );

    ctx.setLineDash([
        15,
        12
    ]);

    ctx.stroke();

    ctx.setLineDash([]);


    if(postePuntoBaseX !== null){

        dibujarPuntoPoste(
            ctx,
            postePuntoBaseX,
            postePuntoBaseY,
            "#00ff00"
        );

    }


    if(postePuntoArribaX !== null){

        dibujarPuntoPoste(
            ctx,
            postePuntoArribaX,
            postePuntoArribaY,
            "#ff0000"
        );

    }


    if(
        postePuntoBaseX !== null &&
        postePuntoArribaX !== null
    ){

        ctx.beginPath();

        ctx.moveTo(
            postePuntoBaseX,
            postePuntoBaseY
        );

        ctx.lineTo(
            postePuntoArribaX,
            postePuntoArribaY
        );

        ctx.strokeStyle =
            "#ff0000";

        ctx.lineWidth =
            Math.max(
                6,
                width / 180
            );

        ctx.stroke();

    }

}


/*====================================================
 DIBUJAR PUNTO
====================================================*/

function dibujarPuntoPoste(
    ctx,
    x,
    y,
    color
){

    const radio =
        Math.max(
            12,
            ctx.canvas.width / 60
        );


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radio,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color;

    ctx.fill();


    ctx.strokeStyle =
        "#000";

    ctx.lineWidth =
        4;

    ctx.stroke();

}


/*====================================================
 CALCULAR PLOMADO
====================================================*/

function calcularPlomadoPoste(){

    if(
        postePuntoBaseX === null ||
        postePuntoBaseY === null ||
        postePuntoArribaX === null ||
        postePuntoArribaY === null
    ){

        return;

    }


    const dx =
        postePuntoArribaX -
        postePuntoBaseX;


    const dy =
        postePuntoBaseY -
        postePuntoArribaY;


    posteAngulo =
        Math.atan2(
            Math.abs(dx),
            Math.abs(dy)
        ) *
        180 /
        Math.PI;


    let direccion =
        "CENTRO";


    if(dx < 0){

        direccion =
            "IZQUIERDA";

    }
    else if(dx > 0){

        direccion =
            "DERECHA";

    }


    posteDesviacion =
        Math.abs(dx);


    let resultado =
        "🟢 EN PLOMO";


    if(
        posteAngulo >
        POSTE_LIMITE_PLOMADO_GRADOS
    ){

        resultado =
            "🔴 FUERA DE PLOMO";

    }


    const overlay =
        document.getElementById(
            "posteMedicionOverlay"
        );


    if(overlay){

        overlay.style.display =
            "block";


        overlay.innerHTML =

            "📐 <strong>PLOMADO</strong><br>" +

            "Ángulo: " +

            posteAngulo.toFixed(2) +

            "°<br>" +

            "Dirección: " +

            direccion +

            "<br>" +

            resultado;

    }


    mostrarEstadoCamara(

        "📐 <strong>RESULTADO DE PLOMADO</strong><br><br>" +

        "Ángulo: " +

        posteAngulo.toFixed(2) +

        "°<br>" +

        "Dirección: " +

        direccion +

        "<br><br>" +

        resultado +

        "<br><br>" +

        "Límite: " +

        POSTE_LIMITE_PLOMADO_GRADOS.toFixed(2) +

        "°"

    );

}

                (
                    touch.clientY -
                    rect.top
                ) *
                (
                    canvas.height /
                    rect.height
                );


            colocarFlechaCamara(
                x,
                y
            );

        },
        {
            passive:false
        }
    );

}


/*====================================================
 ACTIVAR SEÑALAMIENTO
====================================================*/

function activarSenalamientoCamara(){

    if(!stream){

        alert(
            "La cámara todavía no está lista."
        );

        return;

    }


    cameraSenalarActivo =
        true;


    const video =
        document.getElementById(
            "cameraVideo"
        );


    const canvas =
        document.getElementById(
            "cameraArrowCanvas"
        );


    if(!video || !canvas){

        return;

    }


    canvas.width =
        video.videoWidth || 1280;

    canvas.height =
        video.videoHeight || 720;


    canvas.style.display =
        "block";


    dibujarFlechaCamara();


    const boton =
        document.getElementById(
            "cameraMarkButton"
        );


    if(boton){

        boton.style.display =

    }

        );

    mostrarEstadoCamara(

        "Toque sobre el elemento que desea señalar."

    );

}


/*====================================================
 CANCELAR SEÑALAMIENTO
====================================================*/

function cancelarSenalamientoCamara(){

    cameraSenalarActivo =
        false;

    cameraFlechaX =
        null;

    cameraFlechaY =
        null;


    const canvas =
        document.getElementById(
            "cameraArrowCanvas"
        );


    if(canvas){

        const ctx =
            canvas.getContext("2d");


        ctx.clearRect(
            0,
            0,

        );

/*====================================================
 SELECCIONAR PUNTO FLECHA
====================================================*/

function seleccionarPuntoFlecha(event){

    if(!cameraSenalarActivo){

        return;

    }


    const canvas =
        document.getElementById(
            "cameraArrowCanvas"
        );


    if(!canvas){

        return;

    }


    const rect =
        canvas.getBoundingClientRect();


    const x =
        (
            event.clientX -
            rect.left
        ) *
        (
            canvas.width /
            rect.width
        );


    const y =
        (
            event.clientY -
            rect.top
        ) *
        (
            canvas.height /
            rect.height
        );


    colocarFlechaCamara(
        x,
        y
    );

}


/*====================================================
 COLOCAR FLECHA
====================================================*/

function colocarFlechaCamara(
    x,

){

        document.getElementById(
            "cameraVideo"

        return;

        video.videoWidth;

        video.videoHeight;


    if(!width || !height){

        return;

    }


    const scale =
        Math.max(
            width,
            height
        ) / 1200;


    const padding =
        Math.round(
            24 * scale
        );


    const lineHeight =
        Math.round(
            30 * scale
        );


    const boxHeight =
        Math.round(
            (
                7 *
                lineHeight
            ) +
            padding * 2
        );


    const stampTop =
        height -
        boxHeight -
        padding;


    const margen =
        Math.round(
            25 * scale
        );


    const maxY =
        stampTop -
        margen;


    if(y > maxY){

        y =
            maxY;


        mostrarEstadoCamara(

            "⚠️ Esa zona está reservada para el estampado.<br>" +

            "La flecha fue colocada justo arriba."

        );

    }

      Math.max(

/*====================================================
 DIBUJAR LOGO
====================================================*/

function dibujarLogoEnCanvas(
  ctx,
  width,
  height
){

  if(
    !logoListo ||
    !logoImagen
  ){

    zonaLogo =
      null;

    return;

  }


  const maxWidth =
    width * 0.18;


  const maxHeight =
    height * 0.14;


  const proporcion =
    Math.min(

      maxWidth /
      logoImagen.width,

      maxHeight /
      logoImagen.height

    );


  const logoWidth =
    logoImagen.width *
    proporcion;


  const logoHeight =
    logoImagen.height *
    proporcion;


  const margen =
    Math.max(
      20,
      Math.round(
        width * 0.025
      )
    );


  const logoX =
    width -
    logoWidth -
    margen;


  const logoY =
    margen;


  const bloqueo =
    Math.max(
      15,
      Math.round(
        width * 0.012
      )
    );


  zonaLogo = {

    x:
      logoX -
      bloqueo,

    y:
      logoY -
      bloqueo,

    width:
      logoWidth +
      bloqueo * 2,

    height:
      logoHeight +
      bloqueo * 2

  };


  ctx.save();


  ctx.fillStyle =
    "rgba(0,0,0,.20)";


  ctx.fillRect(

    logoX -
    5,

    logoY -
    5,

    logoWidth +
    10,

    logoHeight +
    10

  );


  ctx.drawImage(

    logoImagen,

    logoX,

    logoY,

    logoWidth,

    logoHeight

  );


  ctx.restore();


  console.log(
    "ZONA LOGO BLOQUEADA:",
    zonaLogo
  );

}

/*====================================================
 OBTENER PUNTO DEL EVENTO
====================================================*/

function obtenerPuntoEvento(
  event
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        event.clientY -
        rect.top
      ) *
      escalaY

  };

}

        event
      );


    if(
      flechaX === null ||
      flechaY === null
    ){

      if(
        flechaChocaConZonas(
          punto.x,
          punto.y,
          0,
          1
        )
      ){

        alert(
          "🚫 La flecha no puede colocarse sobre el logo ni sobre el estampado."
        );

        return;

      }


      flechaX =
        punto.x;


      flechaY =
        punto.y;


      flechaAngulo =
        0;


      flechaEscala =
        1;


      dibujarFlecha();

    }

  }
);


/*====================================================
 TOUCH START
====================================================*/

arrowCanvas.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();


    ultimoToque =
      Date.now();


    const touches =
      event.touches;


    if(
      touches.length === 1
    ){

      const punto =
        obtenerPuntoEvento(
          touches[0]
        );


      if(
        flechaX === null
      ){

        if(
          flechaChocaConZonas(
            punto.x,
            punto.y,
            0,
            1
          )
        ){

          alert(
            "🚫 La flecha no puede colocarse sobre el logo ni sobre el estampado."
          );

          return;

        }


        flechaX =
          punto.x;


        flechaY =
          punto.y;


        flechaAngulo =
          0;


        flechaEscala =
          1;


        dibujarFlecha();

      }


      gestoActivo =
        true;


      toqueInicial = {

        tipo:
          "move",

        x:
          punto.x,

        y:
          punto.y,

        flechaX:
          flechaX,

        flechaY:
          flechaY

      };

    }


    else if(
      touches.length === 2 &&
      flechaX !== null
    ){

      gestoActivo =
        true;


      const p1 =
        obtenerPuntoEvento(
          touches[0]
        );


      const p2 =
        obtenerPuntoEvento(
          touches[1]
        );


      const centroX =
        (
          p1.x +
          p2.x
        ) / 2;


      const centroY =
        (
          p1.y +
          p2.y
        ) / 2;


      const distancia =
        Math.hypot(

          p2.x -
          p1.x,

          p2.y -
          p1.y

        );


      const angulo =
        Math.atan2(

          p2.y -
          p1.y,

          p2.x -
          p1.x

        );


      toqueInicial = {

        tipo:
          "transform",

        centroX:
          centroX,

        centroY:
          centroY,

        distancia:
          distancia,

        angulo:
          angulo,

        flechaX:
          flechaX,

        flechaY:
          flechaY,

        escala:
          flechaEscala,

        rotacion:
          flechaAngulo

      };

    }

  },
  {
    passive:false
  }
);


/*====================================================
 TOUCH MOVE
====================================================*/

arrowCanvas.addEventListener(
  "touchmove",
  function(event){

    event.preventDefault();


    if(
      !gestoActivo ||
      !toqueInicial
    ){

      return;

    }


    const touches =
      event.touches;


    if(
      touches.length === 1 &&
      toqueInicial.tipo === "move"
    ){

      const punto =
        obtenerPuntoEvento(
          touches[0]
        );


      const dx =
        punto.x -
        toqueInicial.x;


      const dy =
        punto.y -
        toqueInicial.y;


      const nuevoX =
        toqueInicial.flechaX +
        dx;


      const nuevoY =
        toqueInicial.flechaY +
        dy;


      if(
        !flechaChocaConZonas(
          nuevoX,
          nuevoY,
          flechaAngulo,
          flechaEscala
        )
      ){

        flechaX =
          nuevoX;


        flechaY =
          nuevoY;


        dibujarFlecha();

      }

    }


    else if(
      touches.length === 2 &&
      toqueInicial.tipo ===
        "transform"
    ){

      const p1 =
        obtenerPuntoEvento(
          touches[0]
        );


      const p2 =
        obtenerPuntoEvento(
          touches[1]
        );


      const centroX =
        (
          p1.x +
          p2.x
        ) / 2;


      const centroY =
        (
          p1.y +
          p2.y
        ) / 2;


      const distancia =
        Math.hypot(

          p2.x -
          p1.x,

          p2.y -
          p1.y

        );


      const angulo =
        Math.atan2(

          p2.y -
          p1.y,

          p2.x -
          p1.x

        );


      let nuevaEscala =
        toqueInicial.escala *
        (
          distancia /
          toqueInicial.distancia
        );


      nuevaEscala =
        Math.max(
          0.35,
          Math.min(
            3,
            nuevaEscala
          )
        );


      const nuevaRotacion =
        toqueInicial.rotacion +
        (
          angulo -
          toqueInicial.angulo
        );


      if(
        !flechaChocaConZonas(
          toqueInicial.flechaX,
          toqueInicial.flechaY,
          nuevaRotacion,
          nuevaEscala
        )
      ){

        flechaAngulo =
          nuevaRotacion;


        flechaEscala =
          nuevaEscala;


        dibujarFlecha();

      }

    }

  },
  {
    passive:false
  }
);


/*====================================================
 TOUCH END
====================================================*/

arrowCanvas.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();


    if(
      event.touches.length === 0
    ){

      gestoActivo =
        false;


      toqueInicial =
        null;

    }

  },
  {
    passive:false
  }
);


/*====================================================
 COMPROBAR ZONAS PROHIBIDAS
====================================================*/

function flechaChocaConZonas(
  x,
  y,
  angulo,
  escala
){

  const factor =
    Math.max(
      arrowCanvas.width,
      arrowCanvas.height
    ) / 1200;


  const longitud =
    150 *
    factor *
    escala;


  const grosor =
    Math.max(
      8,
      9 *
      factor *
      escala
    );


  const inicioX =
    x -
    longitud *
    Math.cos(
      angulo +
      Math.PI / 4
    );


  const inicioY =
    y -
    longitud *
    Math.sin(
      angulo +
      Math.PI / 4
    );


  const pasos =
    18;


  for(
    let i = 0;
    i <= pasos;
    i++
  ){

    const t =
      i / pasos;


    const px =
      inicioX +
      (
        x -
        inicioX
      ) *
      t;


    const py =
      inicioY +
      (
        y -
        inicioY
      ) *
      t;


    const margen =
      grosor *
      1.8;


    const puntos = [

      {
        x:px,
        y:py
      },

      {
        x:px + margen,
        y:py
      },

      {
        x:px - margen,
        y:py
      },

      {
        x:px,
        y:py + margen
      },

      {
        x:px,
        y:py - margen
      }

    ];


    for(
      const punto of puntos
    ){

      if(
        puntoEnRectangulo(
          punto.x,
          punto.y,
          zonaEstampado
        )
      ){

        return true;

      }


      if(
        puntoEnRectangulo(
          punto.x,
          punto.y,
          zonaLogo
        )
      ){

        return true;

      }

    }

  }


  const punta =
    32 *
    factor *
    escala;


  const cabezaPuntos = [

    {
      x:x,
      y:y
    },

    {
      x:x + punta,
      y:y
    },

    {
      x:x - punta,
      y:y
    },

    {
      x:x,
      y:y + punta
    },

    {
      x:x,
      y:y - punta
    }

  ];


  for(
    const punto of cabezaPuntos
  ){

    if(
      puntoEnRectangulo(
        punto.x,
        punto.y,
        zonaEstampado
      )
    ){

      return true;

    }


    if(
      puntoEnRectangulo(
        punto.x,
        punto.y,
        zonaLogo
      )
    ){

      return true;

    }

  }


  return false;

}


/*====================================================
 PUNTO EN RECTANGULO
====================================================*/

function puntoEnRectangulo(
  x,
  y,
  rect
){

  if(!rect){

    return false;

  }


  return (

    x >= rect.x &&

    x <=
      rect.x +
      rect.width &&

    y >= rect.y &&

    y <=
      rect.y +
      rect.height

  );

}


/*====================================================
 DIBUJAR FLECHA
====================================================*/

function dibujarFlecha(){

  if(
    flechaX === null ||
    flechaY === null
  ){

    return;

  }


  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(

        0,
        0,

        arrowCanvas.width,
        arrowCanvas.height

      );


      ctx.drawImage(

        imagen,

        0,
        0

      );


      const factor =
        Math.max(

          arrowCanvas.width,

          arrowCanvas.height

        ) / 1200;


      const longitud =
        150 *
        factor *
        flechaEscala;


      const punta =
        32 *
        factor *
        flechaEscala;


      const inicioX =
        flechaX -
        longitud *
        Math.cos(
          flechaAngulo +
          Math.PI / 4
        );


      const inicioY =
        flechaY -
        longitud *
        Math.sin(
          flechaAngulo +
          Math.PI / 4
        );


      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        Math.max(
          12,
          13 *
          factor *
          flechaEscala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#00ff00";


      ctx.lineWidth =
        Math.max(
          7,
          9 *
          factor *
          flechaEscala
        );


      ctx.lineCap =
        "round";


      ctx.stroke();


      const angulo =
        Math.atan2(

          flechaY -
          inicioY,

          flechaX -
          inicioX

        );


      ctx.beginPath();


      ctx.moveTo(

        flechaX,

        flechaY

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo -
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo -
          Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo +
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo +
          Math.PI / 6
        )

      );


      ctx.closePath();


      ctx.fillStyle =
        "#00ff00";


      ctx.fill();


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        Math.max(
          3,
          4 *
          factor *
          flechaEscala
        );


      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}

/*====================================================
 ENVIAR FOTO FINAL
====================================================*/

function enviarFotoFinal(
  dataURL,
  ahora,
  posicion
){

  preview.src =
    dataURL;


  preview.style.display =
    "block";


  const nombre =
    crearNombreFoto(
      tipo,
      ahora
    );


  const mensaje = {

    type:
      "CAMERA_STAMP_PHOTO",

    tipo:
      tipo,

    fileName:
      nombre,

    mimeType:
      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null

  };


  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(
      mensaje,
      "*"
    );

  }


  status.textContent =
    "✅ FOTO CAPTURADA.\n\n" +
    "Regresando al formulario...";


  detenerCamara();


  setTimeout(
    function(){

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.focus();

        window.close();

      }
      else{

        status.textContent =
          "✅ FOTO CAPTURADA.\n\n" +
          "Puedes regresar manualmente al formulario.";

      }

    },
    500
  );

}


/*====================================================
 GPS
====================================================*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          resolve({

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          });

        },

        function(error){

          console.warn(
            "GPS ERROR:",
            error
          );


          resolve(null);

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            0

        }

      );

    }
  );

}


/*====================================================
 TIPO FOTO
====================================================*/

function obtenerNombreTipoFoto(
  tipo
){

  if(
    tipo === "poste"
  )
    return "POSTE";


  if(
    tipo === "mega"
  )
    return "CAJAS MEGA";


  if(
    tipo === "medidores"
  )
    return "MEDIDORES";


  if(
    tipo === "carriers"
  )
    return "CAJAS CARRIERS";


  return String(
    tipo || ""
  ).toUpperCase();

}


/*====================================================
 NOMBRE FOTO
====================================================*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)
      .replace(
        /\s+/g,
        "_"
      ) +

    "_" +

    formatFileDate(fecha) +

    ".jpg"

  );

}


/*====================================================
 FECHA ARCHIVO
====================================================*/

function formatFileDate(
  date
){

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const hour =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minute =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const second =
    String(
      date.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day +
    "_" +
    hour +
    minute +
    second

  );

}

 DETENER CÁMARA
====================================================*/

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}
