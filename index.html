<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera Stamp</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  padding: 15px;
}

#cameraContainer {

  width: 100%;

  max-width: 800px;

  height: auto;

  margin: auto;

  position: relative;

  background: #000;

  border-radius: 10px;

  overflow: hidden;

}


/*==================================================
 VIDEO
==================================================*/

#video {

  width: 100%;

  display: block;

  background: #000;

}


#canvas {

  display: none;

}


/*==================================================
 VISOR DE SEÑALAMIENTO
==================================================*/

#arrowEditor {

  display: none;

  position: relative;

  width: 100%;

  background: #000;

  overflow: hidden;

  touch-action: none;

}


#arrowCanvas {

  width: 100%;

  display: block;

  background: #000;

  cursor: crosshair;

  touch-action: none;

}


/*==================================================
 BOTONES
==================================================*/

#cameraControls {

  position: absolute;

  left: 0;

  right: 0;

  bottom: 0;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 6px;

  padding: 8px;

  background: linear-gradient(
    transparent,
    rgba(0,0,0,.85)
  );

  z-index: 10;

}


#cameraControls button {

  flex: 0 1 auto;

  width: auto;

  min-width: 90px;

  max-width: 130px;

  min-height: 42px;

  padding: 7px 10px;

  font-size: 13px;

  font-weight: bold;

  border: none;

  border-radius: 7px;

  cursor: pointer;

  white-space: nowrap;

}


#startButton {

  background: #2196f3;

  color: white;

}


#takeButton {

  background: #4caf50;

  color: white;

}


#signalButton {

  background: #ff9800;

  color: white;

}


#signalButton.active {

  background: #e65100;

  box-shadow:
    0 0 0 3px rgba(255,152,0,.35);

}


#cancelButton {

  background: #f44336;

  color: white;

}


#confirmButton {

  background: #4caf50;

  color: white;

  display: none;

}


#cancelSignalButton {

  background: #f44336;

  color: white;

  display: none;

}


#cameraControls button:disabled {

  opacity: .4;

}


/*==================================================
 PREVIEW
==================================================*/

#preview {

  width: 100%;

  max-width: 800px;

  display: none;

  margin: 15px auto;

  border-radius: 8px;

}


/*==================================================
 STATUS
==================================================*/

#status {

  display: none;

}


/*==================================================
 CELULAR
==================================================*/

@media(max-width:600px){

  body {

    padding: 0;

    background: #000;

    overflow: hidden;

  }


  #cameraContainer {

    width: 100vw;

    height: 100vh;

    max-width: none;

    border-radius: 0;

  }


  #video {

    width: 100vw;

    height: 100vh;

    object-fit: cover;

  }


  #arrowEditor {

    width: 100vw;

    height: 100vh;

  }


  #arrowCanvas {

    width: 100vw;

    height: 100%;

    object-fit: contain;

  }


  #cameraControls {

    padding:

      8px

      6px

      calc(8px + env(safe-area-inset-bottom));

    gap: 5px;

  }


  #cameraControls button {

    min-width: 75px;

    max-width: 105px;

    min-height: 40px;

    padding: 6px 7px;

    font-size: 11px;

  }

}

</style>

</head>


<body>


<div id="cameraContainer">


  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <canvas id="canvas"></canvas>


  <!-- ============================================
       VISOR PARA SEÑALAR
  ============================================= -->

  <div id="arrowEditor">

    <canvas
      id="arrowCanvas">
    </canvas>

  </div>


  <!-- ============================================
       CONTROLES
  ============================================= -->

  <div id="cameraControls">


    <button
      id="startButton">

      📷 START

    </button>


    <button
      id="signalButton">

      🎯 SEÑALAR

    </button>


    <button
      id="takeButton"
      disabled>

      📸 FOTO

    </button>


    <button
      id="confirmButton">

      ✅ USAR

    </button>


    <button
      id="cancelSignalButton">

      ❌ CANCELAR

    </button>


    <button
      id="cancelButton">

      ✕ SALIR

    </button>


  </div>


</div>


<img id="preview">


<div id="status"></div>


<script>


/*====================================================
 DATOS RECIBIDOS
====================================================*/

const params =
  new URLSearchParams(
    window.location.search
  );


const tipo =
  params.get("tipo") || "poste";


const proyecto =
  params.get("proyecto") || "";


const tipoProyecto =
  params.get("tipoProyecto") || "";


const hub =
  params.get("hub") || "";


const rama =
  params.get("rama") || "";


/*====================================================
 ELEMENTOS
====================================================*/

const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const preview =
  document.getElementById("preview");


const startButton =
  document.getElementById("startButton");


const signalButton =
  document.getElementById("signalButton");


const takeButton =
  document.getElementById("takeButton");


const confirmButton =
  document.getElementById("confirmButton");


const cancelSignalButton =
  document.getElementById(
    "cancelSignalButton"
  );


const cancelButton =
  document.getElementById("cancelButton");


const status =
  document.getElementById("status");


const arrowEditor =
  document.getElementById(
    "arrowEditor"
  );


const arrowCanvas =
  document.getElementById(
    "arrowCanvas"
  );


/*====================================================
 VARIABLES
====================================================*/

let stream = null;

let modoSenalar = false;

let colocandoFlecha = false;

let flechaX = null;

let flechaY = null;

let flechaAngulo = 0;

let flechaEscala = 1;

let fotoBase = null;

let gpsActual = null;


/*
 * Variables táctiles
 */

let tocando = false;

let toqueInicialX = 0;

let toqueInicialY = 0;

let flechaInicialX = 0;

let flechaInicialY = 0;

let distanciaInicial = null;

let escalaInicial = 1;

let anguloInicial = null;

let anguloFlechaInicial = 0;


/*
 * Para evitar conflictos
 */

let ultimoToque = 0;


/*====================================================
 INICIAR CÁMARA
====================================================*/

startButton.addEventListener(
  "click",
  iniciarCamara
);


async function iniciarCamara(){

  try{

    status.textContent =
      "Solicitando permiso de cámara...";


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "El navegador no permite utilizar la cámara."
      );

    }


    detenerCamara();


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.style.display =
      "none";


    signalButton.style.display =
      "block";


    takeButton.disabled =
      false;


    status.textContent =
      "Cámara lista.";

  }
  catch(error){

    console.error(
      "ERROR CAMERA:",
      error
    );


    status.textContent =
      "NO FUE POSIBLE ABRIR LA CÁMARA.\n\n" +
      error.name +
      "\n" +
      error.message;


    startButton.style.display =
      "block";


    takeButton.disabled =
      true;

  }

}


/*====================================================
 SEÑALAR
====================================================*/

signalButton.addEventListener(
  "click",
  activarSenalar
);


function activarSenalar(){

  modoSenalar =
    !modoSenalar;


  if(modoSenalar){

    signalButton.classList.add(
      "active"
    );


    signalButton.textContent =
      "🎯 ACTIVO";


    status.textContent =
      "Señalamiento activado.\n\n" +
      "Toma la fotografía.";

  }
  else{

    desactivarSenalar();

  }

}


function desactivarSenalar(){

  modoSenalar =
    false;


  signalButton.classList.remove(
    "active"
  );


  signalButton.textContent =
    "🎯 SEÑALAR";

}


/*====================================================
 TOMAR FOTO
====================================================*/

takeButton.addEventListener(
  "click",
  tomarFoto
);


async function tomarFoto(){

  try{

    if(!stream){

      throw new Error(
        "La cámara no está iniciada."
      );

    }


    const width =
      video.videoWidth;


    const height =
      video.videoHeight;


    if(
      !width ||
      !height
    ){

      throw new Error(
        "La cámara todavía no está lista."
      );

    }


    status.textContent =
      "Obteniendo ubicación GPS...";


    const posicion =
      await obtenerGPS();


    gpsActual =
      posicion;


    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );


    const ahora =
      new Date();


    const fecha =
      ahora.toLocaleDateString(
        "es-MX"
      );


    const hora =
      ahora.toLocaleTimeString(
        "es-MX"
      );


    const escala =
      Math.max(
        width,
        height
      ) / 1200;


    const padding =
      Math.round(
        16 * escala
      );


    const font =
      Math.max(
        16,
        Math.round(
          20 * escala
        )
      );


    const altoLinea =
      Math.round(
        27 * escala
      );


    const lineas = [

      "PROYECTO: " +
        (
          proyecto ||
          "SIN PROYECTO"
        ),

      "TIPO PROYECTO: " +
        (
          tipoProyecto ||
          "SIN TIPO"
        ),

      "TIPO FOTO: " +
        obtenerNombreTipoFoto(tipo),

      fecha +
        "  " +
        hora,

      posicion

        ? "LAT: " +
          Number(
            posicion.lat
          ).toFixed(6) +

          "  LON: " +

          Number(
            posicion.lng
          ).toFixed(6)

        : "GPS: SIN UBICACIÓN"

    ];


    ctx.font =
      "bold " +
      font +
      "px Arial";


    let anchoTexto = 0;


    lineas.forEach(
      function(texto){

        const medida =
          ctx.measureText(
            texto
          ).width;


        if(
          medida >
          anchoTexto
        ){

          anchoTexto =
            medida;

        }

      }
    );


    const anchoCaja =
      anchoTexto +
      padding * 2;


    const altoCaja =
      lineas.length *
      altoLinea +
      padding * 2;


    const x =
      padding;


    const y =
      height -
      altoCaja -
      padding;


    ctx.fillStyle =
      "rgba(0,0,0,.42)";


    ctx.beginPath();


    const radio =
      Math.round(
        10 * escala
      );


    ctx.roundRect(
      x,
      y,
      anchoCaja,
      altoCaja,
      radio
    );


    ctx.fill();


    ctx.fillStyle =
      "rgba(255,255,255,.95)";


    ctx.font =
      "bold " +
      font +
      "px Arial";


    ctx.textBaseline =
      "top";


    lineas.forEach(
      function(texto,index){

        ctx.fillText(

          texto,

          x + padding,

          y +
          padding +
          index *
          altoLinea

        );

      }
    );


    fotoBase =
      canvas.toDataURL(
        "image/jpeg",
        0.90
      );


    /*
    ================================================
     SIN SEÑALAR
    ================================================
    */

    if(!modoSenalar){

      enviarFotoFinal(
        fotoBase,
        ahora,
        posicion
      );

      return;

    }


    /*
    ================================================
     ABRIR EDITOR
    ================================================
    */

    abrirVisorFlecha();

  }
  catch(error){

    console.error(
      "ERROR TOMANDO FOTO:",
      error
    );


    status.textContent =
      "ERROR AL TOMAR FOTO:\n\n" +
      error.message;

  }

}


/*====================================================
 ABRIR VISOR
====================================================*/

function abrirVisorFlecha(){

  const imagen =
    new Image();


  imagen.onload =
    function(){

      arrowCanvas.width =
        imagen.width;


      arrowCanvas.height =
        imagen.height;


      flechaX =
        null;


      flechaY =
        null;


      flechaAngulo =
        0;


      flechaEscala =
        1;


      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      arrowEditor.style.display =
        "block";


      video.style.display =
        "none";


      signalButton.style.display =
        "none";


      takeButton.style.display =
        "none";


      confirmButton.style.display =
        "block";


      cancelSignalButton.style.display =
        "block";


      cancelButton.style.display =
        "none";


      colocandoFlecha =
        true;


      status.textContent =
        "Toca para colocar la flecha.\n\n" +
        "👆 Un dedo: mover\n" +
        "✌️ Dos dedos: girar y cambiar tamaño";

    };


  imagen.src =
    fotoBase;

}


/*====================================================
 CONVERTIR COORDENADAS
====================================================*/

function obtenerPuntoEvento(
  event
){

  const rect =
    arrowCanvas.getBoundingClientRect();


  const escalaX =
    arrowCanvas.width /
    rect.width;


  const escalaY =
    arrowCanvas.height /
    rect.height;


  return {

    x:
      (
        event.clientX -
        rect.left
      ) *
      escalaX,

    y:
      (
        event.clientY -
        rect.top
      ) *
      escalaY

  };

}


/*====================================================
 CLICK / TOQUE PARA COLOCAR
====================================================*/

arrowCanvas.addEventListener(
  "click",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    /*
     * Evitar click generado después
     * de usar touch
     */

    if(
      Date.now() -
      ultimoToque <
      500
    ){

      return;

    }


    const punto =
      obtenerPuntoEvento(
        event
      );


    if(
      puntoEstaEnEstampado(
        punto.x,
        punto.y
      )
    ){

      alert(
        "La flecha no puede colocarse sobre el estampado."
      );

      return;

    }


    flechaX =
      punto.x;


    flechaY =
      punto.y;


    flechaAngulo =
      0;


    flechaEscala =
      1;


    dibujarFlecha();

  }
);


/*====================================================
 TOUCH START
====================================================*/

arrowCanvas.addEventListener(
  "touchstart",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    event.preventDefault();


    ultimoToque =
      Date.now();


    const touches =
      event.touches;


    /*
    ================================================
     UN DEDO
    ================================================
    */

    if(
      touches.length === 1
    ){

      const rect =
        arrowCanvas.getBoundingClientRect();


      const escalaX =
        arrowCanvas.width /
        rect.width;


      const escalaY =
        arrowCanvas.height /
        rect.height;


      const x =
        (
          touches[0].clientX -
          rect.left
        ) *
        escalaX;


      const y =
        (
          touches[0].clientY -
          rect.top
        ) *
        escalaY;


      /*
       * Si todavía no existe flecha,
       * colocarla
       */

      if(
        flechaX === null ||
        flechaY === null
      ){

        if(
          puntoEstaEnEstampado(
            x,
            y
          )
        ){

          alert(
            "La flecha no puede colocarse sobre el estampado."
          );

          return;

        }


        flechaX =
          x;


        flechaY =
          y;


        flechaAngulo =
          0;


        flechaEscala =
          1;


        dibujarFlecha();


        return;

      }


      /*
       * Comenzar movimiento
       */

      tocando =
        true;


      toqueInicialX =
        x;


      toqueInicialY =
        y;


      flechaInicialX =
        flechaX;


      flechaInicialY =
        flechaY;


      return;

    }


    /*
    ================================================
     DOS DEDOS
    ================================================
    */

    if(
      touches.length === 2 &&
      flechaX !== null
    ){

      distanciaInicial =
        obtenerDistanciaTouches(
          touches
        );


      escalaInicial =
        flechaEscala;


      anguloInicial =
        obtenerAnguloTouches(
          touches
        );


      anguloFlechaInicial =
        flechaAngulo;

    }

  },
  {
    passive:false
  }
);


/*====================================================
 TOUCH MOVE
====================================================*/

arrowCanvas.addEventListener(
  "touchmove",
  function(event){

    if(!colocandoFlecha){

      return;

    }


    event.preventDefault();


    const touches =
      event.touches;


    /*
    ================================================
     UN DEDO = MOVER
    ================================================
    */

    if(
      touches.length === 1 &&
      tocando &&
      flechaX !== null
    ){

      const rect =
        arrowCanvas.getBoundingClientRect();


      const escalaX =
        arrowCanvas.width /
        rect.width;


      const escalaY =
        arrowCanvas.height /
        rect.height;


      const x =
        (
          touches[0].clientX -
          rect.left
        ) *
        escalaX;


      const y =
        (
          touches[0].clientY -
          rect.top
        ) *
        escalaY;


      const diferenciaX =
        x -
        toqueInicialX;


      const diferenciaY =
        y -
        toqueInicialY;


      const nuevoX =
        flechaInicialX +
        diferenciaX;


      const nuevoY =
        flechaInicialY +
        diferenciaY;


      /*
       * No permitir que el punto
       * entre en el estampado
       */

      if(
        !puntoEstaEnEstampado(
          nuevoX,
          nuevoY
        )
      ){

        flechaX =
          nuevoX;


        flechaY =
          nuevoY;

      }


      dibujarFlecha();

      return;

    }


    /*
    ================================================
     DOS DEDOS = GIRAR + ESCALAR
    ================================================
    */

    if(
      touches.length === 2 &&
      flechaX !== null
    ){

      const distanciaActual =
        obtenerDistanciaTouches(
          touches
        );


      const anguloActual =
        obtenerAnguloTouches(
          touches
        );


      /*
       * ESCALA
       */

      if(
        distanciaInicial &&
        distanciaInicial > 0
      ){

        let nuevaEscala =
          escalaInicial *
          (
            distanciaActual /
            distanciaInicial
          );


        /*
         * Límites de tamaño
         */

        nuevaEscala =
          Math.max(
            0.35,
            Math.min(
              3.5,
              nuevaEscala
            )
          );


        flechaEscala =
          nuevaEscala;

      }


      /*
       * ROTACIÓN
       */

      if(
        anguloInicial !== null
      ){

        flechaAngulo =
          anguloFlechaInicial +
          (
            anguloActual -
            anguloInicial
          );

      }


      dibujarFlecha();

    }

  },
  {
    passive:false
  }
);


/*====================================================
 TOUCH END
====================================================*/

arrowCanvas.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();


    if(
      event.touches.length === 0
    ){

      tocando =
        false;

    }


    /*
     * Si queda un dedo después
     * de dos dedos, reiniciar movimiento
     */

    if(
      event.touches.length === 1 &&
      flechaX !== null
    ){

      const rect =
        arrowCanvas.getBoundingClientRect();


      const escalaX =
        arrowCanvas.width /
        rect.width;


      const escalaY =
        arrowCanvas.height /
        rect.height;


      const x =
        (
          event.touches[0].clientX -
          rect.left
        ) *
        escalaX;


      const y =
        (
          event.touches[0].clientY -
          rect.top
        ) *
        escalaY;


      toqueInicialX =
        x;


      toqueInicialY =
        y;


      flechaInicialX =
        flechaX;


      flechaInicialY =
        flechaY;


      tocando =
        true;

    }

  },
  {
    passive:false
  }
);


/*====================================================
 DISTANCIA ENTRE DOS DEDOS
====================================================*/

function obtenerDistanciaTouches(
  touches
){

  const dx =
    touches[1].clientX -
    touches[0].clientX;


  const dy =
    touches[1].clientY -
    touches[0].clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/*====================================================
 ÁNGULO ENTRE DOS DEDOS
====================================================*/

function obtenerAnguloTouches(
  touches
){

  return Math.atan2(

    touches[1].clientY -
    touches[0].clientY,

    touches[1].clientX -
    touches[0].clientX

  );

}


/*====================================================
 VERIFICAR ESTAMPADO
====================================================*/

function puntoEstaEnEstampado(
  x,
  y
){

  const width =
    arrowCanvas.width;


  const height =
    arrowCanvas.height;


  const escala =
    Math.max(
      width,
      height
    ) / 1200;


  const padding =
    Math.round(
      16 * escala
    );


  const font =
    Math.max(
      16,
      Math.round(
        20 * escala
      )
    );


  const altoLinea =
    Math.round(
      27 * escala
    );


  const lineas = [

    "PROYECTO: " +
      (
        proyecto ||
        "SIN PROYECTO"
      ),

    "TIPO PROYECTO: " +
      (
        tipoProyecto ||
        "SIN TIPO"
      ),

    "TIPO FOTO: " +
      obtenerNombreTipoFoto(tipo),

    "FECHA / HORA",

    "LAT / LON"

  ];


  const ctx =
    arrowCanvas.getContext(
      "2d"
    );


  ctx.font =
    "bold " +
    font +
    "px Arial";


  let anchoTexto = 0;


  lineas.forEach(
    function(texto){

      const medida =
        ctx.measureText(
          texto
        ).width;


      if(
        medida >
        anchoTexto
      ){

        anchoTexto =
          medida;

      }

    }
  );


  const anchoCaja =
    anchoTexto +
    padding * 2;


  const altoCaja =
    lineas.length *
    altoLinea +
    padding * 2;


  const cajaX =
    padding;


  const cajaY =
    height -
    altoCaja -
    padding;


  const margen =
    25 * escala;


  return (

    x >=
      cajaX - margen &&

    x <=
      cajaX +
      anchoCaja +
      margen &&

    y >=
      cajaY - margen &&

    y <=
      cajaY +
      altoCaja +
      margen

  );

}


/*====================================================
 DIBUJAR FLECHA
====================================================*/

function dibujarFlecha(){

  if(
    flechaX === null ||
    flechaY === null
  ){

    return;

  }


  const imagen =
    new Image();


  imagen.onload =
    function(){

      const ctx =
        arrowCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        arrowCanvas.width,
        arrowCanvas.height
      );


      ctx.drawImage(
        imagen,
        0,
        0
      );


      const escalaBase =
        Math.max(
          arrowCanvas.width,
          arrowCanvas.height
        ) / 1200;


      /*
      ================================================
       TAMAÑO
      ================================================
      */

      const longitud =
        150 *
        escalaBase *
        flechaEscala;


      const punta =
        34 *
        escalaBase *
        flechaEscala;


      const grosor =
        Math.max(
          7,
          9 *
          escalaBase *
          flechaEscala
        );


      /*
      ================================================
       DIRECCIÓN
      ================================================
      */

      const angulo =
        flechaAngulo;


      /*
       * La punta está en flechaX/Y.
       * La cola se calcula hacia atrás.
       */

      const inicioX =
        flechaX -
        longitud *
        Math.cos(
          angulo
        );


      const inicioY =
        flechaY -
        longitud *
        Math.sin(
          angulo
        );


      /*
      ================================================
       BORDE NEGRO
      ================================================
      */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "rgba(0,0,0,.85)";


      ctx.lineWidth =
        grosor +
        7;


      ctx.lineCap =
        "round";


      ctx.stroke();


      /*
      ================================================
       FLECHA VERDE
      ================================================
      */

      ctx.beginPath();


      ctx.moveTo(
        inicioX,
        inicioY
      );


      ctx.lineTo(
        flechaX,
        flechaY
      );


      ctx.strokeStyle =
        "#00ff3c";


      ctx.lineWidth =
        grosor;


      ctx.lineCap =
        "round";


      ctx.stroke();


      /*
      ================================================
       CABEZA
      ================================================
      */

      ctx.beginPath();


      ctx.moveTo(

        flechaX,

        flechaY

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo -
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo -
          Math.PI / 6
        )

      );


      ctx.lineTo(

        flechaX -
        punta *
        Math.cos(
          angulo +
          Math.PI / 6
        ),

        flechaY -
        punta *
        Math.sin(
          angulo +
          Math.PI / 6
        )

      );


      ctx.closePath();


      ctx.fillStyle =
        "#00ff3c";


      ctx.fill();


      /*
      ================================================
       BORDE DE LA CABEZA
      ================================================
      */

      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        Math.max(
          2,
          3 *
          escalaBase *
          flechaEscala
        );


      ctx.stroke();


      /*
      ================================================
       PUNTO DE CONTROL
      ================================================
      */

      ctx.beginPath();


      ctx.arc(

        flechaX,

        flechaY,

        10 *
        escalaBase *
        flechaEscala,

        0,

        Math.PI * 2

      );


      ctx.fillStyle =
        "#00ff3c";


      ctx.fill();


      ctx.strokeStyle =
        "#000000";


      ctx.lineWidth =
        3 *
        escalaBase *
        flechaEscala;


      ctx.stroke();

    };


  imagen.src =
    fotoBase;

}

/*====================================================
 ENVIAR FOTO
====================================================*/

function enviarFotoFinal(
  dataURL,
  ahora,
  posicion
){

  preview.src =
    dataURL;


  preview.style.display =
    "block";


  const nombre =
    crearNombreFoto(
      tipo,
      ahora
    );


  const mensaje = {

    type:
      "CAMERA_STAMP_PHOTO",

    tipo:
      tipo,

    fileName:
      nombre,

    mimeType:
      "image/jpeg",

    data:
      dataURL,

    latitud:
      posicion
        ? posicion.lat
        : null,

    longitud:
      posicion
        ? posicion.lng
        : null

  };


  if(
    window.opener &&
    !window.opener.closed
  ){

    window.opener.postMessage(
      mensaje,
      "*"
    );

  }


  status.textContent =
    "FOTO CAPTURADA.\n\n" +
    "Regresando al formulario...";


  detenerCamara();


  setTimeout(
    function(){

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.focus();

        window.close();

      }
      else{

        status.textContent =
          "FOTO CAPTURADA.";

      }

    },
    500
  );

}


/*====================================================
 GPS
====================================================*/

function obtenerGPS(){

  return new Promise(
    function(resolve){

      if(
        !navigator.geolocation
      ){

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position){

          resolve({

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          });

        },


        function(error){

          console.warn(
            "GPS ERROR:",
            error
          );


          resolve(null);

        },


        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            0

        }

      );

    }
  );

}


/*====================================================
 NOMBRE TIPO
====================================================*/

function obtenerNombreTipoFoto(tipo){

  if(
    tipo === "poste"
  ){

    return "POSTE";

  }


  if(
    tipo === "mega"
  ){

    return "CAJAS MEGA";

  }


  if(
    tipo === "medidores"
  ){

    return "MEDIDORES";

  }


  if(
    tipo === "carriers"
  ){

    return "CAJAS CARRIERS";

  }


  return String(
    tipo || ""
  ).toUpperCase();

}


/*====================================================
 NOMBRE FOTO
====================================================*/

function crearNombreFoto(
  tipo,
  fecha
){

  return (

    "STAMPED_" +

    obtenerNombreTipoFoto(tipo)
      .replace(
        /\s+/g,
        "_"
      ) +

    "_" +

    formatFileDate(
      fecha
    ) +

    ".jpg"

  );

}


/*====================================================
 FECHA ARCHIVO
====================================================*/

function formatFileDate(
  date
){

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const hour =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minute =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const second =
    String(
      date.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (

    year +
    month +
    day +
    "_" +
    hour +
    minute +
    second

  );

}

function detenerCamara(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  stream =
    null;


  video.srcObject =
    null;


  takeButton.disabled =
    true;

}
